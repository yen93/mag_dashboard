<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Log — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Monthly Log — bespoke visual layer following
       DESIGN_GUIDE.md and marketing.html. Mock data only.
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
      --ml-done-bg: color-mix(in srgb, var(--pos) 15%, transparent);
      --ml-done-fg: #156e4e;
      --ml-late-bg: color-mix(in srgb, #f0a63b 20%, transparent);
      --ml-late-fg: #8c5312;
      --ml-pend-bg: var(--surface-2);
      --ml-pend-fg: var(--text);
      --ml-btn-border: #2a6f57;
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
      --ml-done-fg: var(--pos);
      --ml-late-fg: #f0a63b;
      --ml-btn-border: var(--pos);
    }

    /* Full-width layout matching marketing.html */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards */
    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .card-head.block-head {
      display: block;
      margin-bottom: 14px;
    }
    .card-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .chart-cap {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Controls bar + segmented toggles (same as marketing.html) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* Top 2-column row: Update status (left) + October notes (right) */
    .ml-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) {
      .ml-top { grid-template-columns: 1fr; }
    }
    .ml-card {
      padding: 22px 24px;
    }

    /* Tables */
    .ml-table-wrap {
      overflow-x: auto;
    }
    table.ml-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.ml-table th,
    table.ml-table td {
      padding: 12px 10px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    table.ml-table th:first-child,
    table.ml-table td:first-child {
      text-align: left;
      padding-left: 4px;
    }
    table.ml-table th:last-child,
    table.ml-table td:last-child {
      padding-right: 4px;
    }
    table.ml-table thead th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding-top: 6px;
      padding-bottom: 10px;
    }
    table.ml-table tbody td {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Status badges in Update status table */
    .ml-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }
    .ml-badge.done {
      background: var(--ml-done-bg);
      color: var(--ml-done-fg);
    }
    .ml-badge.late {
      background: var(--ml-late-bg);
      color: var(--ml-late-fg);
    }
    .ml-badge.pending {
      background: var(--ml-pend-bg);
      color: var(--ml-pend-fg);
      border: 1px solid var(--border);
    }

    /* Notes card items */
    .ml-notes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }
    .ml-note-item .note-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .ml-note-item .note-body {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Bottom action row */
    .ml-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .ml-download-btn {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--ml-btn-border);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .ml-download-btn:hover {
      background: var(--surface-2);
      transform: translateY(-1px);
      box-shadow: var(--mkt-shadow);
    }

    /* "See deals" toggle button — same pill style as sales_overview's
       "See ACS Deals Table" toggle (.acs-reset). */
    .acs-reset {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background .16s ease, border-color .16s ease;
    }
    .acs-reset:hover { background: var(--surface-2); border-color: var(--mkt-accent); }
    /* Source dot in the deals table (same as leads_bookings). */
    .src-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 7px; vertical-align: middle;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
    <a class="tab" href="builds_monitoring.html">AI &amp; Automation</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar. The custom date range stays here (it adds the "Selected range"
           column to the Yearly summary). The per-FY toggle lives inside the
           "Deals behind the summary" table below, since it only filters that table. -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span id="drAnchor" hidden></span>
          <div class="spacer" style="flex:1"></div>
          <span class="muted" id="fyNote" style="font-size:13px">Data through October 2026 · October provisional until 8 November</span>
        </div>
      </div>

      <!-- Yearly summary table card -->
      <div class="card ml-card">
        <div class="card-head block-head">
          <h3 id="summaryHeading">Yearly summary <span class="head-info"
            data-info="FY and calendar-year totals for each marketing measure. Per-measure definitions are on each row's ⓘ."
            data-src="GET /api/marketing/overview (Keynote enquiries / bookings) + GET /api/marketing/roi (Marketing revenue / spend / ROI); Cadence delivered pending."></span></h3>
        </div>
        <div class="ml-table-wrap" tabindex="0" role="region" aria-labelledby="summaryHeading">
          <table class="ml-table" style="min-width:680px">
            <thead>
              <tr id="summaryHead">
                <th>Measure</th>
                <th>FY25</th>
                <th>FY26</th>
                <th>FY27</th>
                <th>CY2025</th>
                <th>CY2026</th>
              </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
          </table>
        </div>
      </div>

      <div class="ml-actions" style="justify-content:space-between">
        <button type="button" class="acs-reset" id="summaryDealsToggle" aria-expanded="false">See deals behind the summary</button>
        <button type="button" class="ml-download-btn" id="downloadExcelBtn">Download as Excel (tracker layout)</button>
      </div>

      <!-- ============ DEALS BEHIND THE SUMMARY (hidden by default; toggled above) ============
           The individual deals/leads that make up the Yearly summary's Keynote enquiries /
           bookings rows — one row per deal across the four lead sources. Same source + columns
           as the Leads & Bookings "All leads" table, reconciling with the summary counts. -->
      <div class="card ml-card" id="summaryDealsSection" style="display:none;margin-top:16px">
        <div class="card-head block-head">
          <h3 id="dealsHeading">Deals behind the summary <span class="head-info"
            data-info="Every individual lead/deal behind the Yearly summary's Keynote enquiries and bookings — one row per deal across the four sources (Google/Bing/Paid Ads, Organic, Tailor, Bureau), with its FY, date, organisation, deal, status and value (AUD). Booking = won deal. Filtered to the selected FY (or custom date range); sort, search and filter per column."
            data-src="GET /api/marketing/leads-by-source — pre-FY27 Paid Ads from roas_counted_deals; FY27+ Google Ads / Bing Ads + Organic from ga4_ac_contact_source (cpc / organic rows, excl. non-keynote funnel pages + free-gift opt-ins); Tailor/Bureau from ac_indirect_deals (excl. paid); FY from cdate."></span></h3>
          <div class="muted" style="font-size:12px;margin-top:4px" id="dealsCount"></div>
        </div>
        <!-- Financial-year filter — scoped to THIS table (the toggle doesn't affect the
             Yearly summary / status / notes above). -->
        <div class="mkt-controls" style="margin-bottom:14px">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
        </div>
        <div id="summaryDealsRows"></div>
      </div>

      <!-- Pending cards, below the Yearly summary: Update status (left) + Notes (right) -->
      <div class="ml-top" style="margin-top:16px;margin-bottom:0">
        <div class="card ml-card">
          <div class="card-head block-head">
            <h3 id="statusHeading">Update status <span class="head-info"
              data-info="Whether each month's log was filled in by its due date (the 8th of the following month). Not tracked live yet."
              data-src="pending — no data source wired yet."></span></h3>
          </div>
          <div class="ml-table-wrap" tabindex="0" role="region" aria-labelledby="statusHeading">
            <table class="ml-table">
              <thead>
                <tr>
                  <th>Month</th>
                  <th>Due</th>
                  <th>Updated</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="statusBody"></tbody>
            </table>
          </div>
        </div>

        <div class="card ml-card">
          <div class="card-head block-head">
            <h3 id="notesHeading">October notes <span class="head-info"
              data-info="Free-text notes captured for the month from the tracker's Notes rows. Not tracked live yet."
              data-src="pending — no data source wired yet."></span></h3>
          </div>
          <div class="ml-notes-list" id="notesList"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js?v=14"></script>
  <script>
    /* Monthly Log — Frontend-only mock data view.
       Default active FY (FY27) renders the exact figures from the reference design. */

    /* ----- Yearly summary — LIVE (see measure_source) -----
       Keynote enquiries / Keynote bookings ← GET /api/marketing/overview
         (same source as marketing.html's "Keynote enquiries" / "Keynote bookings" cards:
          deals/leads created per FY across paid + organic + indirect; bookings = won only).
       Marketing revenue / Marketing spend  ← GET /api/marketing/roi
         (same source as marketing.html's "Marketing revenue" / "Marketing spend" cards:
          row.marketingRevenue and row.totalSpend).
       Marketing ROI = (marketingRevenue ÷ marketingSpend − 1) × 100
         (same definition as spend_roi.html's "Marketing ROI" card).
       Cadence delivered → pending (no DB source).
       The FY columns read each source's per-FY totals; the calendar-year (CY) columns
       sum each source's per-MONTH series by calendar year. */
    var OVS  = { enqFy: {}, bookFy: {}, enqMon: [], bookMon: [], loaded: false }; // /api/marketing/overview
    var ROIS = { byFy: {}, byMon: [], loaded: false };                            // /api/marketing/roi
    var SUMMARY_RENDER = [];   // the rows last rendered (for the CSV download)

    // Custom date range (beside the inert FY toggle). When active, a "Selected range" column
    // is added to the Yearly summary, each live measure summed over the months in the range
    // (month-level, from the overview + ROI monthly series). The pending rows stay pending.
    var CUSTOM = false;
    function monthInRange(ym) {
      var r = getDateRange();
      var fm = r.from ? r.from.slice(0, 7) : '', tm = r.to ? r.to.slice(0, 7) : '';
      return (!fm || ym >= fm) && (!tm || ym <= tm);
    }

    // Sum a per-month series ([{ month:'YYYY-MM', ... }]) over one calendar year.
    function cySum(months, year, key) {
      var yr = String(year), total = 0, any = false;
      (months || []).forEach(function (m) {
        if (String(m.month).slice(0, 4) === yr) { total += (m[key] || 0); any = true; }
      });
      return any ? total : null;
    }
    // Sum a per-month series over the active custom date range (month-level).
    function rangeSum(months, key) {
      var total = 0, any = false;
      (months || []).forEach(function (m) {
        if (monthInRange(m.month)) { total += (m[key] || 0); any = true; }
      });
      return any ? total : null;
    }

    // Per-FY accessors (fe = FY END year: FY25 → 2025, FY26 → 2026, FY27 → 2027).
    function enqFy(fe)   { var r = OVS.enqFy[fe];  return r ? r.total : null; }
    function bookFy(fe)  { var r = OVS.bookFy[fe]; return r ? r.total : null; }
    function revFy(fe)   { var r = ROIS.byFy[fe];  return (r && r.marketingRevenue != null) ? r.marketingRevenue : null; }
    function spendFy(fe) { var r = ROIS.byFy[fe];  return (r && r.hasSpend) ? r.totalSpend : null; }
    function roiFrom(rev, spend) { return (rev != null && spend) ? (rev / spend - 1) * 100 : null; }

    // FY26-vs-FY25 delta: % change for counts/currency, points change for ROI.
    function diffFor(kind, a, b) {
      if (a == null || b == null) return null;
      if (kind === 'roi') return { type: 'pts', v: Math.round(b) - Math.round(a) };
      if (!a) return null;   // avoid divide-by-zero
      return { type: 'pct', v: (b - a) / Math.abs(a) * 100 };
    }
    function mkRow(measure, kind, fy25, fy26, fy27, cy25, cy26, info, rng) {
      return {
        measure: measure, kind: kind, info: info,
        fy25: fy25, fy26: fy26, fy27: fy27, cy25: cy25, cy26: cy26,
        diff: diffFor(kind, fy25, fy26),
        rng: (rng === undefined ? null : rng),
      };
    }

    function buildSummaryRows() {
      var rows = [];
      var rEnq = CUSTOM ? rangeSum(OVS.enqMon, 'total') : null;
      var rBook = CUSTOM ? rangeSum(OVS.bookMon, 'total') : null;
      var rRev = CUSTOM ? rangeSum(ROIS.byMon, 'marketingRevenue') : null;
      var rSpend = CUSTOM ? rangeSum(ROIS.byMon, 'spend') : null;
      rows.push(mkRow('Keynote enquiries', 'count',
        enqFy(2025), enqFy(2026), enqFy(2027),
        cySum(OVS.enqMon, 2025, 'total'), cySum(OVS.enqMon, 2026, 'total'),
        'Deals/leads created per period across three sources (paid = roas_counted_deals, organic = ga4 medium=organic, indirect = ac_indirect_deals excl. paid). Same source as the Overview "Keynote enquiries" card. GET /api/marketing/overview.',
        rEnq));
      rows.push(mkRow('Keynote bookings', 'count',
        bookFy(2025), bookFy(2026), bookFy(2027),
        cySum(OVS.bookMon, 2025, 'total'), cySum(OVS.bookMon, 2026, 'total'),
        'WON deals/leads created per period across the same three sources. Same source as the Overview "Keynote bookings" card. GET /api/marketing/overview.',
        rBook));
      rows.push(mkRow('Marketing revenue', 'currency',
        revFy(2025), revFy(2026), revFy(2027),
        cySum(ROIS.byMon, 2025, 'marketingRevenue'), cySum(ROIS.byMon, 2026, 'marketingRevenue'),
        'Marketing-attributed won revenue (ROAS-paid + organic + bureau/tailor + Exec X, deduped). Same source as the Overview "Marketing revenue" card. GET /api/marketing/roi.',
        rRev));
      rows.push(mkRow('Marketing spend', 'currency',
        spendFy(2025), spendFy(2026), spendFy(2027),
        cySum(ROIS.byMon, 2025, 'spend'), cySum(ROIS.byMon, 2026, 'spend'),
        'Xero marketing accounts only (Advertising, Website, Software, Printing, WrkPod), ex-GST. Same source as the Overview "Marketing spend" card. GET /api/marketing/roi.',
        rSpend));
      var roi25 = roiFrom(revFy(2025), spendFy(2025));
      var roi26 = roiFrom(revFy(2026), spendFy(2026));
      var roi27 = roiFrom(revFy(2027), spendFy(2027));
      var roiCy25 = roiFrom(cySum(ROIS.byMon, 2025, 'marketingRevenue'), cySum(ROIS.byMon, 2025, 'spend'));
      var roiCy26 = roiFrom(cySum(ROIS.byMon, 2026, 'marketingRevenue'), cySum(ROIS.byMon, 2026, 'spend'));
      rows.push(mkRow('Marketing ROI', 'roi', roi25, roi26, roi27, roiCy25, roiCy26,
        'Net return = (marketing revenue ÷ marketing spend − 1) × 100. Same definition as the Spend & ROI tab\'s "Marketing ROI" card.',
        CUSTOM ? roiFrom(rRev, rSpend) : null));
      rows.push({ measure: 'Cadence delivered', pending: true });
      return rows;
    }

    // ----- Value / delta formatting -----
    var _muted = '<span class="muted">—</span>';
    function dispVal(kind, v) {
      if (v == null) return _muted;
      if (kind === 'currency') return esc(fmt(Math.round(v), 'currency'));
      if (kind === 'roi') { var r = Math.round(v); return (r > 0 ? '+' : '') + r + '%'; }
      return esc(fmt(Math.round(v)));
    }
    function dispDiff(diff) {
      if (!diff) return _muted;
      var cls = diff.v > 0 ? 'pos' : diff.v < 0 ? 'neg' : 'muted';
      if (diff.type === 'pts') { var p = Math.round(diff.v); return (p > 0 ? '+' : '') + p + ' pts'; }
      var pc = Math.round(diff.v); return (pc > 0 ? '+' : '') + pc + '%';
    }
    function infoIcon(text) {
      if (!text) return '';
      return ' <span tabindex="0" role="img" aria-label="' + esc(text) + '" title="' + esc(text) +
        '" style="cursor:help;color:var(--text-muted);font-size:12px">ⓘ</span>';
    }

    // "Update status" and "October notes" are NOT tracked live yet — show a pending
    // placeholder (red chip, same as Cadence delivered / the design-guide standard).
    function renderStatusTable() {
      document.getElementById('statusBody').innerHTML =
        '<tr><td colspan="4"><span class="chip warn">pending</span> ' +
        '<span class="muted">Not tracked yet</span></td></tr>';
    }

    function renderNotes() {
      document.getElementById('notesList').innerHTML =
        '<div class="ml-note-item"><span class="chip warn">pending</span> ' +
        '<span class="muted">Not tracked yet</span></div>';
    }

    function renderSummaryTable() {
      var body = document.getElementById('summaryBody');
      if (!body) return;
      // Add / remove the trailing "Selected range" header cell to match the active mode.
      var head = document.getElementById('summaryHead');
      var rangeTh = document.getElementById('rangeTh');
      if (head) {
        if (CUSTOM && !rangeTh) {
          var th = document.createElement('th'); th.id = 'rangeTh'; th.textContent = 'Selected range';
          head.appendChild(th);
        } else if (!CUSTOM && rangeTh) {
          rangeTh.remove();
        }
      }
      var cols = CUSTOM ? 7 : 6;
      if (!(OVS.loaded && ROIS.loaded)) {
        body.innerHTML = '<tr><td colspan="' + cols + '" class="muted">Loading…</td></tr>';
        return;
      }
      var rows = buildSummaryRows();
      SUMMARY_RENDER = rows;
      var html = rows.map(function (r) {
        var rangeCell = CUSTOM ? ('<td>' + (r.pending ? _muted : dispVal(r.kind, r.rng)) + '</td>') : '';
        if (r.pending) {
          return '<tr><td>' + esc(r.measure) + ' <span class="chip warn">pending</span></td>' +
            '<td>' + _muted + '</td><td>' + _muted + '</td><td>' + _muted + '</td>' +
            '<td>' + _muted + '</td><td>' + _muted + '</td>' + rangeCell + '</tr>';
        }
        return '<tr>' +
          '<td>' + esc(r.measure) + infoIcon(r.info) + '</td>' +
          '<td>' + dispVal(r.kind, r.fy25) + '</td>' +
          '<td>' + dispVal(r.kind, r.fy26) + '</td>' +
          '<td>' + dispVal(r.kind, r.fy27) + '</td>' +
          '<td>' + dispVal(r.kind, r.cy25) + '</td>' +
          '<td>' + dispVal(r.kind, r.cy26) + '</td>' +
          rangeCell +
        '</tr>';
      }).join('');
      body.innerHTML = html;
    }

    function loadSummaryOverview() {
      return fetchJSON('/api/marketing/overview').then(function (d) {
        var e = d && d.enquiries, b = d && d.bookings;
        if (e) { (e.byFy || []).forEach(function (r) { OVS.enqFy[r.fyEnd] = r; }); OVS.enqMon = e.byMonth || []; }
        if (b) { (b.byFy || []).forEach(function (r) { OVS.bookFy[r.fyEnd] = r; }); OVS.bookMon = b.byMonth || []; }
        OVS.loaded = true;
        renderSummaryTable();
      }).catch(function (err) { console.error('summary overview', err); OVS.loaded = true; renderSummaryTable(); });
    }
    function loadSummaryRoi() {
      return fetchJSON('/api/marketing/roi').then(function (d) {
        ((d && d.rows && d.rows.data) || []).forEach(function (r) { ROIS.byFy[r.fyEnd] = r; });
        ROIS.byMon = (d && d.byMonth && d.byMonth.data) || [];
        ROIS.loaded = true;
        renderSummaryTable();
      }).catch(function (err) { console.error('summary roi', err); ROIS.loaded = true; renderSummaryTable(); });
    }

    function renderAll() {
      renderStatusTable();
      renderNotes();
      renderSummaryTable();
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    // Plain-text (no HTML) value/delta for the CSV export.
    function csvVal(kind, v) {
      if (v == null) return '';
      if (kind === 'currency') return Math.round(v);
      if (kind === 'roi') { var r = Math.round(v); return (r > 0 ? '+' : '') + r + '%'; }
      return Math.round(v);
    }
    function csvDiff(diff) {
      if (!diff) return '';
      if (diff.type === 'pts') { var p = Math.round(diff.v); return (p > 0 ? '+' : '') + p + ' pts'; }
      var pc = Math.round(diff.v); return (pc > 0 ? '+' : '') + pc + '%';
    }
    document.getElementById('downloadExcelBtn').addEventListener('click', function () {
      var lines = [
        ['Measure', 'FY25', 'FY26', 'FY27', 'CY2025', 'CY2026'].join(',')
      ];
      (SUMMARY_RENDER.length ? SUMMARY_RENDER : buildSummaryRows()).forEach(function (r) {
        var cells = r.pending
          ? [r.measure, 'pending', 'pending', 'pending', 'pending', 'pending']
          : [r.measure, csvVal(r.kind, r.fy25), csvVal(r.kind, r.fy26), csvVal(r.kind, r.fy27),
             csvVal(r.kind, r.cy25), csvVal(r.kind, r.cy26)];
        lines.push(cells.map(function (cell) {
          return '"' + String(cell).replace(/"/g, '""') + '"';
        }).join(','));
      });
      var blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'mag_marketing_monthly_log_tracker.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Custom date range: adds a "Selected range" column to the Yearly summary (month-level,
    // from the overview + ROI monthly series) and filters the deals table (day-level,
    // overriding the FY toggle). The FY toggle itself only affects the deals table.
    function applyRange() { CUSTOM = dateRangeActive(); renderSummaryTable(); refreshDeals(); }

    // Re-render the deals table for the active FY / range — only once it has loaded.
    function refreshDeals() { if (SUMMARY_DEALS.rows != null) renderSummaryDeals(); }

    // =====================================================================
    //  Deals behind the summary — the individual leads/deals that make up the
    //  Yearly summary's Keynote enquiries / bookings (same source + columns as
    //  the Leads & Bookings "All leads" table). Toggled open from the button
    //  below the Yearly summary, lazy-loaded on first open.
    // =====================================================================
    var SUMMARY_DEALS = { rows: null, loading: false };   // null = not yet loaded
    var DEALS_TABLE_STATE = {};
    var DEAL_SRC_COLOR = {
      'Google Ads': '#3b6ef0', 'Bing Ads': '#12a5b8', 'Paid Ads': '#4a6fa5',
      Organic: '#17a673', Tailor: '#d9663a', Bureau: '#6a4bf5',
    };

    // FY toggle helpers (the toggle is inert for the rest of the page, but the
    // deals table honours it). fe = FY END year: fy27 → 2027.
    function dealFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }
    function dealFyEnd(key) { return key === 'all' ? null : 2000 + parseInt(key.slice(2), 10); }

    // Rows for the current view: the custom date range when active (day-level,
    // which overrides the FY toggle), else the selected FY.
    function currentDealRows() {
      var all = SUMMARY_DEALS.rows || [];
      if (CUSTOM) {
        var r = getDateRange(), f = r.from || '', t = r.to || '';
        return all.filter(function (d) {
          return (!f || d.date >= f) && (!t || d.date <= t);
        });
      }
      var key = dealFyKey();
      if (key === 'all') return all;
      var fe = dealFyEnd(key);
      return all.filter(function (d) { return d.fyEnd === fe; });
    }

    function renderSummaryDeals() {
      var host = document.getElementById('summaryDealsRows');
      var cnt = document.getElementById('dealsCount');
      if (!host) return;
      if (SUMMARY_DEALS.rows == null) {
        host.innerHTML = '<div class="muted" style="padding:10px 2px">Loading…</div>';
        if (cnt) cnt.textContent = '';
        return;
      }
      function txt(v) { return v == null || v === '' ? '—' : esc(v); }
      function fyCell(v) { return v ? 'FY' + String(v).slice(-2) : '—'; }
      function srcCell(v) {
        return '<span class="src-dot" style="background:' + (DEAL_SRC_COLOR[v] || '#9aa4b2') + '"></span>' + esc(v || '—');
      }
      function statusCell(v, row) { return row.won ? '<strong>' + esc(v || 'Won') + '</strong>' : esc(v || '—'); }
      var cols = [
        { key: 'fyEnd', label: 'FY', render: fyCell, text: function (v) { return v ? 'FY' + String(v).slice(-2) : ''; } },
        { key: 'date', label: 'Date', unit: 'date' },
        { key: 'source', label: 'Source', render: srcCell, text: function (v) { return v; } },
        { key: 'org', label: 'Organisation', render: txt },
        { key: 'title', label: 'Deal', render: txt },
        { key: 'status', label: 'Status', render: statusCell, text: function (v, row) { return row.won ? (v || 'Won') : (v || ''); } },
        { key: 'value', label: 'Value', unit: 'currency' },
      ];
      renderSortableTable('summaryDealsRows', currentDealRows(), cols, {
        stateStore: DEALS_TABLE_STATE,
        searchPlaceholder: 'Search deals…',
        sortKey: 'date', sortDir: 'desc',
        emptyText: 'No deals found.',
        pageSize: 50,
        onCount: function (shown, total, list) {
          var won = (list || []).filter(function (r) { return r.won; }).length;
          if (cnt) cnt.textContent = (shown === total ? total : shown + ' of ' + total) +
            ' deal' + (total === 1 ? '' : 's') + ' · ' + won + ' booked';
        },
      });
    }

    function loadSummaryDeals() {
      if (SUMMARY_DEALS.rows != null || SUMMARY_DEALS.loading) return;   // load once
      SUMMARY_DEALS.loading = true;
      renderSummaryDeals();   // show "Loading…"
      fetchJSON('/api/marketing/leads-by-source').then(function (d) {
        SUMMARY_DEALS.rows = (d && d.leads) || [];
        SUMMARY_DEALS.loading = false;
        renderSummaryDeals();
      }).catch(function (err) {
        console.error('summary deals', err);
        SUMMARY_DEALS.rows = [];
        SUMMARY_DEALS.loading = false;
        var host = document.getElementById('summaryDealsRows');
        if (host) host.innerHTML = '<div class="needs-setup"><strong>Couldn’t load deals</strong><span>' + esc(err.message) + '</span></div>';
      });
    }

    (function wireSummaryDealsToggle() {
      var btn = document.getElementById('summaryDealsToggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var section = document.getElementById('summaryDealsSection');
        if (!section) return;
        var show = section.style.display === 'none';
        section.style.display = show ? '' : 'none';
        btn.setAttribute('aria-expanded', show ? 'true' : 'false');
        btn.textContent = show ? 'Hide deals behind the summary' : 'See deals behind the summary';
        if (show) loadSummaryDeals();
      });
    })();

    initPage('marketing');
    renderMarketingHead();
    renderMarketingSidebar('monthly-log');
    renderDateRange({ after: 'drAnchor' });   // keep the date range in the top controls card
    fillHeadInfo();              // fill the table ⓘ info tools (§6)
    renderAll();                 // status + notes (mock) + Yearly summary (Loading… until fetched)
    loadSummaryOverview();       // live Keynote enquiries + bookings (same source as marketing.html)
    loadSummaryRoi();            // live Marketing revenue + spend + ROI (same source as marketing.html / spend_roi.html)
    wireSeg('fySeg', refreshDeals);   // FY toggle only filters the deals table
    wireDateRange({ onChange: applyRange });
  </script>
</body>
</html>
