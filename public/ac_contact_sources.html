<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GA4 Leads Tracker — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    /* Wide table — use the full screen width (still scrolls on narrow screens). */
    .content { max-width: none; }
    .acs-toolbar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .acs-field { display: flex; flex-direction: column; gap: 4px; }
    .acs-field label, .acs-daterange > label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .acs-field input[type="date"] {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 10px; font: inherit;
    }
    .acs-quick { display: flex; gap: 6px; flex-wrap: wrap; }
    .acs-quick button, .acs-reset {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .acs-quick button.active, .acs-reset.active { background: var(--accent); color: #fff; border-color: transparent; }
    .acs-spacer { flex: 1; }
    /* Date-range popover: a single trigger button opens a panel holding the
       From/To calendar inputs + the quick-range buttons (declutters the toolbar). */
    .acs-daterange { position: relative; display: flex; flex-direction: column; gap: 4px; }
    .acs-datebtn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .acs-datebtn::after { content: '▾'; font-size: 11px; color: var(--text-muted); }
    .acs-datebtn.active { border-color: var(--accent); color: var(--accent); }
    .acs-popup {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,.28); padding: 14px; min-width: 240px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .acs-popup[hidden] { display: none; }
    .acs-popup .acs-quick { margin-top: 2px; }
    /* Conversion Action tooltip */
    .conv-cell, .chan-cell, .conf-cell { cursor: help; }
    .conv-cell .pill, .chan-cell .pill, .conf-cell .pill { border-bottom: 1px dotted currentColor; }
    #convTip {
      position: fixed; z-index: 9999; max-width: 300px; display: none;
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; box-shadow: 0 10px 28px rgba(0,0,0,.28);
      font-size: 13px; line-height: 1.45;
    }
    #convTip a { color: var(--accent); text-decoration: none; font-weight: 700; display: inline-block; margin-top: 8px; }
    #convTip a:hover { text-decoration: underline; }
    .guide-link { font-size: 13px; text-decoration: none; color: var(--accent); font-weight: 600; }
    /* Info ⓘ on each KPI card — native tooltip via the title attribute. */
    .kpi-info { cursor: help; color: var(--text-muted); font-size: 12px; margin-left: 2px; }
    .kpi-info:hover, .kpi-info:focus { color: var(--accent); outline: none; }
    .conv-link { color: var(--accent); text-decoration: none; word-break: break-all; }
    .conv-link:hover { text-decoration: underline; }
  </style>
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
  </nav>

  <div class="marketing-layout">
    <aside class="subnav" id="marketingNav"></aside>
  <main class="content">
    <!-- metrics widget -->
    <div class="kpi-grid" id="acsKpis"></div>

    <div class="grid">
      <div class="card col-12">
        <div class="card-head">
          <h3>GA4 Leads Tracker</h3>
          <span class="chips" id="acsChips"></span>
          <a class="guide-link" href="lead_source_guide.html" style="margin-left:10px">ⓘ Channel &amp; conversion guide</a>
          <div class="spacer"></div>
          <span class="muted" id="acsCount" style="font-size:13px"></span>
        </div>

        <!-- date-range filter (filters on contact Created date). The From/To
             calendar inputs + quick-range buttons live inside a popover opened
             from the single "Date range" trigger below. -->
        <div class="acs-toolbar">
          <div class="acs-daterange">
            <label>Date range (created)</label>
            <button type="button" class="acs-datebtn" id="acsDateBtn"
                    aria-haspopup="true" aria-expanded="false">All dates</button>
            <div class="acs-popup" id="acsDatePopup" hidden>
              <div class="acs-field">
                <label for="acsFrom">From (created)</label>
                <input type="date" id="acsFrom" />
              </div>
              <div class="acs-field">
                <label for="acsTo">To (created)</label>
                <input type="date" id="acsTo" />
              </div>
              <div class="acs-quick" id="acsQuick">
                <button type="button" data-days="7">7d</button>
                <button type="button" data-days="30">30d</button>
                <button type="button" data-days="60">60d</button>
                <button type="button" data-days="0" class="active">All</button>
              </div>
              <button type="button" class="acs-reset" id="acsReset">Reset</button>
            </div>
          </div>
          <div class="acs-spacer"></div>
          <button type="button" class="acs-reset" id="acsRoasToggle" aria-pressed="false"
                  title="Show only the rows counted by the ROAS tab (cpc/organic or JC-tagged won/lost/open deals; hides Google Ads?=Yes rows with no channel/tag)">ROAS-counted only</button>
          <button type="button" class="acs-reset" id="acsJcToggle" aria-pressed="false"
                  title="Show/hide Manual Tagging column">Show Manual Tagging</button>
          <button type="button" class="acs-reset" id="acsXeroToggle" aria-pressed="false"
                  title="Show/hide the Xero fee breakdown (Engagement Fee, Other Fees, GST, Amount Total)">Show Xero $</button>
          <button type="button" class="acs-reset" id="acsMetaToggle" aria-pressed="false"
                  title="Show/hide the extra columns: Created, AC ID, Link, Match, Confidence, Δ (s), Matched At and CPC">Show extra columns</button>
        </div>

        <div id="acsRows"></div>
      </div>
    </div>
  </main>
  </div>

  <script src="app.js?v=6"></script>
  <script>
    var ALL_ROWS = [];
    // Persistent table state (sort / search / per-column filters). Owned here and
    // passed into renderSortableTable so a show/hide-column toggle — which rebuilds
    // the table over the same rows — keeps the user's in-table filters/search/sort.
    var TABLE_STATE = {};
    // Toggle for the extra/detail columns: Created, AC ID and Link (shown in
    // place) plus Match, Confidence, Δ (s), Matched At, CPC (pinned far right).
    // Default hidden; the toolbar button flips it. Data stays in the DB regardless.
    var SHOW_META_COLS = false;
    // Toggle for the "JC's Manual Tag" column (mag_gads jc_final_attr). Default hidden.
    var SHOW_JC_COL = false;
    // Toggle for the Xero fee-breakdown columns (Engagement Fee, Other Fees, GST,
    // Amount Total — from mag_gads by deal_id). Default hidden; data stays in the DB.
    var SHOW_XERO_COLS = false;
    // Quick filter: when on, show ONLY the rows counted by the ROAS tab (see
    // isRoasCounted). Default off; the toolbar button flips it.
    var ROAS_ONLY = false;

    function setChips(id, meta) { var el = document.getElementById(id); if (el) el.innerHTML = metaChips(meta); }

    var _aud = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', minimumFractionDigits: 0, maximumFractionDigits: 0 });
    function money(v) { return _aud.format(Number(v) || 0); }

    // ---- cell renderers ----
    function txt(v) { return (v === null || v === undefined || v === '') ? '—' : esc(String(v)); }
    function methodPill(v) {
      if (!v) return '—';
      var s = String(v), cls = s === 'calendly_email' ? 'pos' : (s === 'unmatched' ? 'neg' : '');
      var label = s === 'calendly_email' ? 'Calendly (email)' : (s === 'ga4_time' ? 'GA4 (time)' : 'Unmatched');
      return '<span class="pill ' + cls + '">' + esc(label) + '</span>';
    }
    var CONF_INFO = {
      high: 'Reliable — an exact Calendly email match, or a GA4 time match within 90s with only one possible source.',
      medium: 'Fairly reliable — a GA4 time match 90–300s away, or within 90s but with several possible sources in that minute.',
      low: 'Weak — a GA4 time match that was both ambiguous (several possible sources) and 90–300s away.',
      none: 'No source could be matched to this contact.'
    };
    function confPill(v) {
      var val = v || 'none';
      var cls = val === 'high' ? 'pos' : (val === 'low' ? 'neg' : (val === 'none' ? '' : 'partial'));
      return '<span class="conf-cell" data-conf="' + esc(val) + '"><span class="pill ' + cls + '">' + esc(val) + '</span></span>';
    }
    // Channel = GA4 session source/medium; the three marketing channels are highlighted.
    var AD_SOURCES = ['google / cpc', 'bing / cpc', 'google / organic'];
    function channelPill(v) {
      if (!v) return '—';
      var s = String(v), cls = AD_SOURCES.indexOf(s) >= 0 ? 'pos' : '';
      return '<span class="chan-cell" data-chan="' + esc(s) + '"><span class="pill ' + cls + '">' + esc(s) + '</span></span>';
    }
    // Classify a "source / medium" channel into a category (for its tooltip + guide link).
    function channelCategory(v) {
      var s = String(v || '').toLowerCase(), parts = s.split(' / '), src = parts[0] || '', med = parts[1] || '';
      if (med === 'cpc' || med === 'ppc' || med === 'paid')
        return { key: 'paid', title: 'Paid search / ads', desc: 'A paid ad click. GA4 reads it from the ad click ID (Google auto-tagging / Microsoft) or utm_medium=cpc. e.g. google / cpc, bing / cpc.' };
      if (med === 'organic')
        return { key: 'organic', title: 'Organic search', desc: 'A free, unpaid click from a search engine results page (e.g. google / organic).' };
      if (med === 'email')
        return { key: 'email', title: 'Email', desc: 'A click from an email link tagged utm_medium=email — e.g. your ActiveCampaign campaigns.' };
      if (med === 'referral')
        return { key: 'referral', title: 'Referral', desc: 'Arrived via a link on another website (the referring domain is shown). Some — ads.google.com, tagassistant.google.com — are internal/preview artifacts, not real visitors.' };
      if (med === 'video' || src.indexOf('youtube') >= 0)
        return { key: 'video', title: 'Video', desc: 'A click from a video platform such as YouTube (youtube / video).' };
      if (med === 'social' || /(linkedin|facebook|instagram|twitter|t\.co)/.test(src))
        return { key: 'social', title: 'Social', desc: 'A click from a social network such as LinkedIn or Facebook.' };
      if (src === '(direct)' || med === '(none)')
        return { key: 'direct', title: 'Direct / unknown', desc: 'No source detected — typed URL, bookmark, or stripped referrer. GA4 labels it (direct) / (none).' };
      return { key: 'other', title: 'Other', desc: 'A source/medium GA4 detected automatically from UTM tags, the referrer, or the ad click ID.' };
    }
    // Short description per conversion action (full detail lives in lead_source_guide.html).
    var ACTION_INFO = {
      calendly_form_submit: 'A Calendly consult/discovery call was booked (confirmation on /thank-you-2/).',
      form_submit: 'Generic website form submission — fires across many forms (careers, Executive X, free-gift opt-in, free consult, team building, home).',
      form_submissions: 'Contact-page enquiry form (/contact/).',
      Contact_Form_Submit_Alt: 'Alternate contact / speaking-request form (home, /contact/, /speaking-request/).',
      Form_submission_thankyou_1: 'Enquiry form submission — enquiry thank-you page (/thank-you/).',
      subscribe: 'Newsletter / subscribe opt-in (free consult, keynote, team-building pages).',
      free_gifts_opt_ins: 'Free-gift opt-in form (/free-gift-delivery-page/).'
    };
    function convPill(v) {
      if (!v) return '—';
      var s = String(v), cls = s === 'calendly_form_submit' ? 'pos' : 'partial';
      return '<span class="conv-cell" data-act="' + esc(s) + '"><span class="pill ' + cls + '">' + esc(s) + '</span></span>';
    }
    // Link = the page path the conversion event fired on (conversion_link from ga4_ac_event_matches)
    function linkCell(v, row) {
      var val = (v !== null && v !== undefined && v !== '') ? v : (row && (row.link || row.conversionLink));
      if (val === null || val === undefined || val === '') return '—';
      var s = String(val).trim();
      if (!s || s === '—' || s.toLowerCase() === '(not set)') return '—';
      var href = s;
      if (/^https?:\/\//i.test(s)) {
        href = s;
      } else if (s === '/ (home)') {
        href = 'https://www.myadventuregroup.com.au/';
      } else if (s.charAt(0) === '/') {
        var path = s.split(/\s+/)[0];
        href = 'https://www.myadventuregroup.com.au' + path;
      } else {
        href = 'https://www.myadventuregroup.com.au/' + s;
      }
      return '<a class="conv-link" href="' + esc(href) + '" target="_blank" rel="noopener" title="' + esc(s) + '">' + esc(s) + '</a>';
    }
    // CPC = the paid-ad cost of this contact's matched conversion (AUD, 2 decimals).
    // Blank for contacts with no paid-ad match (older than ~60d, or non-paid channel).
    var _aud2 = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
    function cpcCell(v) { return (v === null || v === undefined || v === '') ? '—' : _aud2.format(Number(v)); }
    // Deal status from activecampaign_deals: won (green) / lost (red) / open (amber).
    function statusPill(v) {
      if (!v) return '—';
      var s = String(v), cls = s === 'won' ? 'pos' : (s === 'lost' ? 'neg' : 'partial');
      return '<span class="pill ' + cls + '">' + esc(s) + '</span>';
    }
    // "JC's Manual Tag" = mag_gads_direct_inbound_lead_source.jc_final_attr, joined by
    // deal_id (e.g. "Could be SEO or Paid Ad"). Blank for rows with no manual tag.
    function jcTagPill(v) {
      if (v === null || v === undefined || v === '') return '—';
      var s = String(v);
      return '<span class="pill partial" title="' + esc(s) + '">' + esc(s) + '</span>';
    }
    // Authorized to set the JC manual review tag (James + admins). Mirrors the server
    // gate canReviewJc(); the server re-checks every write — this only decides whether
    // to render the interactive control instead of a read-only pill.
    function canTagJc() {
      var u = currentUser();
      return !!(u && (u.role === 'admin' || u.email === 'james@myadventuregroup.com.au'));
    }
    // A "for review" row: AC "Google Ads?"=Yes but no GA4 channel and no (effective) JC
    // tag and not yet reviewed. These get the amber row highlight and a tagging control.
    function isForReview(r) {
      if (!r) return false;
      if (String(r.googleAdsAcField || '').trim().toLowerCase() !== 'yes') return false;
      if (String(r.channel || '').trim()) return false;
      if (r.jcManualTag && String(r.jcManualTag).trim()) return false;
      if (r.jcReviewed) return false;
      return true;
    }
    // Numeric coercion that treats blank/NULL as "no value".
    function numOrNull(v) { return (v === null || v === undefined || v === '') ? null : Number(v); }
    // A "fee review" row: a WON deal whose AC Value and Xero Engagement Fee don't balance
    // — either the Engagement Fee is missing (not invoiced) or it differs from the AC value
    // by ≥ $1. Open/lost deals are never flagged, nor are JC rows still showing "— set tag —"
    // (isForReview — they need a JC decision first). Only applied when the Xero $ columns show.
    function isFeeMismatch(r) {
      if (!r) return false;
      if (r.dealStatus !== 'won') return false;        // only won deals are reviewed for fee balance
      if (isForReview(r)) return false;                // skip JC "— set tag —" rows (still need a JC decision)
      var ac = numOrNull(r.dealValue), eng = numOrNull(r.engagementFee);
      if (ac === null && eng === null) return false;   // no deal + no fee → nothing to balance
      if (ac === null || eng === null) return true;    // one side present, other missing → unbalanced
      return Math.abs(ac - eng) >= 1;                  // both present but differ (≥ $1 tolerance)
    }
    // Engagement Fee cell: on a mismatch, append a ⚠ + a tooltip naming both values / the
    // gap. Plain money otherwise. (Sort stays numeric via the raw value — see app.js.)
    function engFeeCell(v, row) {
      var disp = (v === null || v === undefined || v === '') ? '—' : money(v);
      if (!isFeeMismatch(row)) return disp;
      var ac = numOrNull(row.dealValue), eng = numOrNull(row.engagementFee);
      var msg = eng === null ? 'No Xero Engagement Fee yet — AC Value is ' + money(ac)
              : ac === null  ? 'No AC Value — Engagement Fee is ' + money(eng)
              : 'AC Value ' + money(ac) + ' ≠ Engagement Fee ' + money(eng) + ' (Δ ' + money(Math.abs(ac - eng)) + ')';
      return '<span title="' + esc(msg) + '">' + disp + ' ⚠</span>';
    }
    // JC column cell: an interactive tag control for authorized users on review-eligible
    // rows (for-review, already-tagged, or already-reviewed); a read-only pill otherwise.
    // "Not paid ad / SEO" (value __not__) posts an empty decision → reviewed, tag cleared.
    function jcTagCell(v, row) {
      // Deal also in Niki's ad-leads tracking sheet (joined by deal_id, display-only).
      // JC's tag PREVAILS unless the row is still "for review" (awaiting a JC decision):
      // on a for-review row that's in Niki's list, show a read-only "In Niki's List"
      // pill instead of the amber tag <select>. A tagged/reviewed row keeps its JC tag.
      if (row && row.inNikiList && isForReview(row)) {
        return '<span class="pill pos" title="Deal is in Niki’s ad-leads tracking list">In Niki’s List</span>';
      }
      var tag = (v && String(v).trim()) ? String(v) : '';
      var eligible = isForReview(row) || tag || row.jcReviewed;
      if (!canTagJc() || !eligible) return jcTagPill(v);
      var cur = tag ? tag : (row.jcReviewed ? '__not__' : '');
      var opt = function (val, label) {
        return '<option value="' + esc(val) + '"' + (cur === val ? ' selected' : '') + '>' + esc(label) + '</option>';
      };
      var title = row.jcSetBy ? ('Reviewed by ' + row.jcSetBy) : 'Set JC review tag';
      return '<select class="acs-jc-select" data-jc-contact="' + esc(String(row.contactId)) + '" title="' + esc(title) + '">'
        + opt('', '— set tag —')
        + opt('Could be SEO or Paid Ad', 'Could be SEO or Paid Ad')
        + opt('__not__', 'Not paid ad / SEO')
        + '</select>';
    }
    // "Google Ads?" custom field from AC deal (Qualification Details)
    function googleAdsPill(v) {
      if (!v) return '—';
      var s = String(v).trim(), low = s.toLowerCase();
      var cls = low === 'yes' ? 'pos' : (low === 'no' ? 'neg' : 'partial');
      return '<span class="pill ' + cls + '">' + esc(s) + '</span>';
    }
    // "Deal Source?" custom field from AC deal (Qualification Details)
    function dealSourcePill(v) {
      if (!v) return '—';
      var s = String(v).trim();
      return '<span class="pill" title="' + esc(s) + '">' + esc(s) + '</span>';
    }
    // Deal "Inbound/ Outbound?" field (Qualification Details) → short, colored pill;
    // full AC value kept in the title tooltip. Blank when the deal has no value set.
    function sourceTypePill(v) {
      if (!v) return '—';
      var s = String(v), low = s.toLowerCase(), cls, label;
      if (low.indexOf('inbound') === 0) { cls = 'pos'; label = 'Inbound'; }
      else if (low.indexOf('outbound') === 0) {
        cls = 'partial';
        label = low.indexOf('social') >= 0 ? 'Outbound · Social'
              : low.indexOf('cold') >= 0 ? 'Outbound · Cold' : 'Outbound';
      } else { cls = ''; label = s; }
      return '<span class="pill ' + cls + '" title="' + esc(s) + '">' + esc(label) + '</span>';
    }
    // Floating, interactive tooltip for the Channel + Conversion Action columns (delegated,
    // so it survives table re-renders). Hovering a value shows a description + a guide link.
    (function () {
      var tip = document.createElement('div'); tip.id = 'convTip'; document.body.appendChild(tip);
      var hideT = null;
      function info(cell) {
        if (cell.classList.contains('conv-cell')) {
          var act = cell.getAttribute('data-act');
          return { title: act, desc: ACTION_INFO[act] || 'GA4 conversion event.',
                   href: 'lead_source_guide.html#' + encodeURIComponent(act) };
        }
        if (cell.classList.contains('conf-cell')) {
          var cf = cell.getAttribute('data-conf');
          return { title: cf.charAt(0).toUpperCase() + cf.slice(1) + ' confidence',
                   desc: CONF_INFO[cf] || '', href: 'lead_source_guide.html#confidence' };
        }
        var c = channelCategory(cell.getAttribute('data-chan'));
        return { title: c.title, desc: c.desc, href: 'lead_source_guide.html#channel-' + c.key };
      }
      function show(cell) {
        var i = info(cell);
        tip.innerHTML = '<div><strong>' + esc(i.title) + '</strong></div>' +
          '<div style="margin-top:4px">' + esc(i.desc) + '</div>' +
          '<a href="' + i.href + '">Open guide →</a>';
        var r = cell.getBoundingClientRect();
        tip.style.display = 'block';
        var left = r.left, top = r.bottom + 8;
        if (left + 312 > window.innerWidth) left = window.innerWidth - 320;
        if (top + tip.offsetHeight + 8 > window.innerHeight) top = r.top - tip.offsetHeight - 8;
        tip.style.left = Math.max(8, left) + 'px';
        tip.style.top = Math.max(8, top) + 'px';
      }
      function hide() { tip.style.display = 'none'; }
      document.addEventListener('mouseover', function (e) {
        var cell = e.target.closest && e.target.closest('.conv-cell, .chan-cell, .conf-cell');
        if (cell) { clearTimeout(hideT); show(cell); }
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.closest && e.target.closest('.conv-cell, .chan-cell, .conf-cell')) { hideT = setTimeout(hide, 250); }
      });
      tip.addEventListener('mouseenter', function () { clearTimeout(hideT); });
      tip.addEventListener('mouseleave', hide);
    })();

    var EXCLUDED_CONVERSION_LINKS = [
      '/careers-seasonal/',
      '/executive-x/',
      '/careersph-based/',
      '/free-gift-opt-in/',
      '/leader-x-payment-gateway/',
      '/execx/',
      '/executive-x-payment-gateway/'
    ];

    // Manual hide-list: specific AC deal_ids that must never appear on the page (curated
    // request, 2026-10-21). KEEP IDENTICAL to EXCLUDED_DEAL_IDS in
    // server/metrics/ac-contact-sources.js. Hiding is by deal_id alone (not scoped to
    // Niki's sheet). deal_id is text in the cache, so compare as strings.
    var EXCLUDED_DEAL_IDS = {
      '3165':1,'3174':1,'3176':1,'3216':1,'3217':1,'3274':1,'3455':1,'3467':1,'3471':1,
      '3501':1,'3502':1,'3543':1,'3546':1,'3549':1,'3567':1,'3570':1,'3609':1,'3640':1,
      '3664':1,'3714':1,'3722':1,'3725':1,'3744':1,'3748':1,'3776':1,'3780':1,'3801':1,
      '3822':1,'3823':1,'3855':1,'3870':1,'3926':1,'3932':1,'3965':1,'3993':1,'4024':1,
      '4038':1,'4058':1,'4083':1,'4085':1,'4094':1,'4105':1,'4110':1,'4127':1,'4207':1,
      '4221':1,'4222':1
    };

    function isExcludedConversionLink(link) {
      if (!link) return false;
      var s = String(link).trim().toLowerCase();
      if (!s) return false;
      try {
        if (s.indexOf('http://') === 0 || s.indexOf('https://') === 0) {
          s = new URL(s).pathname.toLowerCase();
        }
      } catch (e) {}
      var path = (s.charAt(0) === '/' ? s : '/' + s).split(/[?#\s]/)[0].replace(/\/+$/, '') + '/';
      return EXCLUDED_CONVERSION_LINKS.indexOf(path) !== -1;
    }

    // Decide whether a row is HIDDEN from the page (data stays intact in the DB).
    // A row is HIDDEN if its deal_id is in the manual EXCLUDED_DEAL_IDS set, if its deal
    // is in Niki's sheet marked outbound (nikiOutbound), or if its deal title starts with
    // "Uniting" (referral) — these override everything
    // below. Otherwise a row is SHOWN iff: it has a JC manual
    // tag (always shown), OR it is not a free-gift opt-in AND not an excluded conversion
    // link AND (channel looks organic/cpc OR google_ads_ac_field='Yes').
    // Referral / teams / email / direct channels fall through to hidden automatically.
    //
    // KEEP IDENTICAL to isExcludedRow() in server/metrics/ac-contact-sources.js.
    // DELIBERATE DIVERGENCE from CONTACT_SOURCE_SHOWN in server/lib/sql.js: these two
    // display copies ALSO show google_ads_ac_field='Yes' rows (AC "Google Ads?"=Yes even
    // with no GA4 channel). That branch is intentionally NOT mirrored into
    // CONTACT_SOURCE_SHOWN, so ROAS keeps counting only channel/JC rows and is unaffected.
    var ORGANIC_OR_CPC = /cpc|organic/i;
    function isExcludedRow(r) {
      if (!r) return false;
      // Manual hide-list by deal_id — ALWAYS hidden, overrides every rule below incl. the
      // JC "always show" exemption (per request).
      if (r.dealId != null && EXCLUDED_DEAL_IDS[String(r.dealId).trim()]) return true;
      // Deals in Niki's sheet marked outbound (any kind) are ALWAYS hidden — this wins
      // over every rule below, including the JC "always show" exemption (per request).
      if (r.nikiOutbound) return true;
      // Uniting deals are referrals, not Google Ads leads — ALWAYS hidden (overrides JC
      // show). Anchored, so the company is the first deal_title token ("ICMI // … //
      // Uniting" is NOT matched). KEEP IN SYNC with the ROAS exclusion in roas.js.
      if (/^\s*uniting/i.test(String(r.dealTitle || ''))) return true;
      // JC-tagged rows (mag_gads jc_final_attr, e.g. "Could be SEO or Paid Ad") are part
      // of the manual ROAS audit and must ALWAYS be shown — exempt from every exclusion.
      if (r.jcManualTag) return false;

      // Safety blacklist: free-gift opt-ins and non-lead conversion links.
      var act = (r.conversionAction || '').trim().toLowerCase();
      if (act === 'free_gifts_opt_ins') return true;
      if (isExcludedConversionLink(r.link || r.conversionLink)) return true;

      // Show organic/cpc channels, plus AC "Google Ads?"=Yes rows (even with no GA4
      // channel — e.g. aged out of the ~60-day window); hide everything else (null,
      // direct, referral, teams, email, booking, …).
      if (ORGANIC_OR_CPC.test(String(r.channel || ''))) return false;
      if (String(r.googleAdsAcField || '').trim().toLowerCase() === 'yes') return false;
      return true;
    }

    // A row is "counted by the ROAS tab" iff it is in the ROAS leads population:
    // CONTACT_SOURCE_SHOWN (effective JC tag OR cpc/organic, minus free-gift/excluded
    // links) AND dealStatus in won/lost/open AND calYr set. Mirrors server/lib/sql.js
    // CONTACT_SOURCE_SHOWN + server/metrics/roas.js deals-CTE gating. KEEP IN SYNC.
    // (Rows here have already cleared isExcludedRow, so EXCLUDED_DEAL_IDS / nikiOutbound /
    // uniting are gone — ROAS would still count JC-tagged ones of those, but they aren't
    // shown on this page at all, so the filter reflects "ROAS-counted rows visible here".)
    function isRoasCounted(r) {
      if (!r || isExcludedRow(r)) return false;
      if (r.calYr == null) return false;
      if (['won', 'lost', 'open'].indexOf(r.dealStatus) === -1) return false;
      if (r.jcManualTag && String(r.jcManualTag).trim()) return true; // effective JC tag branch
      var act = (r.conversionAction || '').trim().toLowerCase();
      if (act === 'free_gifts_opt_ins') return false;
      if (isExcludedConversionLink(r.link || r.conversionLink)) return false;
      return ORGANIC_OR_CPC.test(String(r.channel || ''));
    }

    // ---- date-range filtering ----
    function parseInput(id) {
      var el = document.getElementById(id);
      return el && el.value ? el.value : ''; // 'YYYY-MM-DD' or ''
    }
    function inRange(iso, from, to) {
      if (!iso) return false;
      var d = String(iso).slice(0, 10); // compare on YYYY-MM-DD (cdate is UTC)
      if (from && d < from) return false;
      if (to && d > to) return false;
      return true;
    }
    function filteredRows() {
      var from = parseInput('acsFrom'), to = parseInput('acsTo');
      return ALL_ROWS.filter(function (r) {
        if (isExcludedRow(r)) return false;
        if (ROAS_ONLY && !isRoasCounted(r)) return false;
        return inRange(r.cdate, from, to);
      });
    }

    // ---- metrics widget ----
    // `info` renders a hoverable ⓘ with an explanation of what the card counts.
    function kpi(label, value, sub, subClass, info) {
      var ic = info ? ' <span class="kpi-info" tabindex="0" title="' + esc(info) + '">ⓘ</span>' : '';
      return '<div class="kpi"><div class="label">' + esc(label) + ic + '</div>' +
        '<div class="value">' + esc(String(value)) + '</div>' +
        (sub ? '<div class="delta ' + (subClass || '') + '">' + esc(sub) + '</div>' : '') + '</div>';
    }
    function renderKpis(rows) {
      var total = rows.length;
      var revenue = rows.reduce(function (a, r) { return a + (r.dealStatus === 'won' ? (Number(r.dealValue) || 0) : 0); }, 0);
      var wonDeals = rows.filter(function (r) { return r.dealStatus === 'won'; }).length;
      var openPipeline = rows.reduce(function (a, r) { return a + (r.dealStatus === 'open' ? (Number(r.dealValue) || 0) : 0); }, 0);
      var openDeals = rows.filter(function (r) { return r.dealStatus === 'open'; }).length;

      function bySource(ls) { return rows.filter(function (r) { return (r.channel || '') === ls; }).length; }
      var gcpc = bySource('google / cpc');
      var bcpc = bySource('bing / cpc');
      var gorg = bySource('google / organic');
      var borg = bySource('bing / organic');
      var host = document.getElementById('acsKpis');

      var revSub = wonDeals > 0
        ? (wonDeals + (wonDeals === 1 ? ' won deal' : ' won deals') + (openPipeline > 0 ? ' · ' + money(openPipeline) + ' open' : ''))
        : (openPipeline > 0 ? money(openPipeline) + ' open pipeline' : '0 won deals');

      host.innerHTML =
        kpi('Total Deal Value', money(revenue), revSub, revenue ? 'pos' : '',
            'Total value of all deals (AUD) for contacts in the current view. AC deal value is CRM-contracted, not billed revenue.' + (openPipeline > 0 ? ' Open pipeline: ' + money(openPipeline) + ' across ' + openDeals + ' open deals.' : '')) +
        kpi('Total Leads', total, 'in selected range', '',
            'Every ActiveCampaign contact created in the selected date range — the total inbound enquiries for that period.') +
        kpi('Paid Google (google / cpc)', gcpc, 'paid search', gcpc ? 'pos' : '',
            'Contacts whose GA4 session channel was google / cpc — a paid Google Ads click. Channel is only known for contacts in the last ~60 days (GA4 data retention).') +
        kpi('Paid Bing (bing / cpc)', bcpc, 'paid search', bcpc ? 'pos' : '',
            'Contacts whose GA4 session channel was bing / cpc — a paid Microsoft (Bing) Ads click. Last ~60 days only (GA4 retention).') +
        kpi('Organic search (google / organic)', gorg, 'organic search', gorg ? 'pos' : '',
            'Contacts from google / organic — a free, unpaid Google search result (not an ad). Last ~60 days only (GA4 retention).') +
        kpi('Organic search (bing / organic)', borg, 'organic search', borg ? 'pos' : '',
            'Contacts from bing / organic — a free, unpaid Bing search result (not an ad). Last ~60 days only (GA4 retention).');
    }

    // ---- table ----
    // The table shows only leads that have a GA4/Ads conversion action (match_method
    // calendly_email or ga4_time). The KPI cards above still count ALL contacts in
    // range (that's what "Total inbound enquiries" means), so they use the unfiltered set.
    function renderTable(rows) {
      var leads = rows.filter(function (r) { return !isExcludedRow(r); });
      var cols = [
        // Created, AC ID and Link are hidden by default and folded into the
        // meta-columns toggle (SHOW_META_COLS). They stay in the column list
        // (as hidden) so the default 'cdate' sort keeps working while off.
        { key: 'cdate', label: 'Created', unit: 'date', hidden: !SHOW_META_COLS },
        { key: 'fy', label: 'FY', render: txt },
        { key: 'calYr', label: 'Cal. Yr.', render: txt },
        { key: 'contactId', label: 'AC ID', render: txt, hidden: !SHOW_META_COLS },
        { key: 'email', label: 'Email', render: txt },
        { key: 'channel', label: 'Channel', render: channelPill },
        { key: 'conversionAction', label: 'Conversion Action', render: convPill },
        { key: 'link', label: 'Link', render: linkCell, hidden: !SHOW_META_COLS },
        { key: 'googleAdsAcField', label: 'Google Ads (AC)', render: googleAdsPill },
        // Hidden columns (display only — data remains in the DB):
        // 'Deal Source' (Direct/Indirect) and 'Source Type' (Inbound/Outbound).
        // { key: 'dealSourceAcField', label: 'Deal Source', render: dealSourcePill },
        { key: 'dealTitle', label: 'Deal', render: txt },
        { key: 'dealValue', label: 'AC Value', unit: 'currency' },
        { key: 'dealStatus', label: 'Status', render: statusPill },
        // { key: 'sourceType', label: 'Source Type', render: sourceTypePill },
        // 'Match' and 'Confidence' are now part of the meta-columns toggle below
        // (hidden by default) — see the SHOW_META_COLS block.
      ];
      // Xero fee-breakdown columns (mag_gads by deal_id), shown/hidden by the toolbar
      // toggle. Grouped right after the deal Status column; blank until a deal is invoiced.
      if (SHOW_XERO_COLS) {
        var xeroAt = cols.length;
        for (var ci = 0; ci < cols.length; ci++) { if (cols[ci].key === 'dealStatus') { xeroAt = ci + 1; break; } }
        cols.splice(xeroAt, 0,
          { key: 'engagementFee', label: 'Engagement Fee', unit: 'currency', render: engFeeCell,
            text: function (v) { return (v === null || v === undefined || v === '') ? '' : String(money(v)); } },
          { key: 'otherFees', label: 'Other Fees', unit: 'currency' },
          { key: 'gst', label: 'GST', unit: 'currency' },
          { key: 'amountTotal', label: 'Amount Total', unit: 'currency' }
        );
      }
      // "JC's Manual Tag" column, shown/hidden by its toolbar toggle (hidden by default).
      if (SHOW_JC_COL) {
        // `text` gives filter/sort/search a stable projection (the render is an
        // interactive <select>, so stripping its HTML would merge every option label).
        cols.push({
          key: 'jcManualTag', label: 'Manual Tagging', render: jcTagCell,
          text: function (v, row) {
            if (row && row.inNikiList && isForReview(row)) return "In Niki's List"; // for-review + in Niki's sheet
            if (v && String(v).trim()) return String(v);      // tagged, e.g. "Could be SEO or Paid Ad" (JC prevails)
            if (row.jcReviewed) return 'Not paid ad / SEO';   // reviewed, cleared
            return '—';                                       // unset / for review (not in Niki's list)
          },
        });
      }
      // Meta columns pinned to the far right, shown/hidden by the toolbar toggle.
      if (SHOW_META_COLS) {
        cols.push(
          { key: 'matchMethod', label: 'Match', render: methodPill },
          { key: 'confidence', label: 'Confidence', render: confPill },
          { key: 'timeDeltaSeconds', label: 'Δ (s)', unit: 'num' },
          { key: 'matchedAt', label: 'Matched At', unit: 'date' },
          { key: 'cpc', label: 'CPC (AUD)', unit: 'currency', render: cpcCell }
        );
      }
      renderSortableTable('acsRows', leads, cols, {
        stateStore: TABLE_STATE,
        searchPlaceholder: 'Search contacts…',
        sortKey: 'cdate', sortDir: 'desc',
        emptyText: 'No leads in this date range.',
        rowClass: function (r) {
          var cls = [];
          if (isForReview(r)) cls.push('acs-review');
          if (SHOW_XERO_COLS && isFeeMismatch(r)) cls.push('acs-fee-review');
          return cls.join(' ');
        },
        onCount: function (shown, total) {
          var el = document.getElementById('acsCount');
          if (el) el.textContent = shown === total ? (total + ' leads') : (shown + ' of ' + total + ' leads');
        },
        onFilter: function (filteredList) {
          renderKpis(filteredList);
        },
      });
    }

    function apply() {
      var rows = filteredRows();
      renderKpis(rows);
      renderTable(rows);
      updateDateLabel();
    }

    // Reflect the active date range on the popover trigger button (and flag it
    // "active" when any range is set) so the filter stays visible while collapsed.
    function updateDateLabel() {
      var btn = document.getElementById('acsDateBtn');
      if (!btn) return;
      var from = document.getElementById('acsFrom').value;
      var to = document.getElementById('acsTo').value;
      var quick = document.querySelector('#acsQuick button.active');
      var days = quick ? quick.getAttribute('data-days') : null;
      var label, active = true;
      if (days && days !== '0') label = 'Last ' + quick.textContent;
      else if (from && to) label = fmtDate(from) + ' – ' + fmtDate(to);
      else if (from) label = 'From ' + fmtDate(from);
      else if (to) label = 'Until ' + fmtDate(to);
      else { label = 'All dates'; active = false; }
      btn.textContent = label;
      btn.classList.toggle('active', active);
    }

    function setQuick(days) {
      var from = document.getElementById('acsFrom'), to = document.getElementById('acsTo');
      if (!days) { from.value = ''; to.value = ''; }
      else {
        var end = new Date();
        var start = new Date(); start.setDate(start.getDate() - days);
        to.value = end.toISOString().slice(0, 10);
        from.value = start.toISOString().slice(0, 10);
      }
      apply();
    }

    function wireToolbar() {
      // Date-range popover: open/close the panel that now holds From/To + quick ranges.
      var dateBtn = document.getElementById('acsDateBtn');
      var datePopup = document.getElementById('acsDatePopup');
      if (dateBtn && datePopup) {
        dateBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var willOpen = datePopup.hidden;
          datePopup.hidden = !willOpen;
          dateBtn.setAttribute('aria-expanded', String(willOpen));
        });
        datePopup.addEventListener('click', function (e) { e.stopPropagation(); });
        document.addEventListener('click', function (e) {
          if (!datePopup.hidden && e.target !== dateBtn) {
            datePopup.hidden = true;
            dateBtn.setAttribute('aria-expanded', 'false');
          }
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !datePopup.hidden) {
            datePopup.hidden = true;
            dateBtn.setAttribute('aria-expanded', 'false');
          }
        });
      }
      document.getElementById('acsFrom').addEventListener('change', function () { clearQuickActive(); apply(); });
      document.getElementById('acsTo').addEventListener('change', function () { clearQuickActive(); apply(); });
      document.querySelectorAll('#acsQuick button').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#acsQuick button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          setQuick(Number(b.getAttribute('data-days')));
        });
      });
      document.getElementById('acsReset').addEventListener('click', function () {
        document.querySelectorAll('#acsQuick button').forEach(function (x) { x.classList.remove('active'); });
        document.querySelector('#acsQuick button[data-days="0"]').classList.add('active');
        setQuick(0);
      });
      var jcBtn = document.getElementById('acsJcToggle');
      if (jcBtn) {
        // Reflect the current column state — default-on for reviewers (see init below).
        jcBtn.classList.toggle('active', SHOW_JC_COL);
        jcBtn.setAttribute('aria-pressed', String(SHOW_JC_COL));
        jcBtn.textContent = (SHOW_JC_COL ? 'Hide' : 'Show') + ' Manual Tagging';
        jcBtn.addEventListener('click', function () {
          SHOW_JC_COL = !SHOW_JC_COL;
          jcBtn.classList.toggle('active', SHOW_JC_COL);
          jcBtn.setAttribute('aria-pressed', String(SHOW_JC_COL));
          jcBtn.textContent = (SHOW_JC_COL ? 'Hide' : 'Show') + ' Manual Tagging';
          apply();
        });
      }
      // Delegated handler for the in-cell JC tag controls (the table HTML is rebuilt on
      // every apply(), so listen on the persistent #acsRows host). Authorized server-side.
      var jcHost = document.getElementById('acsRows');
      if (jcHost) jcHost.addEventListener('change', function (e) {
        var sel = (e.target && e.target.closest) ? e.target.closest('.acs-jc-select') : null;
        if (!sel) return;
        var contactId = sel.getAttribute('data-jc-contact');
        var row = ALL_ROWS.filter(function (r) { return String(r.contactId) === String(contactId); })[0];
        var raw = sel.value;
        // "— set tag —" (value '') RESETS an already-reviewed row — removes the override
        // so it goes back to "for review"; on an unreviewed row it's a no-op.
        var isReset = raw === '';
        if (isReset && (!row || !row.jcReviewed)) return;
        var body = isReset
          ? { contactId: contactId, reset: true }
          : { contactId: contactId, decision: raw === '__not__' ? '' : raw };
        sel.disabled = true;
        postJSON('/api/operations/contact-sources/jc-tag', body)
          .then(function (resp) {
            if (row) {
              row.jcManualTag = resp.jcManualTag || null;
              row.jcReviewed = !!resp.jcReviewed;
              row.jcSetBy = resp.jcSetBy || null;
              row.jcSetAt = resp.jcSetAt || null;
            }
            apply(); // rebuilds the table: reset → highlight returns; tag → pill shows
          })
          .catch(function (err) {
            sel.disabled = false;
            alert('Could not save tag: ' + err.message);
          });
      });
      var xeroBtn = document.getElementById('acsXeroToggle');
      if (xeroBtn) xeroBtn.addEventListener('click', function () {
        SHOW_XERO_COLS = !SHOW_XERO_COLS;
        xeroBtn.classList.toggle('active', SHOW_XERO_COLS);
        xeroBtn.setAttribute('aria-pressed', String(SHOW_XERO_COLS));
        xeroBtn.textContent = (SHOW_XERO_COLS ? 'Hide' : 'Show') + ' Xero $';
        apply();
      });
      var roasBtn = document.getElementById('acsRoasToggle');
      if (roasBtn) roasBtn.addEventListener('click', function () {
        ROAS_ONLY = !ROAS_ONLY;
        roasBtn.classList.toggle('active', ROAS_ONLY);
        roasBtn.setAttribute('aria-pressed', String(ROAS_ONLY));
        roasBtn.textContent = ROAS_ONLY ? 'Show all rows' : 'ROAS-counted only';
        apply();
      });
      var metaBtn = document.getElementById('acsMetaToggle');
      if (metaBtn) metaBtn.addEventListener('click', function () {
        SHOW_META_COLS = !SHOW_META_COLS;
        metaBtn.classList.toggle('active', SHOW_META_COLS);
        metaBtn.setAttribute('aria-pressed', String(SHOW_META_COLS));
        metaBtn.textContent = (SHOW_META_COLS ? 'Hide' : 'Show') + ' extra columns';
        apply();
      });
    }
    function clearQuickActive() {
      document.querySelectorAll('#acsQuick button').forEach(function (x) { x.classList.remove('active'); });
    }

    function loadContactSources() {
      var host = document.getElementById('acsRows');
      host.innerHTML = '<div class="muted" style="padding:14px">Loading contact sources…</div>';
      fetchJSON('/api/operations/contact-sources').then(function (data) {
        var rawRows = (data.rows && data.rows.data) || [];
        ALL_ROWS = rawRows.filter(function (r) { return !isExcludedRow(r); });
        setChips('acsChips', data.rows && data.rows.meta);
        apply();
      }).catch(function (err) {
        console.error(err);
        host.innerHTML = '<div class="needs-setup"><strong>Couldn’t load contact sources</strong><span>' + esc(err.message) + '</span></div>';
      });
    }

    initPage('operations'); // login / top-bar / theme only — this page renders its own table
    // Reviewers (James + admins) get the JC column open by default so the tagging
    // controls are visible without first toggling it on.
    if (canTagJc()) SHOW_JC_COL = true;
    renderMarketingSidebar('leads');
    if (currentUser()) { wireToolbar(); loadContactSources(); }
  </script>
</body>
</html>
