<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach Campaign — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Email & Partners — bespoke visual layer following
       DESIGN_GUIDE.md and marketing.html. LIVE data via
       /api/marketing/email-partners (weekly AC snapshot cache).
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
      --ep-warn: #b4531f;
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
      --ep-warn: #f08c5b;
    }

    /* Full-width layout matching marketing.html / content_social.html */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards */
    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .card-head.block-head {
      display: block;
      margin-bottom: 14px;
    }
    .card-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .chart-cap {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Controls bar + segmented toggles (same as marketing.html) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* Top 4 KPI cards */
    .ep-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    @media (max-width: 960px) {
      .ep-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .ep-kpi-grid { grid-template-columns: 1fr; }
    }
    .ep-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--mkt-shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .ep-kpi:hover {
      transform: translateY(-2px);
      box-shadow: var(--mkt-shadow-lift);
    }
    .ep-kpi .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .ep-kpi .value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin: 8px 0 6px;
      color: var(--text);
    }
    .ep-kpi .sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ep-kpi .sub.pos {
      color: var(--pos);
    }
    .ep-kpi .sub.warn {
      color: var(--ep-warn);
    }

    /* Partner outreach table card */
    .ep-outreach-card {
      padding: 22px 24px;
      margin-bottom: 14px;
    }
    /* Indirect Deals table card */
    .ep-deals-card {
      padding: 22px 24px;
      margin-bottom: 14px;
    }
    .src-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: baseline;
    }
    .ep-table-wrap {
      overflow-x: auto;
    }
    table.ep-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 680px;
    }
    table.ep-table th,
    table.ep-table td {
      padding: 12px 10px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    table.ep-table th:first-child,
    table.ep-table td:first-child {
      text-align: left;
      padding-left: 4px;
    }
    table.ep-table th:last-child,
    table.ep-table td:last-child {
      padding-right: 4px;
    }
    table.ep-table thead th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding-top: 6px;
      padding-bottom: 10px;
    }
    table.ep-table tbody td {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Footnote below the table card */
    .ep-footnote {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <nav class="tabbar">

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar (same per-FY top toggle filter as marketing.html) -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>

            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>

      <!-- Top 4 KPI cards -->
      <div class="ep-kpi-grid" id="epKpis"></div>

      <!-- Enquiries vs bookings by month — one stacked bar per month per partner -->
      <div class="grid">
        <div class="card col-6">
          <div class="card-head" style="display:block;margin-bottom:10px">
            <h3>The Tailor — enquiries vs bookings <span class="head-info" data-info="One bar per month for The Tailor: enquiries (deals created that month) with the won bookings stacked on top, for the selected period. Bookings are counted in the month the enquiry came in, so recent months may still rise." data-src="ActiveCampaign — The Tailor (indirect deals)"></span></h3>
          </div>
          <div class="chart-box"><canvas id="tailorCanvas"></canvas></div>
        </div>
        <div class="card col-6">
          <div class="card-head" style="display:block;margin-bottom:10px">
            <h3>Speaker Bureaus — enquiries vs bookings <span class="head-info" data-info="One bar per month for the Speaker Bureaus: enquiries (deals created that month) with the won bookings stacked on top, for the selected period. Bookings are counted in the month the enquiry came in." data-src="ActiveCampaign — Speaker bureaus (indirect deals)"></span></h3>
          </div>
          <div class="chart-box"><canvas id="bureauCanvas"></canvas></div>
        </div>
      </div>

      <!-- Indirect Deals table card -->
      <div class="card ep-deals-card">
        <div class="card-head block-head">
          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;">
            <div>
              <h3 id="indirectDealsHeading">Indirect Deals<span class="head-info" data-info="Every individual bureau and tailor deal from ActiveCampaign — one row per deal — for the selected period. Sort, search and filter by column." data-src="ActiveCampaign (a booking is a won deal)"></span></h3>
              <div class="muted" style="font-size:12px;margin-top:4px" id="indirectDealsCount"></div>
            </div>
            <div class="mkt-controls" style="margin:0">
              <span id="drAnchor" hidden></span>
            </div>
          </div>

      </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=27"></script>
  <script>
    /* Outreach Campaign (Email & Partners) — LIVE.
       Everything on this page derives from the INDIRECT (Speaker Bureaus + The Tailor)
       deals in ActiveCampaign, served per-deal by /api/marketing/indirect-deals
       (public.ac_indirect_deals, with the Xero engagement fee joined by deal title).
       The 4 KPI cards + both enquiries-vs-bookings charts are computed CLIENT-SIDE from
       those rows for the selected financial year (or custom date range), with deltas
       driven by the Compare toggle (vs last year | vs previous period). */

    var DEALS = { rows: null, loading: false, loaded: false };
    var DEALS_TABLE_STATE = {};
    var CUSTOM = false;

    // Enquiries green, bookings blue — stacked, one bar per month.
    var C_ENQ = '#17a673', C_BOOK = '#3b6ef0';
    var EP_SRC = 'ActiveCampaign indirect deals (public.ac_indirect_deals). Won revenue uses the ' +
      'Xero engagement fee where the deal is invoiced, otherwise the ActiveCampaign deal value.';

    // ---- selection helpers -------------------------------------------------
    function selFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }
    function fyEndOf(key) { return key === 'all' ? null : 2000 + parseInt(key.slice(2), 10); }
    function selCmp() {
      var b = document.querySelector('#cmpSeg button.active');
      return b ? b.getAttribute('data-cmp') : 'yoy';
    }

    function money(n) { return (n == null || isNaN(n)) ? '—' : '$' + Math.round(n).toLocaleString('en-AU'); }
    function num(n)   { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-AU'); }

    // Won revenue for a deal: Xero engagement fee where invoiced, else AC deal value.
    function dealRev(d) { return (d.engagementFee != null ? d.engagementFee : (d.value || 0)) || 0; }

    // ---- date math (YYYY-MM-DD) --------------------------------------------
    function addDays(s, n)   { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    function shiftYear(s, n) { var p = s.split('-'); return (Number(p[0]) + n) + '-' + p[1] + '-' + p[2]; }
    function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }

    // ---- period windows ----------------------------------------------------
    // A window is {fyEnd} for an FY, {from,to} (inclusive) for a custom range, or null = all.
    function curWindow() {
      if (CUSTOM) { var r = getDateRange(); return { from: r.from || null, to: r.to || null }; }
      var key = selFyKey();
      if (key === 'all') return null;
      return { fyEnd: fyEndOf(key) };
    }
    // The comparison window, given the Compare mode.
    function baseWindow(w) {
      if (!w) return null;                                     // all years → no baseline
      if (w.fyEnd != null) return { fyEnd: w.fyEnd - 1 };      // prior FY (both modes)
      if (!w.from || !w.to) return null;                       // open-ended range → no baseline
      if (selCmp() === 'prev') {                               // equal-length window right before `from`
        var days = daysBetween(w.from, w.to) + 1;
        var to = addDays(w.from, -1);
        return { from: addDays(to, -(days - 1)), to: to };
      }
      return { from: shiftYear(w.from, -1), to: shiftYear(w.to, -1) };  // same window a year earlier
    }
    function rowsIn(w) {
      var rows = DEALS.rows || [];
      if (!w) return rows;
      if (w.fyEnd != null) return rows.filter(function (d) { return d.fyEnd === w.fyEnd; });
      return rows.filter(function (d) {
        return (!w.from || d.date >= w.from) && (!w.to || d.date <= w.to);
      });
    }

    // ---- month-windowed FY comparison (matches marketing.html) --------------
    // So "vs previous period" (the N data-months immediately before the current
    // window) is genuinely different from "vs last year" (those same months one
    // year earlier). For a full past FY both resolve to the prior FY; they diverge
    // for the partial CURRENT FY. (Custom ranges keep the day-level windows above.)
    function monthsWithData() {
      var set = {};
      (DEALS.rows || []).forEach(function (d) { if (d.month) set[d.month] = 1; });
      return set;
    }
    function fyMonths(fyEnd) {
      var set = {};
      (DEALS.rows || []).forEach(function (d) { if (d.fyEnd === fyEnd && d.month) set[d.month] = 1; });
      return Object.keys(set).sort();
    }
    function shiftMonths(months, n) {   // shift every 'YYYY-MM' by n years
      return months.map(function (mm) { var p = mm.split('-'); return (Number(p[0]) + n) + '-' + p[1]; });
    }
    function precedingMonths(months) {  // the months.length months immediately before months[0]
      if (!months.length) return [];
      var p = months[0].split('-'), y = Number(p[0]), mo = Number(p[1]), out = [];
      for (var i = 0; i < months.length; i++) {
        mo--; if (mo < 1) { mo = 12; y--; }
        out.unshift(y + '-' + (mo < 10 ? '0' + mo : '' + mo));
      }
      return out;
    }
    function figuresForMonths(monthKeys) {
      var set = {};
      monthKeys.forEach(function (m) { set[m] = 1; });
      return figures((DEALS.rows || []).filter(function (d) { return d.month && set[d.month]; }));
    }
    // Current + baseline KPI figures for the active selection and Compare mode.
    function curBaseFigures() {
      if (CUSTOM) {                       // custom range → day-level windows (already mode-aware)
        var w = curWindow(), bw = baseWindow(w);
        return { cur: figures(rowsIn(w)), base: bw ? figures(rowsIn(bw)) : null };
      }
      var key = selFyKey();
      if (key === 'all') return { cur: figures(DEALS.rows || []), base: null };   // no baseline
      var curMonths = fyMonths(fyEndOf(key));
      var baseMonths = selCmp() === 'prev' ? precedingMonths(curMonths) : shiftMonths(curMonths, -1);
      var present = monthsWithData();
      var hasBase = baseMonths.some(function (m) { return present[m]; });
      return { cur: figuresForMonths(curMonths), base: hasBase ? figuresForMonths(baseMonths) : null };
    }

    // ---- KPI figures over a row set ----------------------------------------
    // Contacts = distinct partner contacts; Enquiries = all deals; Bookings = won deals;
    // Won revenue = engagement-fee total of the won deals.
    function figures(rows) {
      var contacts = {}, enquiries = 0, bookings = 0, wonRev = 0;
      rows.forEach(function (d) {
        var k = d.contactId || d.contactEmail || d.contactName;
        if (k) contacts[k] = 1;
        enquiries++;
        if (d.won) { bookings++; wonRev += dealRev(d); }
      });
      return { contacts: Object.keys(contacts).length, enquiries: enquiries, bookings: bookings, wonRev: wonRev };
    }

    function cmpLabel() {
      if (selCmp() === 'prev') return 'vs prev period';
      if (!CUSTOM && selFyKey() !== 'all') return 'vs FY' + String(fyEndOf(selFyKey()) - 1).slice(-2);
      return 'vs last yr';
    }

    function kpiCard(label, value, subHtml, subCls, info) {
      return '<div class="ep-kpi">' +
        '<div class="label">' + esc(label) + (info || '') + '</div>' +
        '<div class="value">' + value + '</div>' +
        '<div class="sub ' + (subCls || '') + '">' + subHtml + '</div>' +
      '</div>';
    }

    function renderKpiRow() {
      var grid = document.getElementById('epKpis');
      if (!grid) return;
      if (!DEALS.loaded) { grid.innerHTML = '<div class="muted" style="padding:8px 2px">Loading…</div>'; return; }
      var cb = curBaseFigures();
      var cur = cb.cur, base = cb.base;

      // Delta line for a field (up is good for all four KPIs).
      function sub(field, fmt) {
        if (!base) return { html: '&nbsp;', cls: '' };
        var d = cur[field] - base[field], flat = Math.abs(d) < 0.5;
        return {
          html: (flat ? '' : (d > 0 ? '▲ ' : '▼ ')) + fmt(Math.abs(d)) + ' ' + esc(cmpLabel()),
          cls: flat ? '' : (d > 0 ? 'pos' : 'warn'),
        };
      }
      var sc = sub('contacts', num), se = sub('enquiries', num),
          sb = sub('bookings', num), sr = sub('wonRev', money);

      grid.innerHTML = [
        kpiCard('Contacts', num(cur.contacts), sc.html, sc.cls,
          infoTip('Distinct Speaker Bureaus and The Tailor contacts with an indirect deal in the selected period.', EP_SRC)),
        kpiCard('Enquiries', num(cur.enquiries), se.html, se.cls,
          infoTip('Every indirect (bureau + The Tailor) deal created in the selected period, in any status.', EP_SRC)),
        kpiCard('Bookings', num(cur.bookings), sb.html, sb.cls,
          infoTip('Indirect deals won in the selected period — a booking is a won deal.', EP_SRC)),
        kpiCard('Won revenue', money(cur.wonRev), sr.html, sr.cls,
          infoTip('Engagement-fee total of the won indirect deals — the Xero engagement fee where invoiced, otherwise the AC deal value.', EP_SRC)),
      ].join('');
    }

    // ---- Enquiries vs bookings by month (stacked bars) ---------------------
    var _MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function monthSpanLabel(ym) {
      var p = String(ym).split('-'), year = +p[0], m1 = +p[1];
      var last = new Date(Date.UTC(year, m1, 0)).getUTCDate();
      var startDay = 1, endDay = last;
      if (dateRangeActive()) {
        var r = getDateRange();
        if (r.from && r.from.slice(0, 7) === ym) startDay = +r.from.slice(8, 10) || 1;
        if (r.to && r.to.slice(0, 7) === ym) endDay = +r.to.slice(8, 10) || last;
      }
      return _MON[m1 - 1] + ' ' + startDay + '-' + endDay;
    }
    // One partner, over the current window → { months, enq[], book[] }.
    function monthSeries(isTailor) {
      var rows = rowsIn(curWindow()).filter(function (d) { return d.isTailor === isTailor; });
      var months = Array.from(new Set(rows.map(function (d) { return d.month; }).filter(Boolean))).sort();
      var enq = {}, book = {};
      rows.forEach(function (d) {
        enq[d.month] = (enq[d.month] || 0) + 1;
        if (d.won) book[d.month] = (book[d.month] || 0) + 1;
      });
      return {
        months: months,
        enq: months.map(function (m) { return enq[m] || 0; }),
        book: months.map(function (m) { return book[m] || 0; }),
      };
    }
    var _charts = {};
    function renderPartnerChart(canvasId, isTailor) {
      var el = document.getElementById(canvasId);
      if (!el) return;
      var s = monthSeries(isTailor), tc = themeColors();
      if (_charts[canvasId]) { _charts[canvasId].destroy(); _charts[canvasId] = null; }
      _charts[canvasId] = new Chart(el.getContext('2d'), {
        type: 'bar',
        data: {
          labels: s.months.map(monthSpanLabel),
          datasets: [
            { label: 'Enquiries', data: s.enq, backgroundColor: C_ENQ, borderRadius: 3, maxBarThickness: 44, stack: 'eb' },
            { label: 'Bookings',  data: s.book, backgroundColor: C_BOOK, borderRadius: 3, maxBarThickness: 44, stack: 'eb' },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { color: tc.muted, font: { size: 11 }, autoSkip: true, maxRotation: 0 } },
            y: { stacked: true, beginAtZero: true, grid: { color: tc.grid }, ticks: { color: tc.muted, font: { size: 11 }, precision: 0 } },
          },
          plugins: {
            legend: { position: 'bottom', labels: { color: tc.text, usePointStyle: true, pointStyle: 'rect', boxWidth: 10, padding: 14 } },
          },
        },
      });
    }
    function renderCharts() {
      renderPartnerChart('tailorCanvas', true);
      renderPartnerChart('bureauCanvas', false);
    }

    // ---- Indirect Deals table (per-deal rows, FY / date-range filtered) -----
    function currentDealRows() {
      var rows = DEALS.rows || [];
      if (dateRangeActive()) {
        var r = getDateRange();
        if (r.from) rows = rows.filter(function (d) { return d.date >= r.from; });
        if (r.to)   rows = rows.filter(function (d) { return d.date <= r.to; });
        return rows;
      }
      var key = selFyKey();
      if (key !== 'all') {
        var fyEnd = fyEndOf(key);
        rows = rows.filter(function (d) { return d.fyEnd === fyEnd || (d.fy && d.fy.toLowerCase() === key); });
      }
      return rows;
    }

    function renderIndirectDealsTable() {
      var host = document.getElementById('indirectDealsRows');
      var cnt = document.getElementById('indirectDealsCount');
      if (!host) return;
      if (DEALS.rows === null) {
        host.innerHTML = '<div class="muted" style="padding:10px 2px">Loading…</div>';
        if (cnt) cnt.textContent = '';
        return;
      }
      var rows = currentDealRows();
      function txt(v) { return (v == null || v === '') ? '—' : esc(v); }
      function fyCell(v, r) {
        var val = v || (r && r.fyEnd ? 'FY' + String(r.fyEnd).slice(-2) : '');
        return val ? esc(val) : '—';
      }
      function partnerCell(v) {
        var col = (v === 'The Tailor') ? '#d9663a' : '#6a4bf5';
        return '<span class="src-dot" style="background:' + col + '"></span>' + esc(v || '—');
      }
      function statusCell(v, row) {
        return row.won ? '<strong>' + esc(v || 'Won') + '</strong>' : esc(v || '—');
      }
      var cols = [
        { key: 'fy', label: 'FY', render: fyCell, text: function (v, r) { return r.fy || (r.fyEnd ? 'FY' + String(r.fyEnd).slice(-2) : ''); } },
        { key: 'date', label: 'Date', unit: 'date' },
        { key: 'partner', label: 'Partner', render: partnerCell, text: function (v) { return v || ''; } },
        { key: 'org', label: 'Organisation', render: txt },
        { key: 'title', label: 'Deal', render: txt },
        { key: 'contact', label: 'Contact', render: txt },
        { key: 'status', label: 'Status', render: statusCell, text: function (v, row) { return row.won ? (v || 'Won') : (v || ''); } },
        { key: 'value', label: 'Value', unit: 'currency' },
      ];
      renderSortableTable('indirectDealsRows', rows, cols, {
        stateStore: DEALS_TABLE_STATE,
        searchPlaceholder: 'Search indirect deals…',
        sortKey: 'date', sortDir: 'desc',
        emptyText: 'No indirect deals match the selected filters.',
        pageSize: 50,
        onCount: function (shown, total, list) {
          var won = (list || []).filter(function (r) { return r.won; });
          var wonRev = won.reduce(function (a, r) { return a + dealRev(r); }, 0);
          if (cnt) {
            cnt.textContent = (shown === total ? total : shown + ' of ' + total) +
              ' deal' + (total === 1 ? '' : 's') + ' · ' + won.length + ' booked (' + money(wonRev) + ')';
          }
        },
      });
    }

    function renderAll() {
      renderKpiRow();
      renderCharts();
      renderIndirectDealsTable();
    }

    function setFyNote() {
      var el = document.getElementById('fyNote');
      if (el) el.textContent = DEALS.loaded ? 'Live · ActiveCampaign indirect deals' : '';
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    function applyRange() {
      CUSTOM = dateRangeActive();
      setFySegDisabled(CUSTOM);
      renderAll();
    }

    function load() {
      fetchJSON('/api/marketing/indirect-deals').then(function (d) {
        DEALS.rows = (d && d.deals) || [];
        DEALS.loading = false;
        DEALS.loaded = true;
        setFyNote();
        renderAll();
      }).catch(function (err) {
        console.error('indirect-deals', err);
        DEALS.rows = [];
        DEALS.loaded = true;
        var grid = document.getElementById('epKpis');
        if (grid) grid.innerHTML = '<div class="muted" style="padding:8px 2px">Failed to load partner metrics.</div>';
        var note = document.getElementById('fyNote'); if (note) note.textContent = '';
        renderAll();
      });
    }

    initPage('marketing');
    renderMarketingHead(true);   // live page — shared Marketing head, no "sample data" badge
    renderMarketingSidebar('email-partners');
    renderDateRange({ after: 'drAnchor' });
    fillHeadInfo();              // fill the static chart / table heading info tools
    wireSeg('fySeg', renderAll);
    wireSeg('cmpSeg', renderKpiRow);   // Compare mode only changes the KPI delta lines
    wireDateRange({ onChange: applyRange });
    renderAll();                 // loading placeholders
    load();
  </script>
</body>
</html>
