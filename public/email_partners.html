<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email &amp; Partners — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Email & Partners — bespoke visual layer following
       DESIGN_GUIDE.md and marketing.html. LIVE data via
       /api/marketing/email-partners (weekly AC snapshot cache).
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
      --ep-warn: #b4531f;
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
      --ep-warn: #f08c5b;
    }

    /* Full-width layout matching marketing.html / content_social.html */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards */
    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .card-head.block-head {
      display: block;
      margin-bottom: 14px;
    }
    .card-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .chart-cap {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Controls bar + segmented toggles (same as marketing.html) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* Top 5 KPI cards */
    .ep-kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    @media (max-width: 1080px) {
      .ep-kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .ep-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .ep-kpi-grid { grid-template-columns: 1fr; }
    }
    .ep-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--mkt-shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .ep-kpi:hover {
      transform: translateY(-2px);
      box-shadow: var(--mkt-shadow-lift);
    }
    .ep-kpi .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .ep-kpi .value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin: 8px 0 6px;
      color: var(--text);
    }
    .ep-kpi .sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ep-kpi .sub.pos {
      color: var(--pos);
    }
    .ep-kpi .sub.warn {
      color: var(--ep-warn);
    }

    /* Partner outreach table card */
    .ep-outreach-card {
      padding: 22px 24px;
      margin-bottom: 14px;
    }
    .ep-table-wrap {
      overflow-x: auto;
    }
    table.ep-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 680px;
    }
    table.ep-table th,
    table.ep-table td {
      padding: 12px 10px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    table.ep-table th:first-child,
    table.ep-table td:first-child {
      text-align: left;
      padding-left: 4px;
    }
    table.ep-table th:last-child,
    table.ep-table td:last-child {
      padding-right: 4px;
    }
    table.ep-table thead th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding-top: 6px;
      padding-bottom: 10px;
    }
    table.ep-table tbody td {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Footnote below the table card */
    .ep-footnote {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar (same per-FY top toggle filter as marketing.html) -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
          <div class="spacer" style="flex:1"></div>
          <span class="muted" id="fyNote" style="font-size:13px">Loading…</span>
        </div>
      </div>

      <!-- Top 5 KPI cards -->
      <div class="ep-kpi-grid" id="epKpis"></div>

      <!-- Partner outreach table card -->
      <div class="card ep-outreach-card">
        <div class="card-head block-head">
          <h3 id="outreachHeading">Partner outreach<span class="head-info" data-info="Indirect (bureau / tailor) partner deals for the selected financial year — contacts, enquiries, bookings and won revenue, with the prior FY's revenue alongside. The &quot;Sent on time&quot; and &quot;Replies&quot; columns are pending: send cadence and replies aren't tracked in ActiveCampaign." data-src="GET /api/marketing/email-partners — public.ac_indirect_deals (is_tailor split) via public.email_partner_metrics; partner contacts from the ActiveCampaign SPEAKERS BUREAUS list"></span></h3>
        </div>
        <div class="ep-table-wrap" tabindex="0" role="region" aria-labelledby="outreachHeading">
          <table class="ep-table">
            <thead>
              <tr>
                <th>Partner</th>
                <th>Sent on time</th>
                <th>Contacts</th>
                <th>Replies</th>
                <th>Enquiries</th>
                <th>Bookings</th>
                <th>Revenue (won)</th>
                <th>Prior FY</th>
              </tr>
            </thead>
            <tbody id="outreachBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js?v=14"></script>
  <script>
    /* Email & Partners — LIVE.
       Email KPIs come from ActiveCampaign (run_campaign_performance_report), and
       partner deal figures from the CRM (ac_indirect_deals). Both are snapshotted
       WEEKLY by the email-partners-sync routine into public.email_partner_metrics
       and served by /api/marketing/email-partners (latest row per FY). Replies and
       send-cadence aren't tracked in ActiveCampaign, so those tiles show a
       'pending' chip. */

    var EP = { byFy: {}, all: null, loaded: false, capturedAt: null };
    // Email & Partners is stored only as FY-aggregate rows (one row = whole-FY KPIs), so a
    // custom date range narrower than an FY can't be computed. While a range is active the
    // whole page greys out (the FY toggle is dimmed by the shared control).
    var CUSTOM = false;

    function selFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }
    function fyEndOf(key) { return key === 'all' ? null : 2000 + parseInt(key.slice(2), 10); }
    function fyName(key) { return key === 'all' ? 'All years' : key.toUpperCase(); }

    var pendingChip = '<span class="chip warn" title="Not tracked in ActiveCampaign">pending</span>';

    function money(n) { return (n == null || isNaN(n)) ? '—' : '$' + Math.round(n).toLocaleString('en-AU'); }
    function pct(n)   { return (n == null || isNaN(n)) ? '—' : (Math.round(n * 10) / 10) + '%'; }
    function num(n)   { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-AU'); }

    // Aggregate every FY row into the "All years" view (send-weighted rates).
    function buildAll(rows) {
      if (!rows.length) return null;
      var sum = function (f) { return rows.reduce(function (a, r) { return a + (f(r) || 0); }, 0); };
      var sends  = sum(function (r) { return r.email.totalSends; });
      var uopens = sum(function (r) { return r.email.totalUniqueOpens; });
      var uclk   = sum(function (r) { return r.email.totalUniqueClicks; });
      var unsub  = sum(function (r) { return r.email.totalUnsubscribes; });
      var latest = rows[rows.length - 1]; // rows sorted by fyEnd asc → current FY
      return {
        fyEnd: null, fyLabel: 'all',
        email: {
          campaignsSent: sum(function (r) { return r.email.campaignsSent; }),
          totalSends: sends,
          openRate: sends ? (uopens / sends) * 100 : null,
          clickRate: sends ? (uclk / sends) * 100 : null,
          clickToOpenRate: uopens ? (uclk / uopens) * 100 : null,
          unsubscribeRate: sends ? (unsub / sends) * 100 : null,
          totalUnsubscribes: unsub,
          totalUniqueOpens: uopens, totalUniqueClicks: uclk
        },
        subscribers: latest.subscribers,
        partners: {
          bureau: {
            enquiries: sum(function (r) { return r.partners.bureau.enquiries; }),
            bookings:  sum(function (r) { return r.partners.bureau.bookings; }),
            revenue:   sum(function (r) { return r.partners.bureau.revenue; }),
            contacts:  latest.partners.bureau.contacts
          },
          tailor: {
            enquiries: sum(function (r) { return r.partners.tailor.enquiries; }),
            bookings:  sum(function (r) { return r.partners.tailor.bookings; }),
            revenue:   sum(function (r) { return r.partners.tailor.revenue; }),
            contacts:  latest.partners.tailor.contacts
          }
        }
      };
    }

    function curRow()  { var k = selFyKey(); return k === 'all' ? EP.all : (EP.byFy[fyEndOf(k)] || null); }
    function prevRow() { var k = selFyKey(); return k === 'all' ? null  : (EP.byFy[fyEndOf(k) - 1] || null); }

    // Shared provenance string for every email KPI (goes in the ⓘ only).
    var EP_SRC = 'GET /api/marketing/email-partners — public.email_partner_metrics ' +
      '(latest weekly snapshot per FY; email KPIs from ActiveCampaign ' +
      'run_campaign_performance_report, filled by the email-partners-sync routine).';

    function kpiCard(label, value, subHtml, subCls, info) {
      return '<div class="ep-kpi">' +
        '<div class="label">' + esc(label) + (info || '') + '</div>' +
        '<div class="value">' + value + '</div>' +
        '<div class="sub ' + (subCls || '') + '">' + subHtml + '</div>' +
      '</div>';
    }

    function renderKpiRow() {
      var grid = document.getElementById('epKpis');
      if (!grid) return;
      if (CUSTOM) { grid.innerHTML = '<div class="range-na">Not available for custom ranges — Email &amp; Partners is reported by financial year. Clear the date range to view it.</div>'; return; }
      if (!EP.loaded) { grid.innerHTML = '<div class="muted" style="padding:8px 2px">Loading…</div>'; return; }
      var r = curRow();
      if (!r) { grid.innerHTML = '<div class="muted" style="padding:8px 2px">No snapshot for ' + esc(fyName(selFyKey())) + ' yet.</div>'; return; }

      var e = r.email, key = selFyKey(), prev = prevRow();
      var priorTag = (key === 'all' || !prev) ? '' : (' vs FY' + String(fyEndOf(key) - 1).slice(-2));

      // Click-rate delta (percentage points) vs prior FY.
      var clkSub = 'Click rate', clkCls = '';
      if (prev && prev.email.clickRate != null && e.clickRate != null) {
        var d = e.clickRate - prev.email.clickRate, flat = Math.abs(d) < 0.05;
        clkSub = (flat ? '' : (d > 0 ? '▲ ' : '▼ ')) + (Math.round(Math.abs(d) * 10) / 10) + ' pts' + priorTag;
        clkCls = flat ? '' : (d > 0 ? 'pos' : 'warn');
      }

      grid.innerHTML = [
        kpiCard('Subscribed contacts', num(r.subscribers.activeContacts), '&nbsp;', '',
          infoTip('Contacts currently subscribed / active in ActiveCampaign as of the latest snapshot for the selected FY.', EP_SRC)),
        kpiCard('EDM sends', num(e.campaignsSent), num(e.totalSends) + ' emails sent', 'pos',
          infoTip('Email campaigns sent this FY (headline) and total emails delivered (below). Open rate ' + pct(e.openRate) + ', click-to-open ' + pct(e.clickToOpenRate) + ' — opens are inflated by Apple Mail Privacy.', EP_SRC)),
        kpiCard('Click rate', pct(e.clickRate), clkSub, clkCls,
          infoTip('Unique click rate across campaigns this FY; the sub-line is the change vs the prior FY in percentage points.', EP_SRC)),
        kpiCard('Replies', '—', pendingChip, '',
          infoTip('Replies received to partner / campaign emails. Not tracked in ActiveCampaign, so this tile stays pending.', EP_SRC)),
        kpiCard('Unsubscribes', num(e.totalUnsubscribes), pct(e.unsubscribeRate) + ' of sends', 'warn',
          infoTip('Unsubscribes this FY (headline) and as a percentage of emails sent (below).', EP_SRC))
      ].join('');
    }

    function partnerRow(name, p, prevP) {
      return '<tr>' +
        '<td>' + esc(name) + '</td>' +
        '<td>' + pendingChip + '</td>' +           // Sent on time — not tracked in AC
        '<td>' + num(p.contacts) + '</td>' +
        '<td>' + pendingChip + '</td>' +           // Replies — not tracked in AC
        '<td>' + num(p.enquiries) + '</td>' +
        '<td>' + num(p.bookings) + '</td>' +
        '<td>' + money(p.revenue) + '</td>' +
        '<td>' + (prevP ? money(prevP.revenue) : '—') + '</td>' +
      '</tr>';
    }

    function renderOutreachTable() {
      var body = document.getElementById('outreachBody');
      if (!body) return;
      if (CUSTOM) { body.innerHTML = '<tr><td colspan="8" class="range-na">Not available for custom ranges — reported by financial year. Clear the date range to view it.</td></tr>'; return; }
      if (!EP.loaded) { body.innerHTML = '<tr><td colspan="8" class="muted">Loading…</td></tr>'; return; }
      var r = curRow(), prev = prevRow();
      if (!r) { body.innerHTML = '<tr><td colspan="8" class="muted">No snapshot for ' + esc(fyName(selFyKey())) + ' yet.</td></tr>'; return; }
      body.innerHTML =
        partnerRow('The Tailor',      r.partners.tailor, prev && prev.partners.tailor) +
        partnerRow('Speaker bureaus', r.partners.bureau, prev && prev.partners.bureau);
    }

    function renderAll() {
      renderKpiRow();
      renderOutreachTable();
    }

    function setFyNote() {
      var el = document.getElementById('fyNote');
      if (!el) return;
      if (EP.capturedAt) {
        var dt = new Date(EP.capturedAt);
        el.textContent = 'Weekly snapshot · ' +
          dt.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      } else {
        el.textContent = '';
      }
    }

    function setActiveFy(key) {
      var seg = document.getElementById('fySeg');
      if (!seg || !key) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-fy') === key);
      });
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    function load() {
      fetchJSON('/api/marketing/email-partners').then(function (d) {
        var rows = (d && d.data) || [];
        rows.sort(function (a, b) { return a.fyEnd - b.fyEnd; });
        EP.byFy = {};
        rows.forEach(function (r) { EP.byFy[r.fyEnd] = r; });
        EP.all = buildAll(rows);
        EP.capturedAt = d && d.capturedAt;
        EP.loaded = true;
        if (d && d.defaultFy) setActiveFy(d.defaultFy);
        setFyNote();
        renderAll();
      }).catch(function (err) {
        console.error('email-partners', err);
        EP.loaded = true;
        var grid = document.getElementById('epKpis');
        if (grid) grid.innerHTML = '<div class="muted" style="padding:8px 2px">Failed to load email &amp; partner metrics.</div>';
        document.getElementById('outreachBody').innerHTML = '<tr><td colspan="8" class="muted">Failed to load.</td></tr>';
        var note = document.getElementById('fyNote'); if (note) note.textContent = '';
      });
    }

    function applyRange() { CUSTOM = dateRangeActive(); renderAll(); }

    initPage('marketing');
    renderMarketingHead(true);   // live page — shared Marketing head, no "sample data" badge
    renderMarketingSidebar('email-partners');
    renderDateRange();
    fillHeadInfo();              // fill the static table-heading info tool(s)
    wireSeg('fySeg', renderAll);
    wireDateRange({ onChange: applyRange });
    renderAll();                 // loading placeholders
    load();
  </script>
</body>
</html>
