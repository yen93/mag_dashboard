<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROI — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    /* Wide layout — use the full screen width (same responsive design as the Sales tab). */
    .content { max-width: none; }
    /* Sticky FY toolbar: stays pinned under the top bar when scrolling (like a frozen row). */
    .toolbar {
      position: sticky;
      top: var(--topbar-h, 58px);
      z-index: 9;
      margin: 0 -24px 16px -24px;
      padding: 12px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* ---- ROI accent + depth tokens (mirrors the ROAS tab's blue→purple gradient) ---- */
    :root {
      --roi-accent: var(--accent); --roi-accent-2: #6a4bf5; --roi-accent-soft: #eef2fe;
      --roi-shadow: 0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --roi-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
    }
    :root[data-theme="dark"] {
      --roi-accent-2: #9b7dff; --roi-accent-soft: #1b2440;
      --roi-shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --roi-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
    }

    /* ============================================================
       Bespoke visual layer — same look, feel & hover animations as
       the ROAS tab. DESIGN ONLY: every id/class/behaviour is unchanged.
       NOTE: unlike ROAS we do NOT set overflow:hidden on cards/KPIs,
       because ROI's info-icon (.src-tip) tooltips live inside the card
       heads and KPI labels and would get clipped. The gradient accent
       bars are rounded to the card radius instead.
       ============================================================ */

    /* Soft aurora backdrop behind the whole tab. */
    body {
      background:
        radial-gradient(1100px 400px at 100% -8%, color-mix(in srgb, var(--roi-accent) 11%, transparent), transparent 60%),
        radial-gradient(820px 340px at -6% 2%, color-mix(in srgb, var(--roi-accent-2) 9%, transparent), transparent 56%),
        var(--bg);
      background-attachment: fixed;
    }

    /* Cards — soft shadow, hover lift, gradient accent top border. */
    .card {
      border-radius: 16px; box-shadow: var(--roi-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .grid .card { position: relative; }
    .grid .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--roi-accent), var(--roi-accent-2));
      opacity: 0; transition: opacity .25s ease; pointer-events: none;
    }
    .grid .card:hover { transform: translateY(-3px); box-shadow: var(--roi-shadow-lift); }
    .grid .card:hover::before { opacity: .95; }
    .card-head h3 {
      font-size: 15px; font-weight: 700; letter-spacing: -.01em;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .card-head h3::before {
      content: ""; width: 4px; height: 17px; border-radius: 3px; flex: none;
      background: linear-gradient(var(--roi-accent), var(--roi-accent-2));
    }

    /* KPI tiles — shadow + hover lift + accent bar on hover. */
    .kpi {
      position: relative; border-radius: 16px;
      box-shadow: var(--roi-shadow);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .kpi::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--roi-accent), var(--roi-accent-2));
      opacity: 0; transition: opacity .2s ease; pointer-events: none;
    }
    .kpi:hover { transform: translateY(-3px); box-shadow: var(--roi-shadow-lift); }
    .kpi:hover::after { opacity: .9; }
    .kpi .value { font-size: 29px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    /* Emphasise the first tile (Total revenue headline). */
    .kpi-grid .kpi:first-child {
      background: linear-gradient(140deg, color-mix(in srgb, var(--roi-accent) 13%, var(--surface)), var(--surface) 70%);
      border-color: color-mix(in srgb, var(--roi-accent) 32%, var(--border));
    }
    .kpi-grid .kpi:first-child .value { color: var(--roi-accent); }

    /* Segmented toggles — gradient active pill (same colour as ROAS). */
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--roi-accent), var(--roi-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--roi-accent) 60%, transparent);
    }

    /* ROI by FY table — clickable rows (mirrors the ROAS "ROAS by FY" table). */
    #roiFyTable table.data tbody tr { transition: background .14s ease; }
    #roiFyTable table.data tbody tr.clickrow { cursor: pointer; }
    #roiFyTable table.data tbody tr.clickrow:hover { background: color-mix(in srgb, var(--roi-accent) 8%, transparent); }
    #roiFyTable table.data tbody tr.rowsel { background: color-mix(in srgb, var(--roi-accent) 13%, transparent); }
    #roiFyTable table.data tbody tr.rowsel td:first-child { box-shadow: inset 3px 0 0 var(--roi-accent); }
    #roiFyTable table.data tbody tr.total td { border-top: 2px solid var(--border); font-weight: 700; background: var(--surface-2); }
    #roiFyTable table.data tbody tr.total.rowsel td { background: color-mix(in srgb, var(--roi-accent) 13%, transparent); }
    #roiFyNote { font-size: 12px; }

    /* ---- ROI chat assistant (read-only), bottom-right (mirrors roas.html) ---- */
    #asstLauncher { position: fixed; right: 20px; bottom: 20px; z-index: 50; border: none;
      border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, var(--roi-accent), var(--roi-accent-2)); color: #fff;
      box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--roi-accent) 65%, transparent);
      transition: transform .2s ease, box-shadow .2s ease; }
    #asstLauncher:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -10px color-mix(in srgb, var(--roi-accent) 70%, transparent); }
    #asstPanel { position: fixed; right: 20px; bottom: 20px; z-index: 51; width: 384px;
      max-width: calc(100vw - 32px); height: 564px; max-height: calc(100vh - 100px);
      display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: 0 20px 56px -16px rgba(0,0,0,.45); overflow: hidden; }
    #asstPanel.open { display: flex; }
    .asst-head { display: flex; align-items: center; gap: 8px; padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, color-mix(in srgb, var(--roi-accent) 12%, var(--surface-2)), var(--surface-2)); }
    .asst-head .t { font-weight: 700; font-size: 14px; }
    .asst-head .s { font-size: 11px; color: var(--text-muted); }
    .asst-head .x { margin-left: auto; background: none; border: none; color: var(--text-muted);
      font-size: 20px; line-height: 1; cursor: pointer; }
    .asst-head .x:hover { color: var(--text); }
    .asst-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .asst-msg { max-width: 85%; padding: 9px 12px; border-radius: 13px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .asst-msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--roi-accent), var(--roi-accent-2)); color: #fff; border-bottom-right-radius: 4px; }
    .asst-msg.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .asst-msg.err { align-self: flex-start; background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg); border: 1px solid color-mix(in srgb, var(--neg) 30%, transparent); }
    .asst-hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .asst-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
    .asst-form textarea { flex: 1; resize: none; font: inherit; font-size: 13.5px; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); height: 40px; max-height: 120px; }
    .asst-form textarea:focus { outline: 2px solid var(--roi-accent); border-color: transparent; }
    .asst-form button { border: none; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 600;
      cursor: pointer; background: linear-gradient(135deg, var(--roi-accent), var(--roi-accent-2)); color: #fff; }
    .asst-form button:disabled { opacity: .5; cursor: default; }

    /* Info icons that tuck a description away (reuse the global .src-info/.src-tip look). */
    .head-info { display: inline-flex; align-items: center; margin-left: 6px; }
    .kpi .label .src-info { margin-left: 5px; }
    /* The toolbar heading sits under the sticky bar, so flip its tooltip to open
       BELOW the icon (and left-align it) — opening upward gets clipped by the bar. */
    #roiNoteInfo .src-tip { top: calc(100% + 8px); bottom: auto; left: 0;
      transform: translateX(-4px) translateY(-4px); }
    #roiNoteInfo .src-info:hover .src-tip, #roiNoteInfo .src-info:focus .src-tip,
    #roiNoteInfo .src-info:focus-visible .src-tip { transform: translateX(-4px) translateY(0); }
    #roiNoteInfo .src-tip::after { top: auto; bottom: 100%; left: 12px; transform: none;
      border-top-color: transparent; border-bottom-color: var(--border); }
  </style>
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>

  <div class="marketing-layout">
    <aside class="subnav" id="marketingNav"></aside>
  <main class="content">

      <strong>ROI — revenue vs spend</strong><span class="head-info" id="roiNoteInfo"></span>

      <span class="muted" style="font-size:13px">Financial year</span>

    <div class="grid">
      <div class="card col-12">
        <div class="card-head"><h3>Revenue vs spend by month</h3><span class="head-info" id="monthInfo" data-info="The payoff over time — spend bars, revenue line"></span><span class="chips" id="monthChips"></span></div>
        <div class="chart-box" id="roi-month-chart"><canvas id="roiMonthCanvas"></canvas></div>
      </div>

      <div class="card col-12">
        <div class="card-head"><h3>Channel Summary</h3><span class="head-info" id="channelInfo" data-info="Marketing spend per calendar month for the selected FY, stacked by category (or by ad platform). Live from Xero, refreshed monthly. Vendors on the ad accounts not yet categorised show as &quot;Uncategorized&quot;."></span>
          <div class="segmented" id="channelDimBar" style="margin-left:6px"><button data-dim="type">By type</button><button data-dim="platform">By platform</button><button data-dim="account">By account</button></div>
          <span class="chips" id="channelChips" style="margin-left:auto"></span>
        </div>
        <div class="chart-box" id="roi-channel-chart" style="height:380px"><canvas id="roiChannelCanvas"></canvas></div>

      <div class="card col-12">
        <div class="card-head"><h3>ROI by financial year</h3><div class="spacer"></div><span class="muted" id="roiFyNote">Click a row to filter the page to that FY.</span><span class="chips" id="fyTableChips"></span></div>
        <div id="roiFyTable"></div>
      </div>

      <div class="card col-12">
        <div class="card-head"><h3>AC pipeline — Won / Open / Lost by month</h3><label class="pipe-toggle" style="font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin-left:10px"><input type="checkbox" id="pipeWonToggle" style="margin:0">Won only</label><span class="chips" id="pipeChips"></span></div>
        <div class="chart-box" id="roi-pipe-chart" style="height:380px"><canvas id="roiPipelineCanvas"></canvas></div>
      </div>

      <!-- <div class="card col-12">
        <div class="card-head"><h3>Where the spend goes</h3><span class="head-info" id="catInfo" data-info="Marketing spend by Xero account (Advertising, Website, Software, Printing, WrkPod Staff) for the selected FY."></span><span class="chips" id="catChips"></span></div>
        <div class="chart-box" id="roi-cat-chart" style="height:360px"><canvas id="roiCatCanvas"></canvas></div>
      </div> -->

      

    </div>
  </main>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=8"></script>
  <script>
    var ROI = null;    // full API payload
    var SEL = null;    // selected fy_end (number) or 'all'
    var PIPE_WON_ONLY = false;   // pipeline chart: show only the Won count per month

    // Each widget on this tab shows ONE small ⓘ info icon (hover/focus to reveal) that
    // carries BOTH its description and its data source — same look as the shared source
    // icon (reuses the global .src-info/.src-tip CSS). infoTip(desc, source) builds it;
    // either part may be empty.
    function infoTip(desc, source) {
      desc = desc || ''; source = source || '';
      if (!desc && !source) return '';
      var tip = desc ? esc(desc) : '';
      if (source) {
        tip += '<span class="src-tip-label"' + (desc ? ' style="margin-top:6px"' : '') +
          '>Source</span>' + esc(source);
      }
      var aria = desc || ('Data source: ' + source);
      return '<span class="src-info" tabindex="0" role="button" aria-label="' + esc(aria) + '">' +
        '<svg class="src-info-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">' +
        '<circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
        '<rect x="7.15" y="6.7" width="1.7" height="5" rx="0.85" fill="currentColor"/>' +
        '<circle cx="8" cy="4.2" r="1.05" fill="currentColor"/></svg>' +
        '<span class="src-tip">' + tip + '</span></span>';
    }

    // The readiness chip (needs setup / partial) WITHOUT the source icon — the source
    // now rides inside the widget's single info icon, so we don't double it up here.
    function statusChipHtml(meta) {
      if (!meta) return '';
      if (meta.status === 'pending') return '<span class="chip warn" title="' + esc(meta.note || '') + '">needs setup</span>';
      if (meta.status === 'partial') return '<span class="chip partial" title="' + esc(meta.note || '') + '">partial</span>';
      return '';
    }

    // Fill the static-description placeholders once (description only; the source is
    // folded in later by setChips when the payload arrives).
    function fillHeadInfo() {
      document.querySelectorAll('.head-info[data-info]').forEach(function (el) {
        el.innerHTML = infoTip(el.getAttribute('data-info'), '');
      });
    }

    // After renderKpis(), collapse each card to a SINGLE info icon next to its label
    // carrying the description (the sub-line) + the data source (pulled out of the
    // bottom chips so the card isn't showing two icons). ROI tab only — renderKpis
    // itself (shared) is untouched.
    function tuckKpiSubs() {
      document.querySelectorAll('#kpis .kpi').forEach(function (card) {
        var sub = card.querySelector(':scope > .muted');
        var desc = sub ? sub.textContent : '';
        if (sub) sub.remove();
        var source = '';
        var srcIcon = card.querySelector('.chips .src-info');
        if (srcIcon) {
          source = (srcIcon.getAttribute('aria-label') || '').replace(/^Data source:\s*/, '');
          srcIcon.remove();           // drop the duplicate source icon
        }
        var label = card.querySelector('.label');
        if (label && !label.querySelector('.src-info') && (desc || source)) {
          label.insertAdjacentHTML('beforeend', infoTip(desc, source));
        }
      });
    }

    // Spend here is MARKETING spend (Xero marketing accounts, ex-GST) — no owner/director wages
    // to subtract, so these are plain pass-throughs (the old "exclude owner wages" toggle is gone).
    function effSpend(row) { return (row && row.hasSpend) ? row.totalSpend : null; }
    function effRoi(row) {
      var s = effSpend(row);
      return (row && row.hasRevenue && s) ? row.revenue / s : null;
    }
    function effMonthSpend(m) { return m.spend; }

    // Charts that carry a description show ONE icon (in the head) with description +
    // source; their chips span then holds only the readiness chip. Charts without a
    // description (pipeline, FY table) keep the plain single source icon via metaChips.
    var CHIP_TO_INFO = { monthChips: 'monthInfo', catChips: 'catInfo', channelChips: 'channelInfo' };
    function setChips(id, meta) {
      var infoId = CHIP_TO_INFO[id];
      if (infoId) {
        var info = document.getElementById(infoId);
        if (info) info.innerHTML = infoTip(info.getAttribute('data-info'), meta && meta.source);
        var el = document.getElementById(id);
        if (el) el.innerHTML = statusChipHtml(meta);
      } else {
        var el2 = document.getElementById(id);
        if (el2) el2.innerHTML = metaChips(meta);
      }
    }

    // The row to show for the current selection ('all' -> the summed total row).
    function currentRow() {
      if (!ROI) return null;
      if (SEL === 'all') return ROI.total;
      return (ROI.rows.data || []).find(function (r) { return r.fyEnd === SEL; }) || ROI.total;
    }

    // Monthly series for the current selection (filtered to the FY, or all months).
    function currentMonths() {
      var all = (ROI.byMonth.data || []);
      if (SEL === 'all') return all.slice();
      return all.filter(function (m) { return m.fyEnd === SEL; });
    }

    function buildFyBar() {
      var bar = document.getElementById('fyBar');
      var rows = ROI.rows.data || [];
      var btns = rows.map(function (r) {
        return '<button data-fy="' + r.fyEnd + '">' + r.fy + '</button>';
      });
      btns.push('<button data-fy="all">All</button>');
      bar.innerHTML = btns.join('');
      bar.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-fy');
          setFy(v === 'all' ? 'all' : Number(v));
        });
      });
    }

    function syncFyBar() {
      document.querySelectorAll('#fyBar button').forEach(function (b) {
        var v = b.getAttribute('data-fy');
        var on = (SEL === 'all' && v === 'all') || (SEL !== 'all' && Number(v) === SEL);
        b.classList.toggle('active', on);
      });
    }

    function setFy(sel) { SEL = sel; syncFyBar(); render(); }

    function render() {
      var row = currentRow();
      var meta = ROI.rows.meta;

      // Cards: Total revenue · Marketing spend · Return on spend · Clients won ·
      //        Cost per client (CAC) · Avg revenue / client
      var spend = effSpend(row);           // marketing spend (Xero marketing accounts, ex-GST)
      var roi = effRoi(row);
      var spendSub = !row.hasSpend ? 'No marketing spend recorded for this FY' :
        'Marketing accounts only (Advertising, Website, Software, Printing, WrkPod), ex-GST';
      // Net ROI % = profit ÷ spend = (return on spend − 1) × 100 (e.g. 1.23× → +23%).
      var netRoi = roi != null ? Math.round((roi - 1) * 100) : null;
      // Per-client economics — guard on having spend/revenue AND at least one won deal.
      var cac = (row.hasSpend && spend != null && row.dealsWon) ? spend / row.dealsWon : null;
      var avgRev = (row.hasRevenue && row.dealsWon) ? row.revenue / row.dealsWon : null;
      renderKpis('kpis', [
        { label: 'Total revenue',
          metric: { value: row.hasRevenue ? row.revenue : null, unit: 'currency', meta: meta },
          sub: row.hasRevenue ? 'Xero P&L total income (whole business)' : 'No revenue recorded for this FY' },
        { label: 'Marketing spend',
          metric: { value: row.hasSpend ? spend : null, unit: 'currency' },
          sub: spendSub },
        { label: 'Return on spend',
          metric: { value: roi != null ? roi.toFixed(2) + '×' : null, unit: 'text' },
          sub: roi != null ? 'Revenue ÷ marketing spend' : null },
        { label: 'Net ROI',
          metric: { value: netRoi != null ? (netRoi > 0 ? '+' : '') + netRoi + '%' : null, unit: 'text' },
          sub: netRoi != null ? '(Return on spend − 1)' : null },
        { label: 'Clients won',
          metric: { value: row.dealsWon, unit: 'count' },
          sub: row.dealsOpen + ' open · ' + row.dealsLost + ' lost' },
        { label: 'Cost per client (CAC)',
          metric: { value: cac, unit: 'currency' },
          sub: cac != null ? 'Marketing spend ÷ clients won' : null },
        { label: 'Avg revenue / client',
          metric: { value: avgRev, unit: 'currency' },
          sub: avgRev != null ? 'Revenue ÷ clients won' : null },
      ]);
      tuckKpiSubs();   // hide each card's description behind an ⓘ next to its label

      // Revenue vs spend by month — spend as green bars (left $ axis), revenue as a
      // blue line (right $ axis). Dual axis so spend reads clearly against much larger revenue.
      setChips('monthChips', ROI.byMonth.meta);
      renderMonthChart();

      // AC pipeline — Won / Open / Lost by month, filtered to the selection.
      setChips('pipeChips', (ROI.pipelineMonths || ROI.pipelines).meta);
      renderPipeline();

      // Where the spend goes — top expense categories + Other for the selection.
      setChips('catChips', ROI.categories.meta);
      renderCategories();

      // Channel Summary — monthly stacked spend, filtered to the active FY's months.
      renderChannelChart();

      // ROI by FY table — the full per-FY list plus an "All years" total row, each row
      // clickable to filter the whole page to that FY (mirrors the ROAS "ROAS by FY" table).
      setChips('fyTableChips', meta);
      var fyRows = (ROI.rows.data || []).concat(ROI.total ? [ROI.total] : []);
      renderTable('roiFyTable', fyRows, [
        { key: 'fy', label: 'FY',
          render: function (v, r) { return r.fyEnd == null ? '<strong>All years</strong>' : esc(v); } },
        { key: 'revenue', label: 'Revenue (Xero)', unit: 'currency',
          render: function (v, r) { return r.hasRevenue ? fmt(v, 'currency') : '<span class="muted">—</span>'; } },
        { key: 'totalSpend', label: 'Total spend', unit: 'currency',
          render: function (v, r) { return r.hasSpend ? fmt(effSpend(r), 'currency') : '<span class="muted">—</span>'; } },
        { key: 'dealsWon', label: 'Deals won', unit: 'count' },
        { key: 'dealsOpen', label: 'Open', unit: 'count' },
        { key: 'dealsLost', label: 'Lost', unit: 'count' },
        { key: 'roi', label: 'ROI', unit: 'text',
          render: function (v, r) { var x = effRoi(r); return x != null ? x.toFixed(2) + '×' : '<span class="muted">—</span>'; } },
      ]);
      // Make each row clickable → select that FY ('all' for the total row), with the
      // active selection highlighted.
      var fyTb = document.querySelector('#roiFyTable tbody');
      if (fyTb) {
        var trs = fyTb.querySelectorAll('tr');
        fyRows.forEach(function (r, i) {
          var tr = trs[i];
          if (!tr) return;
          var isTotal = r.fyEnd == null;
          tr.classList.add('clickrow');
          if (isTotal) tr.classList.add('total');
          var selected = isTotal ? (SEL === 'all') : (SEL !== 'all' && r.fyEnd === SEL);
          if (selected) tr.classList.add('rowsel');
          tr.addEventListener('click', function () { setFy(isTotal ? 'all' : r.fyEnd); });
        });
      }
    }

    // Revenue vs spend by month — combo chart: green spend bars on the left $ axis,
    // blue revenue line on the right $ axis (dual axis).
    var _monthChart = null;
    function compactAud(v) {
      var n = Math.abs(v);
      if (n >= 1e6) return '$' + (v / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'm';
      if (n >= 1e3) return '$' + (v / 1e3).toFixed(n % 1e3 ? 1 : 0) + 'k';
      return '$' + Math.round(v);
    }

    // X-axis labels: the full calendar-month span "Mon 1-<last day>" (e.g. Jul 1-31,
    // Feb 1-28) — each bar covers the 1st to the last day of that month.
    var MON_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function monthSpanLabel(year, m1) {          // m1 = 1..12
      var last = new Date(Date.UTC(year, m1, 0)).getUTCDate();   // day 0 of next month = last day
      return MON_ABBR[m1 - 1] + ' 1-' + last;
    }
    function ymSpanLabel(ym) {                    // 'YYYY-MM'
      var p = String(ym).split('-');
      return monthSpanLabel(+p[0], +p[1]);
    }
    function channelSpanLabel(label) {           // 'Mon-YYYY'
      var p = String(label).split('-'), m = MON_IDX[p[0]];
      return m ? monthSpanLabel(+p[1], m) : label;
    }

    function renderMonthChart() {
      var months = currentMonths();
      var tc = themeColors();
      var cfg = {
        type: 'bar',
        data: {
          labels: months.map(function (m) { return ymSpanLabel(m.month); }),
          datasets: [
            { type: 'bar', label: 'Marketing spend', order: 2, yAxisID: 'ySpend',
              data: months.map(function (m) { return effMonthSpend(m); }),
              backgroundColor: '#17a673', borderRadius: 4, maxBarThickness: 34 },
            { type: 'line', label: 'Revenue', order: 1, yAxisID: 'yRevenue',
              data: months.map(function (m) { return m.revenue; }),
              borderColor: '#3b6ef0', backgroundColor: '#3b6ef0', tension: 0.3,
              pointRadius: 3, pointHoverRadius: 5, borderWidth: 2 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: true, position: 'top', labels: { color: tc.text, usePointStyle: true, boxWidth: 8, padding: 12 } },
            tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + fmt(ctx.parsed.y, 'currency'); } } },
          },
          scales: {
            x: { ticks: { color: tc.muted }, grid: { display: false } },
            ySpend: { position: 'left', beginAtZero: true,
              ticks: { color: tc.muted, callback: compactAud }, grid: { color: tc.grid } },
            yRevenue: { position: 'right', beginAtZero: true,
              ticks: { color: '#3b6ef0', callback: compactAud }, grid: { drawOnChartArea: false } },
          },
        },
      };
      if (_monthChart) _monthChart.destroy();
      var el = document.getElementById('roiMonthCanvas');
      if (el) _monthChart = new Chart(el.getContext('2d'), cfg);
    }

    // AC pipeline chart — deal counts BY MONTH (x axis), vertical stacked bars of
    // Won/Open/Lost, filtered to the active FY (same monthly design as Channel Summary).
    // The "Won only" toggle drops Open/Lost. 'All' shows every month.
    var _pipeChart = null;
    function renderPipeline() {
      var all = (ROI.pipelineMonths && ROI.pipelineMonths.data) || [];
      var rows = (SEL != null && SEL !== 'all')
        ? all.filter(function (m) { return m.fyEnd === SEL; })
        : all.slice();

      var datasets = PIPE_WON_ONLY
        ? [{ label: 'Won', data: rows.map(function (r) { return r.won; }), backgroundColor: '#17a673', borderRadius: 3, maxBarThickness: 40, stack: 'deals' }]
        : [
            { label: 'Won',  data: rows.map(function (r) { return r.won; }),  backgroundColor: '#17a673', borderRadius: 3, maxBarThickness: 40, stack: 'deals' },
            { label: 'Open', data: rows.map(function (r) { return r.open; }), backgroundColor: '#3b6ef0', borderRadius: 3, maxBarThickness: 40, stack: 'deals' },
            { label: 'Lost', data: rows.map(function (r) { return r.lost; }), backgroundColor: '#e2483d', borderRadius: 3, maxBarThickness: 40, stack: 'deals' },
          ];

      var tc = themeColors();
      var cfg = {
        type: 'bar',
        data: {
          labels: rows.map(function (r) { return ymSpanLabel(r.month); }),
          datasets: datasets,
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: true, position: 'top', labels: { color: tc.text, usePointStyle: true, boxWidth: 8, padding: 12 } },
            tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + ctx.parsed.y; } } },
          },
          scales: {
            x: { stacked: true, ticks: { color: tc.muted }, grid: { display: false } },
            y: { stacked: true, beginAtZero: true, ticks: { color: tc.muted, precision: 0 }, grid: { color: tc.grid } },
          },
        },
      };
      if (_pipeChart) _pipeChart.destroy();
      var el = document.getElementById('roiPipelineCanvas');
      if (el) _pipeChart = new Chart(el.getContext('2d'), cfg);
    }

    // Channel Summary — marketing spend BY MONTH (x axis), stacked by each Type
    // category or each ad Platform (toggle), FILTERED to the active FY's calendar months
    // (1st–last day of each month in that FY; 'All' shows every month).
    // LIVE from Xero via /api/marketing/channel-summary
    // (public.marketing_channel_monthly × marketing_channel_vendor_map, refreshed monthly
    // by the xero-channel-summary-sync edge function). The Type stack covers ALL kept
    // spend (unmapped vendors on the ad accounts roll up as "Uncategorized"); the Platform
    // stack covers only the ad platforms (Google/Bing/Website/LinkedIn/Meta).
    var CHANNEL_MONTHLY = { months: [], type: [], platform: [], account: [] };
    var CHANNEL_DIM = 'type';   // 'type' | 'platform' | 'account'
    var CHANNEL_PALETTE = ['#3b6ef0','#17a673','#f0a63b','#7c5cff','#e2483d','#14b8c4','#9aa4b2','#e879a6'];
    var _channelChart = null;

    // Month label ('Jul-2025') → Australian FY-end year (Jul–Jun, END-year), so the chart
    // can be filtered to the active FY. e.g. Jul-2025..Jun-2026 → 2026.
    var MON_IDX = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };
    function channelMonthFyEnd(label) {
      var parts = String(label).split('-');
      var m = MON_IDX[parts[0]], y = Number(parts[1]);
      if (!m || !y) return null;
      return m >= 7 ? y + 1 : y;
    }

    function loadChannelSummary() {
      fetchJSON('/api/marketing/channel-summary')
        .then(function (data) {
          CHANNEL_MONTHLY = { months: data.months || [], type: data.type || [], platform: data.platform || [], account: data.account || [] };
          setChips('channelChips', data.meta);
          setChannelDim(CHANNEL_DIM);
        })
        .catch(function (err) { console.error('channel-summary', err); });
    }

    function renderChannelChart() {
      var allMonths = CHANNEL_MONTHLY.months || [];
      var src = CHANNEL_MONTHLY[CHANNEL_DIM] || [];
      var tc = themeColors();

      // Restrict to the active FY's calendar months (1st–last day of each month in that
      // FY); 'all' (or no selection yet) shows every month. Each series is re-indexed to
      // the kept months, and series that are all-zero within the FY are dropped so the
      // legend stays clean.
      var idxs = allMonths.map(function (_, i) { return i; });
      if (SEL != null && SEL !== 'all') {
        idxs = idxs.filter(function (i) { return channelMonthFyEnd(allMonths[i]) === SEL; });
      }
      var months = idxs.map(function (i) { return channelSpanLabel(allMonths[i]); });
      // Colour by each series' stable position in src so a given category/platform keeps
      // its colour no matter which FY is selected.
      var datasets = src.map(function (s, i) {
        var data = idxs.map(function (j) { return s.data[j] || 0; });
        return { label: s.name, data: data, stack: 'spend',
          backgroundColor: CHANNEL_PALETTE[i % CHANNEL_PALETTE.length], borderRadius: 3, maxBarThickness: 40 };
      }).filter(function (d) { return d.data.some(function (v) { return v; }); });

      var cfg = {
        type: 'bar',
        data: { labels: months, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: true, position: 'top', labels: { color: tc.text, usePointStyle: true, boxWidth: 8, padding: 12 } },
            tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + fmt(ctx.parsed.y, 'currency'); } } },
          },
          scales: {
            x: { stacked: true, ticks: { color: tc.muted }, grid: { display: false } },
            y: { stacked: true, beginAtZero: true, ticks: { color: tc.muted, callback: compactAud }, grid: { color: tc.grid } },
          },
        },
      };
      if (_channelChart) _channelChart.destroy();
      var el = document.getElementById('roiChannelCanvas');
      if (el) _channelChart = new Chart(el.getContext('2d'), cfg);
    }

    function setChannelDim(dim) {
      CHANNEL_DIM = dim;
      document.querySelectorAll('#channelDimBar button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-dim') === dim);
      });
      renderChannelChart();
    }

    var _catChart = null;
    var CAT_TOP_N = 8;
    function renderCategories() {
      var row = currentRow();
      var src = (ROI.categories && ROI.categories.data) || [];
      // Gather the category rows for the selection.
      var rows;
      if (SEL === 'all') {
        // Sum each account across all FYs.
        var byAcct = {};
        src.forEach(function (c) {
          if (!byAcct[c.account]) byAcct[c.account] = { account: c.account, amount: 0 };
          byAcct[c.account].amount += c.amount;
        });
        rows = Object.keys(byAcct).map(function (k) { return byAcct[k]; });
      } else {
        rows = src.filter(function (c) { return c.fyEnd === SEL; })
                  .map(function (c) { return { account: c.account, amount: c.amount }; });
      }
      rows.sort(function (a, b) { return b.amount - a.amount; });

      // If there's no spend data for this FY (FY22/FY23), clear the chart.
      var hasData = row && row.hasSpend && rows.length;
      if (!hasData) { if (_catChart) { _catChart.destroy(); _catChart = null; } return; }

      // Top N + "Other" reconciled to the authoritative total spend on the page.
      var top = rows.slice(0, CAT_TOP_N);
      var authTotal = effSpend(row); // marketing spend total for the FY (reconciles with the accounts)
      var shownSum = top.reduce(function (a, r) { return a + r.amount; }, 0);
      var other = Math.max(0, Math.round(authTotal - shownSum));
      var labels = top.map(function (r) { return r.account; });
      var data = top.map(function (r) { return r.amount; });
      if (other > 0) { labels.push('Other'); data.push(other); }

      var tc = themeColors();
      var cfg = {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Spend',
            data: data,
            backgroundColor: labels.map(function (l) { return l === 'Other' ? '#9aa4b2' : '#17a673'; }),
            borderRadius: 4, maxBarThickness: 26,
          }],
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: function (ctx) { return fmt(ctx.parsed.x, 'currency'); } } },
          },
          scales: {
            x: { beginAtZero: true, ticks: { color: tc.muted, callback: compactAud }, grid: { color: tc.grid } },
            y: { ticks: { color: tc.muted }, grid: { display: false } },
          },
        },
      };
      if (_catChart) _catChart.destroy();
      var el = document.getElementById('roiCatCanvas');
      if (el) _catChart = new Chart(el.getContext('2d'), cfg);
    }

    function loadRoi() {
      fetchJSON('/api/marketing/roi')
        .then(function (data) {
          ROI = data;
          document.getElementById('roiNoteInfo').innerHTML =
            infoTip((data.rows.meta && data.rows.meta.note) || '',
                    data.rows.meta && data.rows.meta.source);
          if (!data.rows.data || !data.rows.data.length) {
            // Pending / empty — show source chips + a needs-setup note, no charts.
            setChips('monthChips', data.rows.meta);
            setChips('pipeChips', data.rows.meta);
            setChips('catChips', data.rows.meta);
            renderKpis('kpis', [
              { label: 'Total revenue', metric: { value: null, unit: 'currency', meta: data.rows.meta } },
              { label: 'Marketing spend', metric: { value: null, unit: 'currency', meta: data.rows.meta } },
              { label: 'Return on spend', metric: { value: null, unit: 'text', meta: data.rows.meta } },
              { label: 'Net ROI', metric: { value: null, unit: 'text', meta: data.rows.meta } },
              { label: 'Clients won', metric: { value: null, unit: 'count', meta: data.rows.meta } },
              { label: 'Cost per client (CAC)', metric: { value: null, unit: 'currency', meta: data.rows.meta } },
              { label: 'Avg revenue / client', metric: { value: null, unit: 'currency', meta: data.rows.meta } },
            ]);
            tuckKpiSubs();
            return;
          }
          SEL = data.defaultFy != null ? data.defaultFy : 'all';
          buildFyBar();
          syncFyBar();
          render();
        })
        .catch(function (err) { console.error(err); });
    }

    initPage('marketing');               // login / top bar / theme only (no auto-fetch)
    renderMarketingSidebar('roi');
    fillHeadInfo();                      // tuck the static chart descriptions behind ⓘ icons
    document.getElementById('pipeWonToggle').addEventListener('change', function () {
      PIPE_WON_ONLY = this.checked;
      if (ROI) renderPipeline();
    });
    document.querySelectorAll('#channelDimBar button').forEach(function (b) {
      b.addEventListener('click', function () { setChannelDim(b.getAttribute('data-dim')); });
    });
    window.onThemeChange = function () { if (ROI) render(); renderChannelChart(); };
    if (currentUser()) { loadRoi(); loadChannelSummary(); }
  </script>

  <!-- ROI read-only chat assistant (bottom-right). Answers from the ROI tab data
       via /api/roi-assistant; the model has no write access (context-stuffed only).
       Mirrors the ROAS assistant on roas.html. -->
  <button id="asstLauncher" type="button" aria-label="Ask about this data" hidden>💬 Ask about this data</button>
  <section id="asstPanel" aria-live="polite" hidden>
    <div class="asst-head">
      <div>
        <div class="t">ROI assistant</div>
        <div class="s">Read-only · answers from this tab's data</div>
      </div>
      <button class="x" id="asstClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="asst-msgs" id="asstMsgs"></div>
    <form class="asst-form" id="asstForm">
      <textarea id="asstInput" rows="1" placeholder="Ask about revenue, spend, ROI, clients…" autocomplete="off"></textarea>
      <button type="submit" id="asstSend">Send</button>
    </form>
  </section>
  <script>
    (function () {
      if (!currentUser()) return; // page bounces to login anyway, but don't mount for guests
      var launcher = document.getElementById('asstLauncher');
      var panel = document.getElementById('asstPanel');
      var msgsEl = document.getElementById('asstMsgs');
      var form = document.getElementById('asstForm');
      var input = document.getElementById('asstInput');
      var sendBtn = document.getElementById('asstSend');
      var history = [];      // [{role:'user'|'assistant', content}]
      var busy = false;
      var greeted = false;

      launcher.hidden = false;

      function bubble(text, cls) {
        var d = document.createElement('div');
        d.className = 'asst-msg ' + cls;
        d.textContent = text;
        msgsEl.appendChild(d);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return d;
      }
      function hint(text) {
        var d = document.createElement('div');
        d.className = 'asst-hint';
        d.textContent = text;
        msgsEl.appendChild(d);
      }
      function openPanel() {
        panel.classList.add('open'); panel.hidden = false; launcher.hidden = true;
        if (!greeted) {
          greeted = true;
          hint('Ask me about the ROI figures on this tab — e.g. “Which FY had the best return on marketing spend?”, “What was revenue vs marketing spend in FY26?”, or “Which marketing account costs the most?”. I’m read-only.');
        }
        setTimeout(function () { input.focus(); }, 50);
      }
      function closePanel() { panel.classList.remove('open'); panel.hidden = true; launcher.hidden = false; }

      launcher.addEventListener('click', openPanel);
      document.getElementById('asstClose').addEventListener('click', closePanel);

      function setBusy(v) {
        busy = v; sendBtn.disabled = v; input.disabled = v;
        sendBtn.textContent = v ? '…' : 'Send';
      }

      function send() {
        if (busy) return;
        var q = input.value.trim();
        if (!q) return;
        input.value = ''; input.style.height = '40px';
        bubble(q, 'user');
        history.push({ role: 'user', content: q });
        setBusy(true);
        var thinking = bubble('Thinking…', 'bot');
        postJSON('/api/roi-assistant', { messages: history })
          .then(function (resp) {
            thinking.remove();
            var ans = (resp && resp.answer) || 'No answer.';
            bubble(ans, 'bot');
            history.push({ role: 'assistant', content: ans });
          })
          .catch(function (err) {
            thinking.remove();
            bubble(err.message || 'Something went wrong.', 'err');
            history.pop(); // drop the unanswered user turn so retry stays clean
          })
          .finally(function () { setBusy(false); input.focus(); });
      }

      form.addEventListener('submit', function (e) { e.preventDefault(); send(); });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
      input.addEventListener('input', function () {
        input.style.height = '40px';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      });
    })();
  </script>
</body>
</html>
