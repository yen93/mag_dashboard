<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spend &amp; ROI — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Spend & ROI — bespoke visual layer, following DESIGN_GUIDE.md
       (ROAS / Overview / Leads & Bookings as reference). LIVE data.
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
    }

    /* Full-width layout (match Overview / Leads & Bookings) */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards + card heads */
    .card { border-radius: 16px; box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease; }
    .card-head h3 {
      font-size: 15px; font-weight: 700; letter-spacing: -.01em;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .card-head h3::before {
      content: ""; width: 4px; height: 17px; border-radius: 3px; flex: none;
      background: linear-gradient(var(--mkt-accent), var(--mkt-accent-2));
    }

    /* Controls bar + segmented toggle (DESIGN_GUIDE §4) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* KPI tiles — identical look to marketing.html (shared .kpi class + its §5 styling,
       so the cards inherit app.css's .kpi surface/border/padding base). */
    .kpi-grid { gap: 14px; margin: 18px 0 8px; grid-template-columns: repeat(auto-fit, minmax(192px, 1fr)); }
    /* NB: NOT overflow:hidden (§6) — would clip the KPI label's infoTip tooltip. */
    .kpi {
      position: relative; border-radius: 16px; padding: 18px 18px 16px;
      box-shadow: var(--mkt-shadow);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .kpi::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--mkt-accent), var(--mkt-accent-2));
      opacity: 0; transition: opacity .2s ease;
    }
    .kpi:hover { transform: translateY(-3px); box-shadow: var(--mkt-shadow-lift); }
    .kpi:hover::after { opacity: .9; }
    .kpi:hover, .kpi:focus-within { z-index: 2; }   /* keep ⓘ tooltip above neighbours */
    .kpi .label { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .kpi .value { font-size: 29px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 11px 0 6px; }
    .kpi .sub { font-size: 12px; color: var(--text-muted); }
    /* Emphasise the first tile (Marketing spend headline). */
    .kpi-grid .kpi:first-child {
      background: linear-gradient(140deg, color-mix(in srgb, var(--mkt-accent) 13%, var(--surface)), var(--surface) 70%);
      border-color: color-mix(in srgb, var(--mkt-accent) 32%, var(--border));
    }
    .kpi-grid .kpi:first-child .value { color: var(--mkt-accent); }

    .delta { font-size: 12px; font-weight: 600; }
    .delta.pos { color: var(--pos); }
    .delta.neg { color: var(--neg); }
    .delta.muted { color: var(--text-muted); }

    /* Lower section: Spend by type (left) + Channel results (right) */
    .sr-lower { display: grid; grid-template-columns: minmax(260px, .82fr) 1.7fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .sr-lower { grid-template-columns: 1fr; } }

    /* Channel results table */
    .sr-table-wrap { overflow-x: auto; }
    table.sr-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
    table.sr-table th, table.sr-table td { padding: 11px 12px; text-align: right; white-space: nowrap; }
    table.sr-table th:first-child, table.sr-table td:first-child { text-align: left; }
    table.sr-table thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    table.sr-table tbody td { border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    table.sr-table tbody tr:last-child td { border-bottom: none; }
    table.sr-table tbody td:first-child { font-weight: 600; }
    table.sr-table .ch-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; vertical-align: baseline; }

    /* Spend-by-type drill-down modal */
    .items-backdrop { display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(10, 14, 22, .55); align-items: center; justify-content: center; padding: 20px; }
    .items-modal { width: 100%; max-width: 440px; max-height: 80vh; display: flex; flex-direction: column;
      background: var(--surface, #fff); color: var(--text, #111); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; }
    .items-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
    .items-modal-head h3 { margin: 0; font-size: 16px; }
    .items-close { background: none; border: none; font-size: 24px; line-height: 1; cursor: pointer;
      color: var(--text-muted); padding: 0 2px; }
    .items-close:hover { color: var(--text); }
    .items-modal-body { padding: 12px 18px 18px; overflow-y: auto; }
    .items-count { font-size: 12px; margin-bottom: 8px; }
    ol.items-list { margin: 0; padding-left: 22px; }
    ol.items-list li { padding: 4px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
    ol.items-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
    <a class="tab" href="builds_monitoring.html">AI &amp; Automation</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar (same FY toggle + placement as marketing.html) -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
          <div class="spacer" style="flex:1"></div>
          <span class="muted" style="font-size:13px">Australian FY (Jul–Jun)</span>
        </div>
      </div>

      <!-- KPI cards -->
      <div class="kpi-grid" id="kpis"></div>

      <!-- Spend by type (left) + Channel results (right) -->
      <div class="sr-lower">
        <div class="card">
          <div class="card-head" style="display:block;margin-bottom:10px">
            <h3>Spend by type <span class="head-info"
              data-info="Marketing spend for the selected FY broken down by spend type (Wages, Digital Ads, Agency, Software, Tools, Printed Collaterals), summed over the FY's calendar months."
              data-src="GET /api/marketing/channel-summary (type series) ← public.marketing_channel_monthly, live from Xero"></span></h3>
          </div>
          <div class="chart-box" id="spendBox" style="height:320px"><canvas id="spendCanvas"></canvas></div>
        </div>

        <div class="card">
          <div class="card-head" style="display:block;margin-bottom:10px">
            <h3>Channel results <span class="head-info"
              data-info="Per-channel spend, enquiries, bookings, revenue and ROAS by financial year. Paid Ads (Google + Bing, excluding agency fees) is fully tracked; Offsite (Executive X) shows bookings + revenue, spend from the Xero 'MAG program delivery expenses' account (code 376) — a shared all-programs account, so it overcounts Exec X and its ROAS reads low — and enquiries = companies listed per season in the Exec X ROI sheet (by session FY); Bureau and Tailor show enquiries, bookings and won revenue (Spend, Cost / enquiry and ROAS total are N/A); Marketing EDM is 0 across all columns (pending tracking process)."
              data-src="GET /api/marketing/channel-results — Paid Ads via the ROAS metric (Google + Bing spend); Executive X bookings+revenue via public.exec_x_revenue, spend via the Xero 'MAG program delivery expenses' account (code 376) in xero_pnl_accounts_fy, enquiries = companies listed per season in the Exec X ROI sheet (static); Bureau/Tailor via the leads-by-source metric (ac_indirect_deals)"></span></h3>
          </div>
          <div class="sr-table-wrap">
            <table class="sr-table">
              <thead>
                <tr>
                  <th>Channel</th><th>Spend</th><th>Enquiries</th><th>Cost / enquiry</th>
                  <th>Bookings</th><th>Revenue</th><th>ROAS total</th>
                </tr>
              </thead>
              <tbody id="channelBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Spend-by-type drill-down modal: items under a clicked type (names only) -->
  <div id="itemsBackdrop" class="items-backdrop" onclick="if(event.target===this)closeTypeItems()">
    <div class="items-modal" role="dialog" aria-modal="true" aria-labelledby="itemsTitle">
      <div class="items-modal-head">
        <div>
          <h3 id="itemsTitle">Type</h3>
          <div id="itemsSub" class="muted" style="font-size:12px;margin-top:2px"></div>
        </div>
        <button type="button" class="items-close" aria-label="Close" onclick="closeTypeItems()">&times;</button>
      </div>
      <div id="itemsBody" class="items-modal-body"></div>
    </div>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=14"></script>
  <script>
    /* Spend & ROI — LIVE.
       • 5 KPI cards        ← GET /api/marketing/roi (same source as roi.html) +
                              GET /api/marketing/overview (enquiry count, for Cost per enquiry)
       • "Spend by type"    ← GET /api/marketing/channel-summary (the `type` series — the SAME
                              buckets as roi.html's Channel Summary "By type"), summed over the FY
       • "Channel results"  ← GET /api/marketing/channel-results (Paid Ads Google/Bing from the
                              ROAS metric; Executive X bookings+revenue from exec_x_revenue, spend
                              from the Xero "MAG program delivery expenses" account (code 376) in
                              xero_pnl_accounts_fy — a shared all-programs account, overcounts Exec X —
                              and enquiries = companies listed per season in the Exec X ROI sheet)
       All FY-aware via the #fySeg toggle (AU FY, END-year). */

    // ----- FY helpers (mirror marketing.html / leads_bookings.html) -----
    function selFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }
    function fyEndOf(key) { return key === 'all' ? null : 2000 + parseInt(key.slice(2), 10); }
    function fyName(key) { return key === 'all' ? 'All years' : key.toUpperCase(); }
    // A column with no known data source for a channel comes back as the string 'pending'
    // and renders as the DESIGN_GUIDE §8 chip; 'N/A' renders as "N/A"; null is a genuine missing value → "—".
    var PENDING = 'pending';
    var NA = 'N/A';
    function pendChip() { return '<span class="chip warn">pending</span>'; }
    function naCell() { return '<span class="muted">N/A</span>'; }
    function fmtCur(v) {
      if (v === PENDING) return pendChip();
      if (v === NA) return naCell();
      return (v == null) ? '<span class="muted">—</span>' : fmt(v, 'currency');
    }

    // ===================================================================
    //  State
    // ===================================================================
    var ROI = { rows: [], total: null, loaded: false, byMonth: [], pipelineMonths: [] }; // /api/marketing/roi
    var OV  = { byFy: {}, total: null, loaded: false, range: null };  // /api/marketing/overview (enquiries)
    var CH  = { months: [], type: [], loaded: false };           // /api/marketing/channel-summary
    var CR  = { rows: [], total: null, loaded: false };          // /api/marketing/channel-results
    var CI  = { items: [], loaded: false };                      // /api/marketing/channel-items (bar drill-down)

    // Custom date range (beside the FY toggle). When active it overrides the FY toggle:
    // the KPI cards + Spend-by-type aggregate the already-loaded MONTHLY series within the
    // range (month-level); the Channel results table is FY-snapshot only and is greyed.
    var CUSTOM = false;
    function monthInRange(ym) {
      var r = getDateRange();
      var fm = r.from ? r.from.slice(0, 7) : '', tm = r.to ? r.to.slice(0, 7) : '';
      return (!fm || ym >= fm) && (!tm || ym <= tm);
    }

    function roiRowFor(key) {
      if (!ROI.loaded) return null;
      if (CUSTOM) {   // synthesize a per-range row from the monthly series (month-level)
        var ms = (ROI.byMonth || []).filter(function (m) { return monthInRange(m.month); });
        var pm = (ROI.pipelineMonths || []).filter(function (m) { return monthInRange(m.month); });
        var sum = function (arr, f) { return arr.reduce(function (a, m) { return a + (f(m) || 0); }, 0); };
        return {
          totalSpend: sum(ms, function (m) { return m.spend; }),
          hasSpend: ms.length > 0,
          marketingRevenue: sum(ms, function (m) { return m.marketingRevenue; }),
          dealsWon: sum(pm, function (m) { return m.won; }),
        };
      }
      if (key === 'all') return ROI.total;
      var fe = fyEndOf(key);
      return ROI.rows.find(function (r) { return r.fyEnd === fe; }) || null;
    }
    function enqObj(key) {
      if (CUSTOM) return OV.range;
      return key === 'all' ? OV.total : OV.byFy[fyEndOf(key)];
    }
    function enqCount(key) { var o = enqObj(key); return o ? o.total : null; }

    // ===================================================================
    //  KPI cards
    // ===================================================================
    function deltaHtml(cur, prev, mode, prevFyEnd) {
      if (cur == null || prev == null || !mode) return '';
      var d = cur - prev, r = Math.round(d);
      var prevLabel = 'FY' + String(prevFyEnd).slice(-2);
      if (r === 0) return '<div class="delta muted">■ no change vs ' + prevLabel + '</div>';
      var good = mode === 'neutral' ? null : (mode === 'down-good' ? d < 0 : d > 0);
      var cls = good == null ? 'muted' : (good ? 'pos' : 'neg');
      var arrow = d > 0 ? '▲' : '▼';
      return '<div class="delta ' + cls + '">' + arrow + ' ' + fmt(Math.abs(d), 'currency') + ' vs ' + prevLabel + '</div>';
    }

    // ONE info tool per card (DESIGN_GUIDE §6): the ⓘ carries WHAT the tile is (desc)
    // and WHERE it comes from (source); never printed in the card body.
    function kpiCard(label, desc, source, valueStr, extraHtml) {
      return '<div class="kpi"><div class="label">' + esc(label) +
        '<span class="head-info">' + infoTip(desc, source) + '</span></div>' +
        '<div class="value">' + valueStr + '</div>' + (extraHtml || '') + '</div>';
    }

    function renderCards() {
      var box = document.getElementById('kpis');
      if (!box) return;
      if (!ROI.loaded) {
        box.innerHTML = kpiCard('Marketing revenue', '', '', '…') + kpiCard('Marketing spend', '', '', '…') +
          kpiCard('Net return', '', '', '…') + kpiCard('Marketing ROI', '', '', '…') +
          kpiCard('Marketing CAC', '', '', '…') + kpiCard('Cost per enquiry', '', '', '…');
        return;
      }
      var key = selFyKey();
      var row = roiRowFor(key);
      var prevKey = (CUSTOM || key === 'all') ? null : 'fy' + String(fyEndOf(key) - 1).slice(-2);
      var prevRow = prevKey ? roiRowFor(prevKey) : null;
      var prevFyEnd = prevKey ? fyEndOf(prevKey) : null;

      var spend = (row && row.hasSpend) ? row.totalSpend : null;
      var mRev = row ? row.marketingRevenue : null;
      var dealsWon = row ? row.dealsWon : null;
      var enq = enqCount(key);

      var netReturn = (mRev != null && spend != null) ? mRev - spend : null;
      var ros = (mRev != null && spend) ? mRev / spend : null;                 // return on spend (×)
      var marketingRoi = (ros != null) ? Math.round((ros - 1) * 100) : null;   // net ROI %  (roi.html "Net ROI")
      var cac = (spend != null && dealsWon) ? spend / dealsWon : null;
      var costPerEnq = (spend != null && enq) ? spend / enq : null;

      // Prior-FY values for deltas
      var pSpend = (prevRow && prevRow.hasSpend) ? prevRow.totalSpend : null;
      var pMRev = prevRow ? prevRow.marketingRevenue : null;
      var pNetReturn = (pMRev != null && pSpend != null) ? pMRev - pSpend : null;
      var pEnq = prevKey ? enqCount(prevKey) : null;
      var pCostPerEnq = (pSpend != null && pEnq) ? pSpend / pEnq : null;

      var html = '';
      // 1 — Marketing revenue (highlighted first card)
      html += kpiCard('Marketing revenue',
        'Marketing-attributed won revenue for the selected FY — ROAS-paid + organic + bureau/tailor + Exec X (deduped). Same figure as the ROI tab’s "Marketing revenue".',
        'GET /api/marketing/roi (row.marketingRevenue)',
        fmtCur(mRev),
        deltaHtml(mRev, pMRev, 'up-good', prevFyEnd));
      // 2 — Marketing spend
      html += kpiCard('Marketing spend',
        'Total marketing spend for the selected FY — Xero marketing accounts only (Advertising, Website, Software, Printing, WrkPod), ex-GST. Same figure as the ROI tab.',
        'GET /api/marketing/roi (row.totalSpend) ← public.marketing_channel_monthly, live from Xero',
        fmtCur(spend),
        deltaHtml(spend, pSpend, 'neutral', prevFyEnd));
      // 3 — Net return (marketing revenue − marketing spend)
      html += kpiCard('Net return',
        'Marketing-attributed won revenue minus marketing spend. Revenue = ROAS-paid + organic + bureau/tailor + Exec X (deduped), same as the ROI tab.',
        'GET /api/marketing/roi (marketingRevenue − totalSpend)',
        fmtCur(netReturn),
        deltaHtml(netReturn, pNetReturn, 'up-good', prevFyEnd));
      // 4 — Marketing ROI (net ROI %)
      html += kpiCard('Marketing ROI',
        'Net return on marketing spend = (marketing revenue ÷ marketing spend − 1). Same definition as the ROI tab’s "Net ROI".',
        'GET /api/marketing/roi (marketingRevenue ÷ totalSpend − 1)',
        (marketingRoi != null ? (marketingRoi > 0 ? '+' : '') + marketingRoi + '%' : '<span class="muted">—</span>'),
        ros != null ? '<div class="sub">Return on spend ' + ros.toFixed(2) + '×</div>' : '');
      // 5 — Marketing CAC
      html += kpiCard('Marketing CAC',
        'Cost to acquire a client = marketing spend ÷ clients won (all AC deals won this FY). Same as the ROI tab’s "Cost per client".',
        'GET /api/marketing/roi (totalSpend ÷ dealsWon)',
        fmtCur(cac),
        (dealsWon ? '<div class="sub">Marketing spend ÷ ' + dealsWon + ' clients won</div>'
                  : (spend != null ? '<div class="sub">No clients won this FY</div>' : '')));
      // 6 — Cost per enquiry
      html += kpiCard('Cost per enquiry',
        'Marketing spend ÷ enquiries (deals/leads created this FY across paid + organic + indirect — same count as the Overview).',
        'GET /api/marketing/roi (totalSpend) ÷ GET /api/marketing/overview (enquiries.total)',
        fmtCur(costPerEnq),
        deltaHtml(costPerEnq, pCostPerEnq, 'down-good', prevFyEnd));

      box.innerHTML = html;
    }

    // ===================================================================
    //  Spend by type (horizontal bar) — the channel-summary `type` series,
    //  summed over the selected FY's calendar months. Same DB source +
    //  buckets as roi.html's Channel Summary "By type".
    // ===================================================================
    var MON_IDX = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };
    function channelMonthFyEnd(label) {
      var p = String(label).split('-'), m = MON_IDX[p[0]], y = Number(p[1]);
      if (!m || !y) return null;
      return m >= 7 ? y + 1 : y;
    }
    // 'Mon-YYYY' channel label → 'YYYY-MM' (for custom date-range month filtering).
    function channelMonthYM(label) {
      var p = String(label).split('-'), m = MON_IDX[p[0]], y = Number(p[1]);
      if (!m || !y) return '';
      return y + '-' + (m < 10 ? '0' + m : '' + m);
    }
    function spendByTypeForFy(key) {
      var months = CH.months || [], type = CH.type || [];
      var idxs = months.map(function (_, i) { return i; });
      if (CUSTOM) {
        idxs = idxs.filter(function (i) { return monthInRange(channelMonthYM(months[i])); });
      } else if (key !== 'all') {
        var fe = fyEndOf(key);
        idxs = idxs.filter(function (i) { return channelMonthFyEnd(months[i]) === fe; });
      }
      return type.map(function (s) {
        return { name: s.name, total: idxs.reduce(function (a, i) { return a + (s.data[i] || 0); }, 0) };
      }).filter(function (d) { return d.total > 0; }).sort(function (a, b) { return b.total - a.total; });
    }

    function compactAud(v) {
      var n = Math.abs(v);
      if (n >= 1e6) return '$' + (v / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'm';
      if (n >= 1e3) return '$' + (v / 1e3).toFixed(n % 1e3 ? 1 : 0) + 'k';
      return '$' + Math.round(v);
    }

    var _spendChart = null;
    var _spendRows = [];   // current bars (type name → index), for the click drill-down
    function renderSpendByType() {
      var el = document.getElementById('spendCanvas');
      if (!el) return;
      var rows = CH.loaded ? spendByTypeForFy(selFyKey()) : [];
      _spendRows = rows;
      var tc = themeColors();
      // Size the box to the number of bars so they stay readable.
      var box = document.getElementById('spendBox');
      if (box) box.style.height = Math.max(200, rows.length * 44 + 40) + 'px';

      if (_spendChart) { _spendChart.destroy(); _spendChart = null; }
      _spendChart = new Chart(el.getContext('2d'), {
        type: 'bar',
        data: {
          labels: rows.map(function (r) { return r.name; }),
          datasets: [{
            label: 'Spend',
            data: rows.map(function (r) { return r.total; }),
            backgroundColor: '#17a673', borderRadius: 4, maxBarThickness: 26,
          }],
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          onClick: function (evt, els) {
            if (!els || !els.length) return;
            var r = _spendRows[els[0].index];
            if (r) showTypeItems(r.name);
          },
          onHover: function (evt, els) {
            if (evt && evt.native && evt.native.target) evt.native.target.style.cursor = els.length ? 'pointer' : 'default';
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              label: function (ctx) { return fmt(ctx.parsed.x, 'currency'); },
              afterLabel: function () { return 'Click to see items'; },
            } },
          },
          scales: {
            x: { beginAtZero: true, ticks: { color: tc.muted, callback: compactAud }, grid: { color: tc.grid } },
            y: { ticks: { color: tc.muted, font: { size: 12 } }, grid: { display: false } },
          },
        },
      });
    }

    // ===================================================================
    //  Spend-by-type drill-down — click a bar → list the vendors (items)
    //  under that type for the current FY/range. Names only, no $ values.
    // ===================================================================
    // Distinct vendors under `typeName`, filtered the SAME way the bar was
    // (selected FY, custom range, or all years) so the list matches the bar.
    function itemsForType(typeName) {
      var key = selFyKey();
      var rows = (CI.items || []).filter(function (it) { return it.type === typeName; });
      if (CUSTOM) {
        rows = rows.filter(function (it) { return monthInRange(channelMonthYM(it.month)); });
      } else if (key !== 'all') {
        var fe = fyEndOf(key);
        rows = rows.filter(function (it) { return channelMonthFyEnd(it.month) === fe; });
      }
      var seen = {}, out = [];
      rows.forEach(function (it) {
        var v = (it.vendor || '').trim();
        if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = 1; out.push(v); }
      });
      return out.sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    }
    function showTypeItems(typeName) {
      var scope = CUSTOM ? 'selected range' : (selFyKey() === 'all' ? 'all years' : fyName(selFyKey()));
      var titleEl = document.getElementById('itemsTitle');
      var subEl = document.getElementById('itemsSub');
      var bodyEl = document.getElementById('itemsBody');
      if (titleEl) titleEl.textContent = typeName;
      if (subEl) subEl.textContent = 'Items under this type · ' + scope;
      if (!CI.loaded) {
        bodyEl.innerHTML = '<div class="muted" style="padding:8px 0">Loading…</div>';
      } else {
        var items = itemsForType(typeName);
        if (!items.length) {
          bodyEl.innerHTML = '<div class="muted" style="padding:8px 0">No items for this type in the ' + esc(scope) + '.</div>';
        } else {
          bodyEl.innerHTML =
            '<div class="items-count muted">' + items.length + ' item' + (items.length === 1 ? '' : 's') + '</div>' +
            '<ol class="items-list">' +
            items.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') +
            '</ol>';
        }
      }
      var bd = document.getElementById('itemsBackdrop');
      if (bd) bd.style.display = 'flex';
    }
    function closeTypeItems() {
      var bd = document.getElementById('itemsBackdrop');
      if (bd) bd.style.display = 'none';
    }

    // ===================================================================
    //  Channel results table — the channels for the selected FY.
    // ===================================================================
    var CH_COLOR = {
      'Paid Ads': '#3b6ef0',
      'Offsite': '#7c5cff',
      'Bureau': '#e8833a',
      'Tailor': '#e15b97',
      'Marketing EDM': '#9aa4b2',
    };
    function crRowFor(key) {
      if (!CR.loaded) return null;
      if (key === 'all') return CR.total;
      var fe = fyEndOf(key);
      return (CR.rows || []).find(function (r) { return r.fyEnd === fe; }) || null;
    }
    function intCell(v) {
      if (v === PENDING) return pendChip();
      if (v === NA) return naCell();
      return (v == null) ? '<span class="muted">—</span>' : String(v);
    }
    function roasCell(v) {
      if (v === PENDING) return pendChip();
      if (v === NA) return naCell();
      return (v == null) ? '<span class="muted">—</span>' : v.toFixed(1) + '×';
    }
    function channelRowHtml(name, c, note) {
      // Cost / enquiry is derived (spend ÷ enquiries); 'N/A' or 'pending' if either input is 'N/A' or 'pending'.
      var costPerEnq;
      if (c.costPerEnq !== undefined) costPerEnq = c.costPerEnq;
      else if (c.spend === NA || c.enquiries === NA) costPerEnq = NA;
      else if (c.spend === PENDING || c.enquiries === PENDING) costPerEnq = PENDING;
      else costPerEnq = (c.spend != null && c.enquiries) ? c.spend / c.enquiries : null;
      var dot = '<span class="ch-dot" style="background:' + (CH_COLOR[name] || '#9aa4b2') + '"></span>';
      var noteHtml = note ? '<div class="muted" style="font-size:11px;font-weight:400;margin-top:2px">' + esc(note) + '</div>' : '';
      return '<tr>' +
        '<td>' + dot + esc(name) + noteHtml + '</td>' +
        '<td>' + fmtCur(c.spend) + '</td>' +
        '<td>' + intCell(c.enquiries) + '</td>' +
        '<td>' + fmtCur(costPerEnq) + '</td>' +
        '<td>' + intCell(c.bookings) + '</td>' +
        '<td>' + fmtCur(c.revenue) + '</td>' +
        '<td>' + roasCell(c.roasTotal) + '</td>' +
        '</tr>';
    }
    function renderChannelResults() {
      var body = document.getElementById('channelBody');
      if (!body) return;
      if (CUSTOM) {   // FY-snapshot data (ROAS + Exec X) — no sub-FY history to filter
        body.innerHTML = '<tr><td colspan="7" class="range-na">Not available for custom ranges — this table is reported by financial year. Clear the date range to view it.</td></tr>';
        return;
      }
      if (!CR.loaded) { body.innerHTML = '<tr><td colspan="7" class="muted">Loading…</td></tr>'; return; }
      var row = crRowFor(selFyKey());
      if (!row) {
        body.innerHTML = '<tr><td colspan="7" class="muted">No channel data for ' + fyName(selFyKey()) + '.</td></tr>';
        return;
      }
      body.innerHTML =
        channelRowHtml('Paid Ads', row.paid) +
        channelRowHtml('Offsite', row.execX, 'Updated at the close of each season.') +
        channelRowHtml('Bureau', row.bureau) +
        channelRowHtml('Tailor', row.tailor) +
        channelRowHtml('Marketing EDM', row.edm, 'pending tracking process');
    }

    // ===================================================================
    //  Loaders
    // ===================================================================
    function loadRoi() {
      return fetchJSON('/api/marketing/roi').then(function (d) {
        ROI.rows = (d && d.rows && d.rows.data) || [];
        ROI.total = d && d.total;
        ROI.byMonth = (d && d.byMonth && d.byMonth.data) || [];
        ROI.pipelineMonths = (d && d.pipelineMonths && d.pipelineMonths.data) || [];
        ROI.loaded = true;
        renderCards();
      }).catch(function (err) { console.error('roi', err); ROI.loaded = true; renderCards(); });
    }
    function loadOverview() {
      return fetchJSON('/api/marketing/overview').then(function (d) {
        var e = d && d.enquiries;
        if (e) { (e.byFy || []).forEach(function (r) { OV.byFy[r.fyEnd] = r; }); OV.total = e.total; }
        OV.loaded = true;
        renderCards();   // re-render so Cost per enquiry fills in
      }).catch(function (err) { console.error('overview', err); OV.loaded = true; });
    }
    // Enquiry count for the active custom range (day-level), for the Cost-per-enquiry card.
    function loadOverviewRange() {
      OV.range = null; renderCards();
      return fetchJSON('/api/marketing/overview' + dateRangeQS()).then(function (d) {
        OV.range = (d && d.enquiries && d.enquiries.range) || { total: 0 };
        renderCards();
      }).catch(function (err) { console.error('overview range', err); OV.range = { total: 0 }; renderCards(); });
    }
    function loadChannelSummary() {
      return fetchJSON('/api/marketing/channel-summary').then(function (d) {
        CH.months = (d && d.months) || [];
        CH.type = (d && d.type) || [];
        CH.loaded = true;
        try { renderSpendByType(); } catch (e) { console.error('spend chart', e); }
      }).catch(function (err) { console.error('channel-summary', err); CH.loaded = true; });
    }
    function normalizeCrRow(row, roasRow) {
      if (!row) return row;
      if (roasRow) {
        var adSpend = (Number(roasRow.googleSpend) || 0) + (Number(roasRow.bingSpend) || 0);
        var rev = Number(roasRow.wonRevenue) || 0;
        row.paid = {
          spend: adSpend,
          enquiries: Number(roasRow.leads) || 0,
          bookings: Number(roasRow.won) || 0,
          revenue: rev,
          roasTotal: adSpend ? rev / adSpend : null,
        };
      }
      if (row.bureau) { row.bureau.spend = NA; row.bureau.roasTotal = NA; }
      if (row.tailor) { row.tailor.spend = NA; row.tailor.roasTotal = NA; }
      row.edm = { spend: 0, enquiries: 0, costPerEnq: 0, bookings: 0, revenue: 0, roasTotal: 0 };
      return row;
    }
    function loadChannelResults() {
      return Promise.all([
        fetchJSON('/api/marketing/channel-results'),
        fetchJSON('/api/operations/roas').catch(function () { return null; }),
      ]).then(function (res) {
        var d = res[0], roas = res[1];
        var roasByFy = {};
        if (roas && roas.rows && roas.rows.data) {
          roas.rows.data.forEach(function (r) { roasByFy[r.fyEnd] = r; });
        }
        CR.rows = ((d && d.rows) || []).map(function (r) {
          return normalizeCrRow(r, roasByFy[r.fyEnd]);
        });
        CR.total = d && d.total ? normalizeCrRow(d.total, roas && roas.total) : null;
        CR.loaded = true;
        renderChannelResults();
      }).catch(function (err) { console.error('channel-results', err); CR.loaded = true; renderChannelResults(); });
    }
    function loadChannelItems() {
      return fetchJSON('/api/marketing/channel-items').then(function (d) {
        CI.items = (d && d.items) || [];
        CI.loaded = true;
      }).catch(function (err) { console.error('channel-items', err); CI.loaded = true; });
    }

    // ----- Segmented toggle -----
    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    function renderSR() {
      renderCards();
      renderChannelResults();
      try { renderSpendByType(); } catch (e) { console.error('chart', e); }
    }
    // Custom date range: KPIs + Spend-by-type aggregate the monthly series (month-level);
    // the Channel results table greys out; the enquiry count refetches day-level. Clearing
    // restores FY mode.
    function applyRange() {
      CUSTOM = dateRangeActive();
      renderSR();
      if (CUSTOM) loadOverviewRange();
    }

    initPage('marketing');
    renderMarketingHead(true);   // live page — shared Marketing head, no "sample data" badge
    renderMarketingSidebar('spend-roi');
    renderDateRange();
    fillHeadInfo();            // fill the static card-head ⓘ placeholders once
    renderCards();              // initial (…)
    renderChannelResults();     // initial (Loading…)
    try { renderSpendByType(); } catch (e) {}
    loadRoi();
    loadOverview();
    loadChannelSummary();
    loadChannelResults();
    loadChannelItems();
    wireSeg('fySeg', renderSR);
    wireDateRange({ onChange: applyRange });
    window.onThemeChange = function () { try { renderSpendByType(); } catch (e) {} };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTypeItems(); });
  </script>
</body>
</html>
