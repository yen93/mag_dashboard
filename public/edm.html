<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDM — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       EDM — ActiveCampaign Contact Performance + All Campaigns
       Performance. LIVE via /api/marketing/edm (weekly snapshot
       cache edm_report_metrics + live new-contacts-by-month from
       the activecampaign_contacts mirror). Follows DESIGN_GUIDE.md
       and the other Marketing data pages.
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
    }

    /* Full-width layout matching the other Marketing pages */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .card-head.block-head { display: block; margin-bottom: 14px; }
    .card-head h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
    .chart-cap { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active { background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2)); color: #fff; box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent); }
    .range-na { color: var(--text-muted); font-size: 13px; padding: 10px 2px; }

    /* Collapsible section headers */
    .edm-section { margin: 22px 0 8px; }
    .edm-sec-head {
      display: flex; align-items: center; gap: 12px;
      margin: 0 2px 14px;
    }
    .edm-sec-toggle {
      display: inline-flex; align-items: center; gap: 9px;
      background: none; border: 0; cursor: pointer;
      font: inherit; color: var(--text); padding: 2px 0;
    }
    .edm-sec-toggle h2 {
      margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em;
    }
    .edm-chev {
      display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center;
      border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; transition: transform .18s ease;
    }
    .edm-sec-toggle[aria-expanded="false"] .edm-chev { transform: rotate(-90deg); }
    .edm-sec-sub { font-size: 13px; color: var(--text-muted); }
    .edm-sec-body[hidden] { display: none; }

    /* KPI cards */
    .edm-kpi-grid {
      display: grid; gap: 16px; margin: 0 0 16px;
      grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    }
    @media (max-width: 960px) { .edm-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { .edm-kpi-grid { grid-template-columns: 1fr; } }
    .edm-kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px 22px 18px; box-shadow: var(--mkt-shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .edm-kpi:hover { transform: translateY(-2px); box-shadow: var(--mkt-shadow-lift); }
    .edm-kpi .label { font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .edm-kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 8px 0 6px; color: var(--text); }
    .edm-kpi .sub { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    /* Compare delta chip (driven by the #cmpSeg toggle) */
    .edm-kpi .edm-delta { font-size: 12px; font-weight: 600; margin-top: 5px; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px; color: var(--text-muted); }
    .edm-kpi .edm-delta.pos { color: var(--pos); }
    .edm-kpi .edm-delta.neg { color: var(--neg); }

    /* Chart + side tables row */
    .edm-row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: stretch; }
    @media (max-width: 900px) { .edm-row2 { grid-template-columns: 1fr; } }

    .edm-chart-card { padding: 20px 22px 16px; display: flex; flex-direction: column; }
    .edm-chart-box { position: relative; flex: 1; min-height: 260px; }
    .edm-chart-box.tall { min-height: 320px; }

    /* List health — per-list active/total bars */
    .lh-headline { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 2px; }
    .lh-legend { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; }
    .lh-legend .lh-key { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; }
    .lh-legend .lh-key:not(:first-child) { margin-left: 14px; }
    .lh-key.active { background: var(--mkt-accent); }
    .lh-key.rest { background: var(--surface-2); border: 1px solid var(--border); }
    .lh-bars { margin-top: 6px; }
    .lh-row { margin-top: 14px; }
    .lh-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 5px; }
    .lh-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .lh-fig { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .lh-bar { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
    .lh-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mkt-accent); transition: width .3s ease; }

    /* Contact segmentation — single donut */
    .seg-donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 1; }
    .seg-donut-box { position: relative; width: 100%; max-width: 300px; height: 230px; }
    .seg-legend { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .seg-leg-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); }
    .seg-leg-dot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .seg-leg-pct { color: var(--text-muted); margin-left: 2px; }
    .seg-note { width: 100%; font-size: 13px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 12px; }

    /* Campaigns table card */
    .edm-campaigns-card { padding: 22px 24px; margin-top: 16px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
    <a class="tab" href="builds_monitoring.html">AI &amp; Automation</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls: FY toggle + shared custom date range -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
          <span class="ctl-label" style="margin-left:4px">Compare</span>
          <div class="segmented" id="cmpSeg" aria-label="Comparison basis">
            <button class="active" data-cmp="yoy">vs last year</button>
            <button data-cmp="prev">vs previous period</button>
          </div>
          <span class="muted cmp-range" id="cmpRange" style="font-size:12.5px"></span>
          <div class="spacer" style="flex:1"></div>
          <span class="muted" id="freshNote" style="font-size:13px">Loading…</span>
        </div>
      </div>

      <!-- ============ Section 1: Contact Performance ============ -->
      <section class="edm-section">
        <div class="edm-sec-head">
          <button class="edm-sec-toggle" id="toggleContact" aria-expanded="true" aria-controls="contactBody">
            <span class="edm-chev">▾</span>
            <h2>Contact Performance</h2>
          </button>
          <span class="head-info" data-info="Health of the email database: how many contacts, how many are active (subscribed), and how it's grown." data-src="ActiveCampaign (contacts &amp; lists)"></span>
          <span class="edm-sec-sub">Click the title to show or hide this section</span>
        </div>
        <div class="edm-sec-body" id="contactBody">
          <!-- 3 KPI cards -->
          <div class="chart-cap" id="contactCmpRange" style="margin:0 2px 10px"></div>
          <div class="edm-kpi-grid" style="--cols:3" id="contactKpis"></div>

          <!-- List health (left) + contact segmentation (right) -->
          <div class="edm-row2">
            <div class="card edm-chart-card">
              <div class="card-head block-head">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
                  <h3 id="lhHeading">List health <span class="head-info" data-info="Our biggest lists and how much of each is still active (subscribed) vs the full size." data-src="ActiveCampaign (lists)"></span></h3>
                  <span class="chart-cap" id="lhCap"></span>
                </div>
                <div class="lh-headline" id="lhHeadline">Loading…</div>
                <div class="lh-legend"><span class="lh-key active"></span>Active<span class="lh-key rest"></span>Non-active</div>
              </div>
              <div class="lh-bars" id="lhBars"></div>
            </div>

            <div class="card edm-chart-card">
              <div class="card-head block-head">
                <h3 id="segHeading">Contact segmentation <span class="head-info" data-info="Contacts split by engagement: Active = opened/clicked in the last 90 days (reliable audience); Quiet = nothing for 90–180 days (re-engage); Dormant = nothing for 180+ days (re-engage or remove); Not tagged = not yet classified — too new (under 180 days) to fall into a band. Total is real." data-src="ActiveCampaign contact count"></span></h3>
                <div class="chart-cap" id="segCap"></div>
              </div>
              <div class="seg-donut-wrap">
                <div class="seg-donut-box"><canvas id="segCanvas"></canvas></div>
                <div class="seg-legend" id="segLegend"></div>
                <div class="seg-note" id="segNote"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ Section 2: Campaigns Performance ============ -->
      <section class="edm-section">
        <div class="edm-sec-head">
          <button class="edm-sec-toggle" id="toggleCampaigns" aria-expanded="true" aria-controls="campaignsBody">
            <span class="edm-chev">▾</span>
            <h2>Campaigns Performance</h2>
          </button>
          <span class="head-info" data-info="How emails are performing overall — total sent and the open, click, bounce and unsubscribe rates, with each campaign below." data-src="ActiveCampaign all-campaigns performance report"></span>
          <span class="edm-sec-sub">Click the title to show or hide this section</span>
        </div>
        <div class="edm-sec-body" id="campaignsBody">
          <!-- top cards -->
          <div class="edm-kpi-grid" style="--cols:6" id="campaignKpis"></div>
          <div class="chart-cap" id="campPeriodCap" style="margin:-8px 2px 12px"></div>

          <!-- campaigns table (mirror AC columns, no preview) -->
          <div class="card edm-campaigns-card">
            <div class="card-head block-head">
              <h3 id="campTableHeading">All campaigns <span class="head-info" data-info="Every email sent with its full stats — sends, opens, clicks, click-to-open, bounces, unsubscribes. Sort, search, filter." data-src="ActiveCampaign all-campaigns performance report"></span></h3>
              <div class="muted" style="font-size:12px;margin-top:4px" id="campTableCount"></div>
            </div>
            <div id="campTableRows"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=30"></script>
  <script>
    /* EDM — LIVE. Contact KPIs / list health / engagement segmentation / campaign report
       come from the weekly snapshot (public.edm_report_metrics, filled by the edm-sync
       routine via the ActiveCampaign MCP). Served by /api/marketing/edm.
       The FY toggle + custom date range filter the Campaigns section by each campaign's
       last-send date (KPIs recomputed from the filtered rows). The Contact section is a
       current snapshot, so it greys out for a past FY or a custom date range. */

    var EDM = null;
    var CAMP_TABLE_STATE = {};
    var CUR_FY = 'fy27';   // the financial year containing "today" (Jul 2026 – Jun 2027)
    var CMP = 'yoy';       // Compare basis: 'yoy' (vs last year) | 'prev' (vs previous period)

    function selFyKey() { var b = document.querySelector('#fySeg button.active'); return b ? b.getAttribute('data-fy') : 'fy27'; }
    function fyEndOf(k) { return k === 'all' ? null : 2000 + parseInt(k.slice(2), 10); }
    function fyWindow(k) { var e = fyEndOf(k); return e ? { from: (e - 1) + '-07-01', to: e + '-06-30' } : null; }

    // A campaign is "in" the active period by its last-send date (YYYY-MM-DD).
    function campInPeriod(row) {
      var k = selFyKey();
      if (!dateRangeActive() && k === 'all') return true;   // all-time: everything
      var d = row && row.lastSent;
      if (!d) return false;
      if (dateRangeActive()) {
        var r = getDateRange();
        if (r.from && d < r.from) return false;
        if (r.to && d > r.to) return false;
        return true;
      }
      var w = fyWindow(k);
      return d >= w.from && d <= w.to;
    }
    function filteredCampaigns() {
      var rows = (EDM && EDM.campaigns && EDM.campaigns.rows) || [];
      return rows.filter(campInPeriod);
    }
    // Account-level summary recomputed from a set of campaign rows (send-weighted rates,
    // matching how ActiveCampaign derives its summary totals).
    function campSummaryOf(rows) {
      var t = { sends: 0, uOpens: 0, uClicks: 0, bounces: 0, unsubs: 0 };
      rows.forEach(function (c) {
        t.sends += c.sends || 0; t.uOpens += c.uOpens || 0; t.uClicks += c.uClicks || 0;
        t.bounces += c.bounces || 0; t.unsubs += c.unsubs || 0;
      });
      var r = function (nu, de) { return de ? Math.round((nu / de) * 10000) / 100 : null; };
      return {
        count: rows.length, totalSends: t.sends, totalUniqueOpens: t.uOpens, totalUniqueClicks: t.uClicks,
        totalBounces: t.bounces, totalUnsubscribes: t.unsubs,
        openRate: r(t.uOpens, t.sends), clickRate: r(t.uClicks, t.sends),
        clickToOpenRate: r(t.uClicks, t.uOpens), bounceRate: r(t.bounces, t.sends), unsubscribeRate: r(t.unsubs, t.sends)
      };
    }
    function periodLabel() {
      if (dateRangeActive()) { var r = getDateRange(); return (r.from || '…') + ' → ' + (r.to || '…'); }
      var k = selFyKey();
      return k === 'all' ? 'All years' : k.toUpperCase();
    }

    /* ============================================================
       Compare toggle (#cmpSeg) — "vs last year" / "vs previous period".
       Drives a delta chip under each campaign KPI (open rate, click rate, …).
       The comparison window is derived from the current period's effective
       [from,to] (mirrors marketing.html): "vs last year" is the same window one
       year earlier, "vs previous period" the equal-length window immediately
       before. For an FY the current window is the FY, with its end CLAMPED TO TODAY
       so the partial CURRENT FY (FY27) compares like-for-like windows and the two
       bases genuinely diverge; a full PAST FY keeps its whole 12-month window, so
       the two bases coincide (both = the prior FY). Same divergence for a CUSTOM
       date range. The contact snapshot has no history, so it's never compared.
       ============================================================ */
    function selCmp() { var b = document.querySelector('#cmpSeg button.active'); return b ? b.getAttribute('data-cmp') : 'yoy'; }
    function _addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    function _shiftYears(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCFullYear(d.getUTCFullYear() + n); return d.toISOString().slice(0, 10); }
    function _daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }
    function _todayIso() { return new Date().toISOString().slice(0, 10); }

    // The current period's effective [from,to]. Custom range → the range itself;
    // FY → the FY window with 'to' clamped to today (so a partial current FY yields
    // a partial window, making "previous period" differ from "last year"). null = no
    // comparable current period ('all years', or an incomplete custom range).
    function currentPeriodBounds() {
      if (dateRangeActive()) {
        var r = getDateRange();
        return (r.from && r.to) ? { from: r.from, to: r.to } : null;
      }
      var k = selFyKey();
      if (k === 'all') return null;
      var w = fyWindow(k), today = _todayIso();
      return { from: w.from, to: w.to < today ? w.to : today };
    }

    // The campaign set to compare the current period against, honoring the Compare
    // basis: "vs last year" = the same window one year earlier; "vs previous period"
    // = the equal-length window immediately before. null = no comparison.
    function comparisonBounds() {
      var cur = currentPeriodBounds();
      if (!cur) return null;
      var cf, ct;
      if (CMP === 'prev') { var len = _daysBetween(cur.from, cur.to); ct = _addDays(cur.from, -1); cf = _addDays(ct, -len); }
      else { cf = _shiftYears(cur.from, -1); ct = _shiftYears(cur.to, -1); }
      return { from: cf, to: ct };
    }
    function comparisonCampaigns() {
      var rows = (EDM && EDM.campaigns && EDM.campaigns.rows) || [];
      var b = comparisonBounds();
      if (!b) return null;
      return rows.filter(function (c) { var d = c.lastSent; return d && d >= b.from && d <= b.to; });
    }

    // ----- "Showing [range] · vs [range]" line beside the Compare toggle (mirrors marketing.html) -----
    // Built from the SAME windows the campaign KPI deltas are computed over (currentPeriodBounds /
    // comparisonBounds), so the dates can never disagree with the chips under the cards.
    var _MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function daySpan(from, to) {   // 'YYYY-MM-DD' pair → "1 Jul – 25 Nov 2026" (year once if shared)
      var a = from.split('-'), b = to.split('-');
      var start = (+a[2]) + ' ' + _MON[+a[1] - 1] + (a[0] === b[0] ? '' : ' ' + a[0]);
      return start + ' – ' + (+b[2]) + ' ' + _MON[+b[1] - 1] + ' ' + b[0];
    }
    function dayFmt(d) { var p = d.split('-'); return (+p[2]) + ' ' + _MON[+p[1] - 1] + ' ' + p[0]; }
    function compareRangeLabel() {
      var cur = currentPeriodBounds();
      if (!cur) return (!dateRangeActive() && selFyKey() === 'all') ? 'All financial years' : '';
      var b = comparisonBounds();
      return 'Showing ' + daySpan(cur.from, cur.to) + ' · vs ' + daySpan(b.from, b.to);
    }
    function renderCmpRange() {
      var el = document.getElementById('cmpRange');
      if (el) el.textContent = compareRangeLabel();
    }

    // ----- Contact KPI deltas: the contact figures are snapshots, so the comparison is the latest
    // snapshot vs an earlier one (prev = ~28 days before, else the oldest earlier snapshot; yoy =
    // nearest to a year before ±21 days — none until a year of history exists). -----
    function contactBase() {
      var h = (EDM && EDM.contact && EDM.contact.history) || [];
      if (h.length < 2) return null;
      var latest = h[h.length - 1], lt = Date.parse(latest.d + 'T00:00:00Z'), DAY = 86400000;
      var older = h.filter(function (s) { return s.d < latest.d; });
      if (!older.length) return null;
      if (CMP === 'prev') {
        var far = older.filter(function (s) { return Date.parse(s.d + 'T00:00:00Z') <= lt - 28 * DAY; });
        return far.length ? far[far.length - 1] : older[0];
      }
      var best = null, gap = 21 * DAY + 1;
      older.forEach(function (s) {
        var g = Math.abs(Date.parse(s.d + 'T00:00:00Z') - (lt - 365 * DAY));
        if (g < gap) { best = s; gap = g; }
      });
      return best;
    }
    function renderContactCmpRange() {
      var el = document.getElementById('contactCmpRange');
      if (!el) return;
      var h = (EDM && EDM.contact && EDM.contact.history) || [];
      if (!contactLive() || !h.length) { el.textContent = ''; return; }
      var base = contactBase(), latest = h[h.length - 1];
      el.textContent = base
        ? 'Showing ' + dayFmt(latest.d) + ' · vs ' + dayFmt(base.d) + ' (contact snapshots)'
        : 'Showing ' + dayFmt(latest.d) + ' · no ' + (CMP === 'prev' ? 'earlier' : 'year-ago') + ' snapshot to compare yet';
    }
    function cmpLabel() {
      if (CMP === 'prev') return 'vs prev period';
      if (!dateRangeActive() && selFyKey() === 'all') return '';
      return 'vs same period last year';
    }

    // One delta chip. opts: {pp} percentage-point (rate values already in %), else percent;
    // {invert} = lower is better (down = good/green).
    function deltaChip(cur, prev, label, opts) {
      opts = opts || {};
      if (cur == null || prev == null || isNaN(cur) || isNaN(prev)) return '';
      var lbl = ' <span class="muted" style="font-weight:500;font-size:11px">' + esc(label) + '</span>';
      function wrap(sign, txt) { return '<div class="edm-delta ' + (sign === 0 ? '' : sign > 0 ? 'pos' : 'neg') + '">' + txt + lbl + '</div>'; }
      if (opts.pp) {
        var dp = Math.round((cur - prev) * 100) / 100;
        if (dp === 0) return wrap(0, '▬ no change');
        return wrap((opts.invert ? dp < 0 : dp > 0) ? 1 : -1, (dp > 0 ? '▲ +' : '▼ −') + esc(Math.abs(dp).toFixed(2)) + ' pp');
      }
      if (prev === 0) { if (cur === 0) return ''; return wrap(opts.invert ? -1 : 1, '▲ new'); }
      var d = cur - prev, pct = Math.round((d / prev) * 1000) / 10;
      return wrap((opts.invert ? d < 0 : d >= 0) ? 1 : -1, (d >= 0 ? '▲ ' : '▼ ') + esc(Math.abs(pct)) + '%');
    }
    // The contact snapshot is "as of now" — only meaningful for the current FY or All years,
    // and never for a custom date range.
    function contactLive() { return !dateRangeActive() && (selFyKey() === 'all' || selFyKey() === CUR_FY); }
    function contactNaMsg() {
      return dateRangeActive()
        ? 'Not available for a custom date range — contact figures are a current ActiveCampaign snapshot. Clear the range to view them.'
        : 'Not available for a past financial year — contact figures are a current ActiveCampaign snapshot. Switch to the current FY or All years.';
    }

    function num(n)  { return (n == null || isNaN(n)) ? '—' : fmt(Number(n), 'count'); }
    function rate(n) { return (n == null || isNaN(n)) ? '—' : (Math.round(Number(n) * 100) / 100) + '%'; }
    function pctOf(part, whole) {
      if (part == null || !whole) return '';
      return Math.round((part / whole) * 1000) / 10 + '% of total';
    }

    function kpiCard(label, value, sub, info, cmp) {
      return '<div class="edm-kpi">' +
        '<div class="label">' + esc(label) + (info || '') + '</div>' +
        '<div class="value">' + value + '</div>' +
        '<div class="sub">' + (sub || '&nbsp;') + '</div>' +
        (cmp || '') +
      '</div>';
    }

    function renderContactKpis() {
      renderContactCmpRange();
      var host = document.getElementById('contactKpis');
      if (!contactLive()) { host.innerHTML = '<div class="range-na" style="grid-column:1/-1">' + esc(contactNaMsg()) + '</div>'; return; }
      var c = (EDM && EDM.contact) || {};
      var b = contactBase(), lab = cmpLabel() || 'vs same period last year';
      var dl = function (cur, prev, opts) { return b ? deltaChip(cur, prev, lab, opts) : ''; };
      host.innerHTML = [
        kpiCard('Total Contacts', num(c.total), 'Everyone in ActiveCampaign',
          infoTip('Everyone in ActiveCampaign, whatever their status.', 'ActiveCampaign (contacts)'),
          dl(c.total, b && b.total)),
        kpiCard('Active Contacts', num(c.active), pctOf(c.active, c.total),
          infoTip('Contacts who are subscribed and can be emailed.', 'ActiveCampaign (contacts)'),
          dl(c.active, b && b.active)),
        kpiCard('Non-Active Contacts', num(c.nonactive), pctOf(c.nonactive, c.total),
          infoTip('Contacts we can\'t email — unconfirmed, unsubscribed or bounced.', 'ActiveCampaign (contacts)'),
          dl(c.nonactive, b && b.nonactive, { invert: true }))
      ].join('');
    }

    function renderCampaignKpis() {
      renderCmpRange();
      var s = campSummaryOf(filteredCampaigns());
      var pc = document.getElementById('campPeriodCap');
      if (pc) pc.textContent = periodLabel() + ' · by campaign last-send date · ' + num(s.count) + ' campaign' + (s.count === 1 ? '' : 's');
      // Compare deltas (prior FY, or the shifted custom-range window). null = no comparison.
      var cc = comparisonCampaigns(), ps = cc ? campSummaryOf(cc) : null, lab = cmpLabel();
      var dl = function (cur, prev, opts) { return ps ? deltaChip(cur, prev, lab, opts) : ''; };
      document.getElementById('campaignKpis').innerHTML = [
        kpiCard('Campaigns sent', num(s.count), periodLabel(),
          infoTip('Email campaigns whose last send falls in the selected period.', 'ActiveCampaign all-campaigns report'),
          dl(s.count, ps && ps.count)),
        kpiCard('Emails sent', num(s.totalSends), 'total delivered',
          infoTip('Total individual emails delivered this period.', 'ActiveCampaign all-campaigns report'),
          dl(s.totalSends, ps && ps.totalSends)),
        kpiCard('Open rate', rate(s.openRate), num(s.totalUniqueOpens) + ' unique opens',
          infoTip('Share of delivered emails opened. Apple Mail auto-opens inflate this, so treat it as a soft signal.', 'ActiveCampaign all-campaigns report'),
          dl(s.openRate, ps && ps.openRate, { pp: true })),
        kpiCard('Click rate', rate(s.clickRate), num(s.totalUniqueClicks) + ' unique clicks',
          infoTip('Share of delivered emails where a link was clicked — the most reliable engagement signal.', 'ActiveCampaign all-campaigns report'),
          dl(s.clickRate, ps && ps.clickRate, { pp: true })),
        kpiCard('Bounce rate', rate(s.bounceRate), num(s.totalBounces) + ' bounces',
          infoTip('Share of emails that couldn\'t be delivered.', 'ActiveCampaign all-campaigns report'),
          dl(s.bounceRate, ps && ps.bounceRate, { pp: true, invert: true })),
        kpiCard('Unsubscribe rate', rate(s.unsubscribeRate), num(s.totalUnsubscribes) + ' unsubscribes',
          infoTip('Share of delivered emails that led to an unsubscribe.', 'ActiveCampaign all-campaigns report'),
          dl(s.unsubscribeRate, ps && ps.unsubscribeRate, { pp: true, invert: true }))
      ].join('');
    }

    function pctOfInt(a, t) { return (a == null || !t) ? 0 : Math.round((a / t) * 100); }

    // List health — the largest lists as active/total horizontal bars + the account headline.
    function renderListHealth() {
      var c = (EDM && EDM.contact) || {};
      var lists = c.lists || [];
      var head = document.getElementById('lhHeadline');
      var cap = document.getElementById('lhCap');
      var bars = document.getElementById('lhBars');
      if (!contactLive()) {
        if (cap) cap.textContent = '';
        if (head) head.textContent = '—';
        if (bars) bars.innerHTML = '<div class="range-na">' + esc(contactNaMsg()) + '</div>';
        return;
      }
      if (cap) cap.textContent = 'Real figures from ActiveCampaign';
      if (head) {
        head.innerHTML = (c.active == null)
          ? '—'
          : '<strong>' + num(c.active) + '</strong> active of ' + num(c.total) + ' contacts (' + pctOfInt(c.active, c.total) + '%)';
      }
      if (!bars) return;
      if (!lists.length) { bars.innerHTML = '<div class="muted" style="padding:8px 2px">No data.</div>'; return; }
      bars.innerHTML = lists.map(function (l) {
        var p = pctOfInt(l.active, l.total);
        return '<div class="lh-row">' +
          '<div class="lh-top"><span class="lh-name">' + esc(l.name) + '</span>' +
          '<span class="lh-fig">' + num(l.active) + ' of ' + num(l.total) + ' active (' + p + '%)</span></div>' +
          '<div class="lh-bar"><div class="lh-fill" style="width:' + p + '%"></div></div>' +
        '</div>';
      }).join('');
    }

    // Contact segmentation — a single donut. The total in the centre is the real
    // ActiveCampaign contact count; the band split (Quiet / Active / Dormant) is a
    // sample until 3 saved AC segments are wired in.
    var _segChart = null;
    var SEG_SAMPLE = [
      { label: 'Active (opened/clicked ≤90d)', pct: 30, color: '#12a884', desc: 'Opened or clicked in the last 90 days — your reliable audience' },
      { label: 'Quiet (91–180d)', pct: 35, color: '#3b82f6', desc: 'No open for 90–180 days — the re-engagement audience' },
      { label: 'Dormant (no engagement 180d+)', pct: 25, color: '#e8742e', desc: 'No open for 180+ days — re-engage or sunset' },
      { label: 'Not tagged', pct: 10, color: '#ef4444', desc: 'Contacts without an engagement tag — not yet classified' }
    ];

    // Draws the big total + "contacts" label in the hole of the donut.
    var segCenterText = {
      id: 'segCenterText',
      afterDraw: function (chart) {
        var o = chart.$segCenter;
        if (!o) return;
        var a = chart.chartArea, ctx = chart.ctx;
        var cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2;
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = o.textColor;
        ctx.font = '700 28px Inter, system-ui, -apple-system, sans-serif';
        ctx.fillText(o.big, cx, cy - 8);
        ctx.fillStyle = o.mutedColor;
        ctx.font = '500 13px Inter, system-ui, -apple-system, sans-serif';
        ctx.fillText('contacts', cx, cy + 16);
        ctx.restore();
      }
    };

    function renderSegmentation() {
      var c = (EDM && EDM.contact) || {};
      var total = (c.total != null && c.total > 0) ? c.total : 15698;
      var cap = document.getElementById('segCap');
      var legend = document.getElementById('segLegend');
      var note = document.getElementById('segNote');
      if (_segChart) { _segChart.destroy(); _segChart = null; }

      // LIVE: counts of the AC engagement tags (edm_report_metrics.segmentation);
      // "Not tagged" = total − the three tagged bands.
      var live = {};
      ((c.segmentation) || []).forEach(function (s) { live[s.key] = Number(s.count) || 0; });
      var hasLive = c.segmentation && c.segmentation.length > 0;
      var tagged = (live.active || 0) + (live.quiet || 0) + (live.dormant || 0);
      var counts = hasLive
        ? [live.active || 0, live.quiet || 0, live.dormant || 0, Math.max(total - tagged, 0)]
        : SEG_SAMPLE.map(function (s) { return Math.round(total * s.pct / 100); });
      var sum = counts.reduce(function (a, b) { return a + b; }, 0) || 1;
      var SEG = SEG_SAMPLE.map(function (s, i) {
        return { label: s.label, color: s.color, desc: s.desc, count: counts[i], pct: Math.round(counts[i] / sum * 1000) / 10 };
      });
      if (cap) cap.textContent = (hasLive ? 'Live split of ' : 'Sample split on ') + total.toLocaleString('en-AU') +
        ' total contacts';

      if (legend) {
        legend.innerHTML = SEG.map(function (s) {
          return '<div class="seg-leg-row"><span class="seg-leg-dot" style="background:' + s.color + '"></span>' +
            esc(s.label) + '<span class="seg-leg-pct">· ' + s.count.toLocaleString('en-AU') + ' (' + s.pct + '%)</span></div>';
        }).join('');
      }
      if (note) {
        note.textContent = 'Active → your reliable audience · Quiet → nurture harder · ' +
          'Dormant → re-engage or sunset · Not tagged → no engagement tag yet.';
      }

      var el = document.getElementById('segCanvas');
      if (!el) return;
      var tc = themeColors();
      _segChart = new Chart(el.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: SEG.map(function (s) { return s.label; }),
          datasets: [{
            data: counts,
            backgroundColor: SEG_SAMPLE.map(function (s) { return s.color; }),
            borderColor: tc.surface || '#fff', borderWidth: 3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              title: function (its) { return (SEG[its[0].dataIndex] || {}).label || its[0].label; },
              label: function (ctx) { var v = ctx.parsed || 0; return v.toLocaleString('en-AU') + ' contacts (' + (SEG[ctx.dataIndex] || {}).pct + '%)'; },
              afterLabel: function (ctx) { return (SEG[ctx.dataIndex] || {}).desc || ''; }
            } }
          }
        },
        plugins: [segCenterText]
      });
      _segChart.$segCenter = {
        big: total.toLocaleString('en-AU'),
        textColor: tc.text || '#222',
        mutedColor: tc.muted || '#888'
      };
      _segChart.update();
    }

    var CAMP_TYPE = { single: 'One-off', single_automated: 'Automated', recurring: 'Recurring', responder: 'Autoresponder', reminder: 'Reminder', special: 'Special', text: 'SMS/Text', activerss: 'RSS', split: 'Split test' };
    function campType(t) { return CAMP_TYPE[t] || (t ? esc(t) : '—'); }

    function renderCampTable() {
      var rows = filteredCampaigns();
      var cnt = document.getElementById('campTableCount');
      var cols = [
        { key: 'name', label: 'Campaign', render: function (v) { return esc(v || '—'); } },
        { key: 'type', label: 'Type', unit: 'text', render: function (v) { return campType(v); }, text: function (v) { return CAMP_TYPE[v] || v || ''; } },
        { key: 'lastSent', label: 'Last sent', unit: 'date' },
        { key: 'sends', label: 'Sends', unit: 'count' },
        { key: 'uOpens', label: 'Opens', unit: 'count' },
        { key: 'openRate', label: 'Open rate', unit: 'percent' },
        { key: 'uClicks', label: 'Clicks', unit: 'count' },
        { key: 'clickRate', label: 'Click rate', unit: 'percent' },
        { key: 'cto', label: 'Click-to-open', unit: 'percent' },
        { key: 'bounces', label: 'Bounces', unit: 'count' },
        { key: 'bounceRate', label: 'Bounce rate', unit: 'percent' },
        { key: 'unsubs', label: 'Unsubs', unit: 'count' },
        { key: 'unsubRate', label: 'Unsub rate', unit: 'percent' }
      ];
      renderSortableTable('campTableRows', rows, cols, {
        stateStore: CAMP_TABLE_STATE,
        searchPlaceholder: 'Search campaigns…',
        sortKey: 'sends', sortDir: 'desc',
        emptyText: 'No campaigns match the selected filters.',
        pageSize: 25,
        onCount: function (shown, total) {
          if (cnt) cnt.textContent = (shown === total ? total : shown + ' of ' + total) + ' campaign' + (total === 1 ? '' : 's');
        }
      });
    }

    function setFreshNote() {
      var el = document.getElementById('freshNote');
      if (!el) return;
      if (EDM && EDM.capturedAt) {
        var dt = new Date(EDM.capturedAt);
        el.textContent = 'Weekly snapshot · ' + dt.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      } else {
        el.textContent = 'Live from ActiveCampaign';
      }
    }

    function renderAll() {
      renderContactKpis();
      renderListHealth();
      renderSegmentation();
      renderCampaignKpis();
      renderCampTable();
      setFreshNote();
    }

    function wireCollapse(btnId, bodyId) {
      var btn = document.getElementById(btnId);
      var body = document.getElementById(bodyId);
      if (!btn || !body) return;
      btn.addEventListener('click', function () {
        var open = btn.getAttribute('aria-expanded') !== 'false';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        body.hidden = open;
        // charts need a reflow after being un-hidden
        if (!open) { renderSegmentation(); }
      });
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          if (seg.classList.contains('seg-disabled')) return;   // disabled while a custom range is active
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    // Re-render everything the FY toggle / date-range controls affect.
    function applyControls() {
      setFySegDisabled(dateRangeActive());
      renderContactKpis();
      renderListHealth();
      renderSegmentation();
      renderCampaignKpis();
      renderCampTable();
    }

    function load() {
      fetchJSON('/api/marketing/edm').then(function (d) {
        EDM = d || {};
        renderAll();
      }).catch(function (err) {
        console.error('edm', err);
        document.getElementById('contactKpis').innerHTML = '<div class="muted" style="padding:8px 2px">Failed to load EDM report.</div>';
        document.getElementById('freshNote').textContent = '';
      });
    }

    initPage('marketing');
    renderMarketingHead(true);            // live page — shared Marketing head, no "sample data" badge
    renderMarketingSidebar('edm');
    renderDateRange();                    // inject the shared custom date-range control after #fySeg
    fillHeadInfo();                       // static section/chart/table ⓘ info tools (DESIGN_GUIDE §6)
    wireCollapse('toggleContact', 'contactBody');
    wireCollapse('toggleCampaigns', 'campaignsBody');
    wireSeg('fySeg', applyControls);      // FY toggle re-renders campaigns + contact gating
    wireSeg('cmpSeg', function () { CMP = selCmp(); renderContactKpis(); renderCampaignKpis(); });   // Compare basis drives campaign KPI deltas
    wireDateRange({ onChange: applyControls });   // custom range overrides the FY toggle
    load();
    window.onThemeChange = function () { renderSegmentation(); };
  </script>
</body>
</html>
