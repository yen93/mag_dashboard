<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <!-- apply saved theme early to avoid a flash -->
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>MAG Metrics</h1>
      <p class="sub">Sign in to view the dashboard</p>

      <div class="error" id="error" hidden></div>

      <!-- Step 1: email -->
      <div id="step-email">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email"
                 placeholder="you@myadventuregroup.com.au" required />
        </div>
        <button class="btn" type="submit" id="sendBtn">Send code</button>
      </div>

      <!-- Step 2: code (revealed after a code is sent) -->
      <div id="step-code" hidden>
        <p class="sub" id="sentTo"></p>
        <div class="field">
          <label for="code">Code</label>
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="6" pattern="[0-9]*" placeholder="6-digit code" />
        </div>
        <button class="btn" type="submit" id="verifyBtn">Sign in</button>
        <div class="login-links">
          <a href="#" id="resendLink">Resend code</a>
          <a href="#" id="changeLink">Use a different email</a>
        </div>
      </div>
    </form>
  </div>

  <script src="app.js?v=3"></script>
  <script>
    // Already signed in? Go straight to the dashboard.
    if (currentUser()) window.location.href = 'sales.html';

    var form = document.getElementById('loginForm');
    var errBox = document.getElementById('error');
    var stepEmail = document.getElementById('step-email');
    var stepCode = document.getElementById('step-code');
    var emailInput = document.getElementById('email');
    var codeInput = document.getElementById('code');
    var sendBtn = document.getElementById('sendBtn');
    var verifyBtn = document.getElementById('verifyBtn');
    var sentTo = document.getElementById('sentTo');

    var stage = 'email'; // 'email' | 'code'

    function showError(msg) { errBox.textContent = msg; errBox.hidden = false; }
    function clearError() { errBox.hidden = true; }

    function requestCode() {
      clearError();
      sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
      return apiRequestCode(emailInput.value.trim())
        .then(function () {
          stage = 'code';
          sentTo.textContent = 'We sent a code to ' + emailInput.value.trim() + '.';
          stepEmail.hidden = true;
          stepCode.hidden = false;
          codeInput.value = '';
          codeInput.focus();
        })
        .catch(function (err) { showError(err.message || 'Could not send code.'); })
        .finally(function () { sendBtn.disabled = false; sendBtn.textContent = 'Send code'; });
    }

    function verify() {
      clearError();
      verifyBtn.disabled = true; verifyBtn.textContent = 'Signing in…';
      apiVerifyCode(emailInput.value.trim(), codeInput.value.trim())
        .then(function (data) { setToken(data.token); window.location.href = 'sales.html'; })
        .catch(function (err) {
          showError(err.message || 'Sign-in failed.');
          verifyBtn.disabled = false; verifyBtn.textContent = 'Sign in';
        });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (stage === 'email') requestCode(); else verify();
    });

    document.getElementById('resendLink').addEventListener('click', function (e) {
      e.preventDefault(); requestCode();
    });

    document.getElementById('changeLink').addEventListener('click', function (e) {
      e.preventDefault();
      clearError();
      stage = 'email';
      stepCode.hidden = true;
      stepEmail.hidden = false;
      emailInput.focus();
    });
  </script>
</body>
</html>
