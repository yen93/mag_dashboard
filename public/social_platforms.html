<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Platforms — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Social Platforms — live multi-platform dashboard following
       the per-platform toggle designs and DESIGN_GUIDE.md.
       ============================================================ */
    :root {
      --sp-accent: var(--accent);
      --sp-accent-2: #6a4bf5;
      --sp-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --sp-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
    }
    html[data-theme='dark'] {
      --sp-accent-2: #9b7dff;
      --sp-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --sp-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
    }

    /* Full-width layout matching sibling Marketing pages (DESIGN_GUIDE §3) */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Sticky controls bar (DESIGN_GUIDE §4) */
    #spControls {
      position: sticky;
      top: var(--topbar-h, 58px);
      z-index: 9;
      margin-bottom: 16px;
      border-radius: 16px;
      box-shadow: var(--sp-shadow);
    }
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--sp-accent), var(--sp-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--sp-accent) 60%, transparent);
    }

    /* Context subtitle under controls */
    .sp-context-line {
      font-size: 13.5px;
      color: var(--text-muted);
      margin: 4px 2px 14px;
      line-height: 1.5;
    }
    .sp-context-line strong { color: var(--text); font-weight: 700; }

    /* KPI cards row (auto-fit, 6 or 7 tiles) */
    .sp-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5rem), 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .sp-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px 14px;
      box-shadow: var(--sp-shadow);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .sp-kpi:hover, .sp-kpi:focus-within {
      transform: translateY(-2px);
      box-shadow: var(--sp-shadow-lift);
      position: relative;
      z-index: 40;
    }
    .sp-kpi .label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.3;
    }
    .sp-kpi .value {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin: 8px 0 4px;
      color: var(--text);
      line-height: 1.15;
    }
    .sp-kpi .delta { font-size: 12px; font-weight: 600; color: var(--text-muted); line-height: 1.35; }
    .sp-kpi .delta.pos { color: var(--pos); }
    .sp-kpi .delta.neg { color: var(--neg); }

    /* Cards grid */
    .sp-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 900px) {
      .sp-grid { grid-template-columns: 1fr; }
    }
    .sp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--sp-shadow);
      display: flex;
      flex-direction: column;
    }
    .sp-card.wide { grid-column: 1 / -1; }
    .sp-card-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sp-card-head h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sp-card-head .spacer { flex: 1; }
    .sp-card .cap { font-size: 12px; color: var(--text-muted); margin: -6px 0 12px; line-height: 1.45; }

    .sp-chart-box { position: relative; flex: 1; width: 100%; }
    .sp-chart-box.h-sm { height: 180px; }
    .sp-chart-box.h-md { height: 230px; }
    .sp-chart-box.h-lg { height: 270px; }

    /* Status pills */
    .sp-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--pos) 14%, transparent);
      color: var(--pos);
    }
    .sp-live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pos); }
    .sp-tag-pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* Platform Analytics sub-sections & mini-metric boxes (LinkedIn / Meta Business Suite) */
    .sp-subsec-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sp-subsec-title:first-of-type { margin-top: 2px; }
    .sp-mini-grid {
      display: grid;
      gap: 12px;
    }
    .sp-mini-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sp-mini-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sp-mini-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .sp-mini-grid.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    @media (max-width: 1100px) {
      .sp-mini-grid.cols-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .sp-mini-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .sp-mini-grid.cols-6, .sp-mini-grid.cols-4, .sp-mini-grid.cols-3, .sp-mini-grid.cols-2 {
        grid-template-columns: 1fr;
      }
    }
    .sp-mini-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sp-mini-box .m-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sp-mini-box .m-val {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.2;
      margin-top: 2px;
    }
    .sp-mini-box .m-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .sp-mini-box .m-sub.pos { color: var(--pos); font-weight: 600; }
    .sp-mini-box .m-sub.neg { color: var(--neg); font-weight: 600; }
    .sp-spark { height: 42px; width: 100%; margin-top: 6px; position: relative; }

    /* Horizontal bar rows (Follows vs unfollows summary, Discovery, Device split) */
    .sp-bar-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .sp-bar-row {
      display: grid;
      grid-template-columns: minmax(90px, 140px) 1fr minmax(48px, auto);
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .sp-bar-row .b-lbl { color: var(--text); font-weight: 500; }
    .sp-bar-row .b-track {
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .sp-bar-row .b-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--text);
    }
    .sp-bar-row .b-fill.muted { background: var(--text-muted); }
    .sp-bar-row .b-fill.accent { background: var(--sp-accent); }
    .sp-bar-row .b-val {
      text-align: right;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .sp-bar-row .b-val.pos { color: var(--pos); }
    .sp-bar-row .b-val.neg { color: var(--neg); }

    /* Presentation tables (By account) */
    .sp-table-wrap { overflow-x: auto; }
    table.sp-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 580px; }
    table.sp-table th, table.sp-table td {
      padding: 11px 10px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    table.sp-table th:first-child, table.sp-table td:first-child { text-align: left; padding-left: 6px; }
    table.sp-table thead th {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
      background: var(--surface-2);
    }
    table.sp-table tbody td { font-variant-numeric: tabular-nums; color: var(--text); }
    table.sp-table tbody td:first-child { font-weight: 600; }
    table.sp-table tbody tr.clickrow { cursor: pointer; transition: background .14s ease; }
    table.sp-table tbody tr.clickrow:hover { background: var(--surface-2); }
    table.sp-table tr.total td {
      border-top: 2px solid var(--border);
      border-bottom: none;
      font-weight: 700;
      background: var(--surface-2);
    }
    table.sp-table td.pos { color: var(--pos); font-weight: 600; }
    table.sp-table td.neg { color: var(--neg); font-weight: 600; }

    /* Audience sub-grid inside "Audience — who follows us" */
    .sp-aud-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 6px;
    }
    @media (max-width: 860px) {
      .sp-aud-grid { grid-template-columns: 1fr; }
    }
    .sp-subcard {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
    }
    .sp-subcard-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    /* Post link styling */
    .sp-post-link { color: var(--text); text-decoration: none; font-weight: 500; }
    .sp-post-link:hover { color: var(--sp-accent); text-decoration: underline; }
    .sp-plat-chip { font-size: 12px; color: var(--text-muted); }

    /* Pending callout box inside cards */
    .sp-pending-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      min-height: 110px;
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .sp-pending-box strong { color: var(--text); font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
    <a class="tab" href="builds_monitoring.html">AI &amp; Automation</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Sticky Controls Bar -->
      <div class="card" id="spControls">
        <div class="mkt-controls" id="platformControls">
          <span class="ctl-label">Platform</span>
          <div class="segmented" id="platformSeg" aria-label="Social platform">
            <button type="button" class="active" data-platform="all">All accounts</button>
            <button type="button" data-platform="james-linkedin">James's LinkedIn</button>
            <button type="button" data-platform="mag-linkedin">MAG LinkedIn</button>
            <button type="button" data-platform="facebook">Facebook</button>
            <button type="button" data-platform="instagram">Instagram</button>
          </div>
        </div>
        <div class="mkt-controls" id="fyControls" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border)">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg" aria-label="Financial year">
            <button type="button" data-fy="all">All</button>
            <button type="button" data-fy="fy22">FY22</button>
            <button type="button" data-fy="fy23">FY23</button>
            <button type="button" data-fy="fy24">FY24</button>
            <button type="button" data-fy="fy25">FY25</button>
            <button type="button" data-fy="fy26">FY26</button>
            <button type="button" class="active" data-fy="fy27">FY27</button>
          </div>
          <span class="ctl-label" style="margin-left:4px">Compare</span>
          <div class="segmented" id="cmpSeg" aria-label="Comparison basis">
            <button type="button" class="active" data-cmp="yoy">vs last year</button>
            <button type="button" data-cmp="prev">vs previous period</button>
          </div>
          <span class="muted" id="cmpRange" style="font-size:12.5px"></span>
          <div class="spacer" style="flex:1"></div>
        </div>
      </div>

      <!-- Dynamic active platform view -->
      <div id="spViewRoot"></div>
    </main>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=30"></script>
  <script>
    (function () {
      'use strict';

      var PAL = PALETTE; // [blue, purple, green, amber, red]
      var _charts = {};
      var CURRENT_PLATFORM = 'all';
      var CURRENT_FY = 'fy27';
      var CURRENT_CMP = 'yoy';

      // Live state loaded from backend endpoints (null = not loaded / unavailable)
      var LIVE = {
        loaded: false,
        metaFb: null,        // { facebook, instagram }
        platforms: [],       // rows from /api/marketing/platforms
        content: {},         // map from /api/marketing/content-metrics
        audience: null,      // /api/marketing/social-audience
        igTrend: [],         // /api/marketing/meta-ig-trend
        fbTrend: [],         // /api/marketing/meta-fb-trend
        igDemo: null,        // { ageGender, locations }
        topPosts: []         // /api/marketing/meta-top-posts
      };

      var PENDING_CHIP = '<span class="chip warn">pending</span>';
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      function destroyCharts() {
        Object.keys(_charts).forEach(function (k) {
          if (_charts[k]) {
            _charts[k].destroy();
            _charts[k] = null;
          }
        });
      }

      function snapT(d) { return Date.parse(d + 'T00:00:00Z'); }
      function snapFmt(d) {
        if (!d) return '';
        var p = d.split('-');
        return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0];
      }
      function monthLbl(ym) {
        if (!ym) return '';
        var p = ym.split('-');
        return MONTHS[+p[1] - 1] + ' ' + p[0].slice(2);
      }
      function fmtPct(v, dp) {
        if (v == null || isNaN(v)) return null;
        return Number(v).toFixed(dp == null ? 1 : dp) + '%';
      }
      function fmtCompact(n) {
        if (n == null || isNaN(n)) return '—';
        if (Math.abs(n) >= 10000) return (n / 1000).toFixed(1) + 'K';
        if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1) + 'K';
        return fmt(n, 'count');
      }

      // ── Data accessors (FY-aware) ───────────────────────────────────────────
      function selectedFyEnd() {
        if (!CURRENT_FY || CURRENT_FY === 'all') return null;
        var m = CURRENT_FY.match(/^fy(\d{2})$/i);
        return m ? 2000 + parseInt(m[1], 10) : null;
      }

      function platformRow(key) {
        var fy = selectedFyEnd();
        var rows = (LIVE.platforms || []).filter(function (r) { return r.platformKey === key; });
        if (fy != null) {
          var fyRows = rows.filter(function (r) { return r.fyEnd === fy; });
          rows = fyRows;
        }
        if (!rows.length) return null;
        return rows.slice().sort(function (a, b) {
          return (b.fyEnd || 0) - (a.fyEnd || 0) || String(b.snapshotDate).localeCompare(String(a.snapshotDate));
        })[0];
      }

      function platformHistory(key) {
        var bp = LIVE.audience && LIVE.audience.byPlatform && LIVE.audience.byPlatform[key];
        return bp || null;
      }

      // Is the selected FY the current live FY or All? (Meta Graph API endpoints are live current-window)
      function isLiveWindowFy() {
        return CURRENT_FY === 'all' || CURRENT_FY === 'fy27';
      }

      // Live summary per account
      function accountStats(key) {
        var pRow = platformRow(key);
        var hist = platformHistory(key);
        var useMeta = isLiveWindowFy();
        var fb = useMeta && LIVE.metaFb && LIVE.metaFb.facebook;
        var ig = useMeta && LIVE.metaFb && LIVE.metaFb.instagram;

        var followers = pRow ? pRow.followers : null;
        var posts = pRow ? pRow.posts : null;
        var engagements = pRow ? pRow.totalEngagement : null;
        var seen = null;
        var engRate = pRow ? pRow.engagementRate : null;
        var netNew = hist ? hist.netNew : null;
        var netNewRate = hist ? hist.netNewRate : null;

        if (key === 'mag_facebook' && fb) {
          if (fb.followers != null) followers = fb.followers;
          if (fb.views28d != null) seen = fb.views28d;
          if (fb.postEngagements28d != null) engagements = fb.postEngagements28d;
          if (fb.newFollows28d != null && netNew == null) {
            netNew = fb.newFollows28d;
            netNewRate = followers > 0 ? Math.round((netNew / followers) * 1000) / 10 : null;
          }
          if (engagements != null && seen > 0) {
            engRate = Math.round((engagements / seen) * 1000) / 10;
          }
        } else if (key === 'mag_instagram' && ig) {
          if (ig.followers != null) followers = ig.followers;
          if (ig.reach28d != null) seen = ig.reach28d;
          if (ig.recentEngagement != null) engagements = ig.recentEngagement;
          if (ig.recentPosts != null && posts == null) posts = ig.recentPosts;
          if (engagements != null && seen > 0) {
            engRate = Math.round((engagements / seen) * 1000) / 10;
          }
        }

        return {
          key: key,
          followers: followers,
          posts: posts,
          engagements: engagements,
          seen: seen,
          engRate: engRate,
          netNew: netNew,
          netNewRate: netNewRate,
          snaps: hist ? hist.snaps : [],
          snapshotDate: pRow ? pRow.snapshotDate : null
        };
      }

      // Snapshot comparison helpers
      function yearAgoSnap(snaps, d) {
        var target = snapT(d) - 365 * 86400000;
        var best = null, bestGap = 21 * 86400000 + 1;
        (snaps || []).forEach(function (s) {
          var gap = Math.abs(snapT(s.d) - target);
          if (snapT(s.d) < snapT(d) && gap < bestGap) { best = s; bestGap = gap; }
        });
        return best;
      }

      function snapPair(snaps, latest, prior) {
        if (!latest) return { latest: null, base: null };
        if (CURRENT_CMP === 'prev') return { latest: latest, base: prior || null };
        return { latest: latest, base: yearAgoSnap(snaps, latest.d) };
      }

      function cmpLabel() {
        return CURRENT_CMP === 'prev' ? 'vs prior period' : 'vs last yr';
      }

      function updateCmpRange() {
        var el = document.getElementById('cmpRange');
        if (!el) return;
        var aud = LIVE.audience;
        if (!aud || !aud.latest) {
          el.textContent = '';
          return;
        }
        var p = snapPair(aud.snaps, aud.latest, aud.prior);
        if (!p.base) {
          el.textContent = 'Latest snapshot ' + snapFmt(p.latest.d) + ' · no ' + (CURRENT_CMP === 'prev' ? 'earlier' : 'year-ago') + ' snapshot yet';
        } else {
          el.textContent = 'Showing ' + snapFmt(p.latest.d) + ' · vs ' + snapFmt(p.base.d);
        }
      }

      function deltaHtmlFromPair(latestVal, baseVal) {
        if (latestVal == null) return '';
        if (baseVal == null) {
          return '<div class="delta">No ' + (CURRENT_CMP === 'prev' ? 'prior-period' : 'year-ago') + ' data yet</div>';
        }
        var diff = latestVal - baseVal;
        if (diff === 0) return '<div class="delta">No change ' + esc(cmpLabel()) + '</div>';
        var pct = baseVal > 0 ? Math.abs((diff / baseVal) * 100).toFixed(1) + '%' : fmt(Math.abs(diff), 'count');
        return '<div class="delta ' + (diff > 0 ? 'pos' : 'neg') + '">' +
          (diff > 0 ? '▲ ' : '▼ ') + pct + ' ' + esc(cmpLabel()) + '</div>';
      }

      // ── Shared UI builders ──────────────────────────────────────────────────
      function kpiTile(label, valHtml, subHtml, info, src) {
        return '<div class="sp-kpi">' +
          '<div class="label"><span>' + esc(label) + '</span>' + infoTip(info, src) + '</div>' +
          '<div class="value">' + valHtml + '</div>' +
          (subHtml || '') +
        '</div>';
      }

      function pendingBox(title, body) {

      function fmtNetNewCell(net, rate) {
        if (net == null) return PENDING_CHIP;
        var sign = net > 0 ? '+' : '';
        var cls = net > 0 ? 'pos' : (net < 0 ? 'neg' : '');
        var rateStr = rate != null ? ' (' + rate.toFixed(1) + '%)' : '';
        return '<span class="' + cls + '">' + sign + fmt(net, 'count') + rateStr + '</span>';
      }

      function drawAgeGenderPyramid(canvasId, rows) {
        var el = document.getElementById(canvasId);
        if (!el || !rows || !rows.length) return;
        var tc = themeColors();
        var total = rows.reduce(function (s, r) { return s + (r.female || 0) + (r.male || 0); }, 0) || 1;
        var pctRows = rows.map(function (r) {
          return {
            age: r.age,
            f: Math.round(((r.female || 0) / total) * 1000) / 10,
            m: Math.round(((r.male || 0) / total) * 1000) / 10
          };
        });
        _charts[canvasId] = new Chart(el.getContext('2d'), {
          type: 'bar',
          data: {
            labels: pctRows.map(function (r) { return r.age; }),
            datasets: [
              { label: 'Women', data: pctRows.map(function (r) { return -r.f; }), backgroundColor: PAL[2], borderRadius: 3, maxBarThickness: 18, stack: 'ag' },
              { label: 'Men',   data: pctRows.map(function (r) { return r.m; }),  backgroundColor: PAL[0], borderRadius: 3, maxBarThickness: 18, stack: 'ag' }
            ]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { stacked: true, grid: { color: tc.grid }, ticks: { color: tc.muted, font: { size: 11 }, callback: function (v) { return Math.abs(v) + '%'; } } },
              y: { stacked: true, grid: { display: false }, ticks: { color: tc.text, font: { size: 12 } } }
            },
            plugins: {
              legend: { display: true, position: 'bottom', labels: { color: tc.muted, font: { size: 11 }, boxWidth: 12, usePointStyle: true } },
              tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + Math.abs(c.parsed.x) + '% of audience'; } } }

      // Reusable sortable Top Posts table (DESIGN_GUIDE §7)
      function mountTopPostsTable(hostId, posts) {
        var host = document.getElementById(hostId);
        if (!host) return;
        if (!posts || !posts.length) {
          host.innerHTML = pendingBox('Top posts not connected for this view', 'Individual post metrics will appear here once this platform\'s post-level feed is connected.');
          return;
        }
        var rows = posts.map(function (p) {
          var rate = (p.reach && p.reach > 0 && p.interactions != null)
            ? Math.round((p.interactions / p.reach) * 1000) / 10
            : null;
          return {
            post: p.post,
            url: p.url,
            account: p.platform || 'Instagram',
            type: p.type || '—',
            seen: p.reach,
            eng: p.interactions,
            engRate: rate,
            linkClicks: null
          };
        });
        renderSortableTable(hostId, [
          {
            key: 'post',
            label: 'Post',
            unit: 'text',
            render: function (v, r) {
              return r.url
                ? '<a class="sp-post-link" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(v) + '</a>'
                : esc(v);
            },
            text: function (v) { return v || ''; }
          },
          { key: 'account', label: 'Account', unit: 'text' },
          { key: 'type', label: 'Type', unit: 'text' },
          { key: 'seen', label: 'Seen', unit: 'count', render: function (v) { return v == null ? PENDING_CHIP : fmt(v, 'count'); } },
          { key: 'eng', label: 'Eng.', unit: 'count' },
          { key: 'engRate', label: 'Eng. rate', unit: 'percent', render: function (v) { return v == null ? '—' : v.toFixed(1) + '%'; } },
          { key: 'linkClicks', label: 'Link clicks', unit: 'text', render: function () { return '—'; }, text: function () { return ''; } }
        ], rows, { search: false, defaultSort: { key: 'eng', dir: 'desc' } });
      }

            '<div class="sp-card wide">' +
              '<div class="sp-card-head">' +
                '<h3>Audience — who follows us ' + infoTip('Lifetime demographic snapshot of current Instagram followers by age, gender and top cities.', 'Instagram Business Insights (Meta)') + '</h3>' +
                '<span class="sp-tag-pill">Quarterly</span>' +
                ((hasAgeGender || hasLocations) ? '<span class="sp-live-pill"><span class="dot"></span>Live · Meta</span>' : PENDING_CHIP) +
              '</div>' +
              '<div class="sp-aud-grid">' +
                '<div class="sp-subcard">' +
                  '<div class="sp-subcard-head">Age &amp; gender ' + infoTip('Share of Instagram followers by age bracket and gender (women left, men right). Excludes undeclared gender.', 'Instagram Business Insights (Meta)') + '</div>' +
                  (hasAgeGender ? '<div class="sp-chart-box h-md"><canvas id="igAgeGenderChart"></canvas></div>' : pendingBox('', 'Instagram age & gender demographics not loaded yet.')) +
                '</div>' +
                '<div class="sp-subcard">' +
                  '<div class="sp-subcard-head">Top locations ' + infoTip('Top cities where Instagram followers are based, as a share of the located audience.', 'Instagram Business Insights (Meta)') + '</div>' +
                  (hasLocations ? '<div class="sp-chart-box h-md"><canvas id="igLocationsChart"></canvas></div>' : pendingBox('', 'Instagram city demographics not loaded yet.')) +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';

        drawFollowersLine('igFollowersChart', st.snaps);
        if (igTrend.length >= 2) {
          var labels = igTrend.map(function (r) { return monthLbl(r.month); });
          drawSparkline('igReachSpark', labels, igTrend.map(function (r) { return r.reach; }), PAL[0]);
          drawSparkline('igInterSpark', labels, igTrend.map(function (r) { return r.interactions; }), PAL[2]);
        }
        mountTopPostsTable('igTopPostsHost', isLiveWindowFy() ? LIVE.topPosts : []);
        if (hasAgeGender) drawAgeGenderPyramid('igAgeGenderChart', demo.ageGender);
        if (hasLocations) {
          drawHbar(
            'igLocationsChart',
            demo.locations.map(function (r) { return r.place; }),
            demo.locations.map(function (r) { return r.share; }),
            { color: PAL[0], pct: true }
          );
        }
      }

      // ── Router & Controls ───────────────────────────────────────────────────
      function renderActiveView() {
        destroyCharts();
        updateCmpRange();
        if (CURRENT_PLATFORM === 'all') renderAllAccounts();
        else if (CURRENT_PLATFORM === 'james-linkedin') renderJamesLinkedin();
        else if (CURRENT_PLATFORM === 'mag-linkedin') renderMagLinkedin();
        else if (CURRENT_PLATFORM === 'facebook') renderFacebook();
        else if (CURRENT_PLATFORM === 'instagram') renderInstagram();
      }

      function setPlatform(platform) {
        CURRENT_PLATFORM = platform;
        var seg = document.getElementById('platformSeg');
        if (seg) {
          seg.querySelectorAll('button').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-platform') === platform);
          });
        }
        renderActiveView();
      }

      function wireControls() {
        var pSeg = document.getElementById('platformSeg');
        if (pSeg) {
          pSeg.querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function () { setPlatform(b.getAttribute('data-platform')); });
          });
        }
        var fySeg = document.getElementById('fySeg');
        if (fySeg) {
          fySeg.querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function () {
              fySeg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
              b.classList.add('active');
              CURRENT_FY = b.getAttribute('data-fy');
              renderActiveView();
            });
          });
        }
        var cmpSeg = document.getElementById('cmpSeg');
        if (cmpSeg) {
          cmpSeg.querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function () {
              cmpSeg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
              b.classList.add('active');
              CURRENT_CMP = b.getAttribute('data-cmp');
              renderActiveView();
            });
          });
        }
      }

      // ── Load all live endpoints in parallel ─────────────────────────────────
      function loadAllLiveData() {
        function safeFetch(url, onOk) {
          return fetchJSON(url).then(function (res) {
            if (res) {
              onOk(res);
              renderActiveView();
            }
          }).catch(function () { /* keep pending on error */ });
        }

        safeFetch('/api/marketing/social-audience', function (res) { LIVE.audience = res; });
        safeFetch('/api/marketing/platforms', function (res) { LIVE.platforms = (res && res.data) || []; });
        safeFetch('/api/marketing/content-metrics', function (res) { LIVE.content = (res && res.data) || {}; });
        safeFetch('/api/marketing/meta-fb', function (res) { LIVE.metaFb = res; });
        safeFetch('/api/marketing/meta-ig-trend', function (res) { LIVE.igTrend = (res && res.data) || []; });
        safeFetch('/api/marketing/meta-fb-trend', function (res) { LIVE.fbTrend = (res && res.data) || []; });
        safeFetch('/api/marketing/meta-ig-demographics', function (res) { LIVE.igDemo = res; });
        safeFetch('/api/marketing/meta-top-posts', function (res) { LIVE.topPosts = (res && res.data) || []; });
      }

      // ── Bootstrap ───────────────────────────────────────────────────────────
      initPage('marketing');
      renderMarketingHead(true);          // No "Sample data — layout only" chip on any toggle
      renderMarketingSidebar('social-platforms');
      wireControls();
      renderActiveView();                 // Initial render (shows pending chips cleanly until live calls resolve)
      loadAllLiveData();
      window.onThemeChange = renderActiveView;
    })();
  </script>
</body>
</html>
