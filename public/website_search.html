<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website &amp; Search — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Website & Search — bespoke visual layer following
       DESIGN_GUIDE.md and marketing.html. Mock data only.
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
      --ws-badge-bg: #faefd7;
      --ws-badge-text: #8a4b0f;
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
      --ws-badge-bg: color-mix(in srgb, #f0a63b 20%, transparent);
      --ws-badge-text: #f3b359;
    }

    /* Full-width layout matching marketing.html / content_social.html / email_partners.html */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards */
    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }

    /* Controls bar + segmented toggles (same as marketing.html) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* Top row: 5 KPI cards */
    .ws-top-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    @media (max-width: 1080px) {
      .ws-top-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .ws-top-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .ws-top-grid { grid-template-columns: 1fr; }
    }

    /* Second row: 3 KPI cards */
    .ws-bottom-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0 0;
    }
    @media (max-width: 860px) {
      .ws-bottom-grid { grid-template-columns: 1fr; }
    }

    /* Shared KPI tile styling matching the attached screenshot */
    .ws-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--mkt-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .ws-kpi:hover {
      transform: translateY(-2px);
      box-shadow: var(--mkt-shadow-lift);
    }
    .ws-kpi .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .ws-kpi .value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin: 10px 0 8px;
      color: var(--text);
      line-height: 1.15;
    }
    .ws-kpi .badge-wrap {
      margin: 12px 0 10px;
    }
    .ws-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--ws-badge-bg);
      color: var(--ws-badge-text);
      line-height: 1.2;
    }
    .ws-kpi .sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .ws-kpi .sub.pos {
      color: var(--pos);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar (same per-FY top toggle filter as marketing.html) -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
          <div class="spacer" style="flex:1"></div>
          <span class="muted" id="fyNote" style="font-size:13px">Website form enquiries are a rolling ~60-day GA4 window</span>
        </div>
      </div>

      <!-- Row 1: 5 KPI cards -->
      <div class="ws-top-grid" id="wsTopKpis"></div>

      <!-- Row 2: 3 KPI cards -->
      <div class="ws-bottom-grid" id="wsBottomKpis"></div>
    </main>
  </div>

  <script src="app.js?v=11"></script>
  <script>
    /* Website & Search — PARTIALLY LIVE.
       The only website-traffic data in Supabase is public.ga4_events_staging, a
       rolling ~60-day window of GA4 *conversion* events (form submits). There are
       NO pageview/session rows, so true "sessions" can't be shown here — those,
       plus AI-tool visits, Google reviews and phone enquiries, render as a red
       "pending" chip (design-guide standard) rather than a fabricated number.
       LIVE from /api/marketing/website-search: website form enquiries (total +
       organic + paid-search), computed at request time from the GA4 events.

       The GA4 window is rolling (~60 days, all within FY27), so it is NOT
       FY-sliceable: the live cards fill only for FY27 / All years and show "—"
       with a note under the older FYs (same behaviour as Content & Social). */

    // Card models. kind:'live' pulls from the fetched payload by `key`; kind:'pending'
    // always shows the pending chip. No fabricated sample numbers remain.
    var TOP_CARDS = [
      { label: 'Website sessions',          kind: 'pending' },
      { label: 'Organic search sessions',   kind: 'pending' },
      { label: 'Website form enquiries',    kind: 'live', key: 'total',
        sub: function (w) { return w ? ('Rolling GA4 window · ' + w.start + ' → ' + w.end) : 'Rolling ~60-day GA4 window'; } },
      { label: 'Organic form enquiries',    kind: 'live', key: 'organic',
        sub: function () { return 'Medium = organic'; } },
      { label: 'Paid-search form enquiries', kind: 'live', key: 'cpc',
        sub: function () { return 'Medium = cpc (Google / Bing)'; } }
    ];
    var BOTTOM_CARDS = [
      { label: 'Visits from AI tools', kind: 'pending' },
      { label: 'New Google reviews',  kind: 'pending' },
      { label: 'Phone enquiries',     kind: 'pending' }
    ];

    var WS = null;        // live payload once fetched (null = loading, false = failed)

    function selFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }

    // The GA4 window sits entirely in FY27, so the live cards only have data to show
    // for FY27 or "All years"; under the older FYs they render "—" + a note.
    function fyHasGa4Window() {
      var k = selFyKey();
      return k === 'fy27' || k === 'all';
    }

    function fmtNum(n) {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString();
    }

    // A single KPI card. Pending → red "pending" chip. Live → number + sub (or, when the
    // selected FY has no GA4 window, a dash + note instead of a fabricated figure).
    function cardHtml(c) {
      var label = '<div class="label">' + esc(c.label) + '</div>';
      if (c.kind === 'pending') {
        return '<article class="ws-kpi">' + label +
          '<div class="value" style="margin-top:14px"><span class="chip warn">pending</span></div>' +
          '<div class="sub">Not tracked in the dashboard yet</div>' +
        '</article>';
      }
      // live
      if (WS === false) {
        return '<article class="ws-kpi">' + label +
          '<div class="value">—</div>' +
          '<div class="sub">Couldn’t load live data</div>' +
        '</article>';
      }
      if (WS === null) {
        return '<article class="ws-kpi">' + label +
          '<div class="value">…</div><div class="sub">Loading…</div>' +
        '</article>';
      }
      if (!fyHasGa4Window()) {
        return '<article class="ws-kpi">' + label +
          '<div class="value">—</div>' +
          '<div class="sub">No GA4 history — rolling ~60-day window</div>' +
        '</article>';
      }
      var val = WS.enquiries ? WS.enquiries[c.key] : null;
      var sub = typeof c.sub === 'function' ? c.sub(WS.window) : (c.sub || '');
      return '<article class="ws-kpi">' + label +
        '<div class="value">' + esc(fmtNum(val)) + '</div>' +
        '<div class="sub">' + esc(sub) + '</div>' +
      '</article>';
    }

    function renderAll() {
      document.getElementById('wsTopKpis').innerHTML = TOP_CARDS.map(cardHtml).join('');
      document.getElementById('wsBottomKpis').innerHTML = BOTTOM_CARDS.map(cardHtml).join('');
      // Reflect the real GA4 window in the FY note once loaded.
      var note = document.getElementById('fyNote');
      if (note && WS && WS.window && WS.window.start) {
        note.textContent = 'Website form enquiries: live GA4 window ' + WS.window.start + ' → ' + WS.window.end + ' (rolling ~60 days)';
      }
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    initPage('marketing');
    renderMarketingHead(true);        // partially live (form enquiries) → no "Sample data" badge
    renderMarketingSidebar('website-search');
    renderAll();                      // initial render (loading state)
    wireSeg('fySeg', renderAll);

    // Load the live website form-enquiry figures.
    fetchJSON('/api/marketing/website-search')
      .then(function (d) { WS = d || false; renderAll(); })
      .catch(function () { WS = false; renderAll(); });
  </script>
</body>
</html>
