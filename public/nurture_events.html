<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurture &amp; Events — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Nurture & Events — bespoke visual layer following
       DESIGN_GUIDE.md and marketing.html. Mock data only.
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
    }

    /* Full-width layout matching marketing.html / content_social.html / email_partners.html */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards */
    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .card-head.block-head {
      display: block;
      margin-bottom: 14px;
    }
    .card-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .chart-cap {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Controls bar + segmented toggles (same as marketing.html) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* Top 4 KPI cards */
    .ne-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0 12px;
    }
    @media (max-width: 960px) {
      .ne-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      .ne-kpi-grid { grid-template-columns: 1fr; }
    }
    .ne-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--mkt-shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .ne-kpi:hover {
      transform: translateY(-2px);
      box-shadow: var(--mkt-shadow-lift);
    }
    .ne-kpi .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .ne-kpi .value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin: 8px 0 6px;
      color: var(--text);
    }
    .ne-kpi .sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .ne-kpi .sub.pos {
      color: var(--pos);
    }

    /* Mid note between KPI cards and Executive X table */
    .ne-midnote {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Executive X table card */
    .ne-events-card {
      padding: 22px 24px;
    }
    .ne-table-wrap {
      overflow-x: auto;
    }
    table.ne-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 720px;
    }
    table.ne-table th,
    table.ne-table td {
      padding: 12px 10px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    table.ne-table th:first-child,
    table.ne-table td:first-child {
      text-align: left;
      padding-left: 4px;
    }
    table.ne-table th:last-child,
    table.ne-table td:last-child {
      padding-right: 4px;
    }
    table.ne-table thead th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding-top: 6px;
      padding-bottom: 10px;
    }
    table.ne-table tbody td {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar (same per-FY top toggle filter as marketing.html) -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
          <div class="spacer" style="flex:1"></div>
          <!-- <span class="muted" id="fyNote" style="font-size:13px">Data through October 2026 · October provisional until 8 November</span> -->
        </div>
      </div>

      <!-- Top 4 KPI cards -->
      <div class="ne-kpi-grid" id="neKpis"></div>

      <!-- Note between KPIs and Executive X card -->
      <p class="ne-midnote">Reported separately — not added to marketing revenue.</p>

      <!-- Executive X table card -->
      <div class="card ne-events-card">
        <div class="card-head block-head">
          <h3 id="eventsHeading">Executive X</h3>
          <div class="chart-cap" id="eventsCap">One row per Executive X session · source: Executive X ROI Report (Google Sheet)</div>
        </div>
        <div class="ne-table-wrap" tabindex="0" role="region" aria-labelledby="eventsHeading">
          <table class="ne-table">
            <thead>
              <tr>
                <th>Session</th>
                <th>Internal cost</th>
                <th>Attendees</th>
                <th>Cost per attendee</th>
                <th>Bookings</th>
                <th>Revenue</th>
                <th>Return</th>
              </tr>
            </thead>
            <tbody id="eventsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js?v=11"></script>
  <script>
    /* Nurture & Events.
       The TOP 4 KPI CARDS are LIVE + FY-aware (GET /api/marketing/nurture-events):
         1. Past keynote clients in nurture  = WON pipeline-3 deals (activecampaign_deals)
         2. Offsite enquiries from past clients = ALL pipeline-17 deals (post_conference_deals)
         3. Offsites booked by past clients   = WON pipeline-17 deals (post_conference_deals)
         4. Keynote → Offsite conversion      = card 3 ÷ card 1 (computed client-side)
       The Executive X table below is still SAMPLE data (page keeps its "Sample data" badge). */

    // ---- Live KPI state ------------------------------------------------------
    var NE_LIVE = null;        // { byFy:[{fyEnd,fy,keynoteClients,offsiteEnquiries,offsiteBooked}], total }
    var NE_ERR  = false;

    function selFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }

    // The live card figures for the selected FY ('all' → the roll-up total).
    function neSel() {
      if (!NE_LIVE) return null;
      var key = selFyKey();
      if (key === 'all') return NE_LIVE.total;
      var end = 2000 + parseInt(key.slice(2), 10);           // 'fy27' → 2027
      var row = (NE_LIVE.byFy || []).find(function (r) { return r.fyEnd === end; });
      return row || { keynoteClients: 0, offsiteEnquiries: 0, offsiteBooked: 0 };
    }

    function numFmt(n) { return (Number(n) || 0).toLocaleString('en-AU'); }

    function renderKpiRow() {
      var cards;
      if (NE_ERR) {
        var errSub = 'Could not load';
        cards = [
          { label: 'Past keynote clients in nurture',     value: '—', sub: errSub },
          { label: 'Offsite enquiries from past clients', value: '—', sub: errSub },
          { label: 'Offsites booked by past clients',     value: '—', sub: errSub },
          { label: 'Keynote → Offsite conversion',        value: '—', sub: errSub }
        ];
      } else if (!NE_LIVE) {
        cards = [
          { label: 'Past keynote clients in nurture',     value: '—', sub: 'Loading…' },
          { label: 'Offsite enquiries from past clients', value: '—', sub: 'Loading…' },
          { label: 'Offsites booked by past clients',     value: '—', sub: 'Loading…' },
          { label: 'Keynote → Offsite conversion',        value: '—', sub: 'Loading…' }
        ];
      } else {
        var d = neSel();
        var hasKey = d.keynoteClients > 0;
        var ratio = hasKey ? Math.round((d.offsiteBooked / d.keynoteClients) * 100) + '%' : '—';
        cards = [
          { label: 'Past keynote clients in nurture',     value: numFmt(d.keynoteClients),   sub: 'Won keynote deals · Keynotes/Workshops/Immersive (LIV)', pos: true },
          { label: 'Offsite enquiries from past clients', value: numFmt(d.offsiteEnquiries), sub: 'All deals · Trojan Horse: Post-Conf',                     pos: true },
          { label: 'Offsites booked by past clients',     value: numFmt(d.offsiteBooked),    sub: 'Won deals · Trojan Horse: Post-Conf',                     pos: true },
          { label: 'Keynote → Offsite conversion',        value: ratio,
            sub: hasKey ? (numFmt(d.offsiteBooked) + ' of ' + numFmt(d.keynoteClients) + ' keynote clients') : 'No keynote clients in period', pos: hasKey }
        ];
      }
      var html = cards.map(function (k) {
        var subCls = k.pos ? 'sub pos' : 'sub';
        return '<div class="ne-kpi">' +
          '<div class="label">' + esc(k.label) + '</div>' +
          '<div class="value">' + esc(k.value) + '</div>' +
          '<div class="' + subCls + '">' + esc(k.sub) + '</div>' +
        '</div>';
      }).join('');
      document.getElementById('neKpis').innerHTML = html;
    }

    function loadLiveCards() {
      fetchJSON('/api/marketing/nurture-events').then(function (d) {
        NE_LIVE = d || { byFy: [], total: { keynoteClients: 0, offsiteEnquiries: 0, offsiteBooked: 0 } };
        NE_ERR = false;
        renderKpiRow();
      }).catch(function () {
        NE_ERR = true;
        renderKpiRow();
      });
    }

    // ---- Executive X table — REAL data, one row per session --------------------
    // Source: "Executive X ROI Report" Google Sheet (one tab per session). Each
    // attendee pays a fixed per-head internal cost; a session's revenue is the sum
    // of bookings its attendees' orgs generated. STATIC — re-seed from the sheet
    // when it changes (the dashboard has no live Google Sheets access).
    // FY = the session's own date (AU FY, Jul–Jun, END-year): Spring = Sep–Nov,
    // Autumn = Mar. Bookings themselves may land in later FYs.
    var EXEC_X = [
      { session: 'Spring 2023', fy: 'fy24', cost: 29940, attendees: 12, perPerson: 2495, bookings: 3, revenue: 48400 },
      { session: 'Autumn 2024', fy: 'fy24', cost: 22455, attendees: 9,  perPerson: 2495, bookings: 3, revenue: 93970 },
      { session: 'Spring 2024', fy: 'fy25', cost: 11000, attendees: 11, perPerson: 1000, bookings: 1, revenue: 4500 },
      { session: 'Autumn 2025', fy: 'fy25', cost: 14066, attendees: 12, perPerson: 1173, bookings: 4, revenue: 111700 },
      { session: 'Spring 2025', fy: 'fy26', cost: 14167, attendees: 13, perPerson: 1090, bookings: 4, revenue: 49950 },
      { session: 'Autumn 2026', fy: 'fy26', cost: 14264, attendees: 10, perPerson: 1426, bookings: 2, revenue: 14500 }
    ];

    function aud(n) { return '$' + (Number(n) || 0).toLocaleString('en-AU'); }

    function execXRows() {
      var key = selFyKey();
      if (key === 'all') return EXEC_X;
      return EXEC_X.filter(function (e) { return e.fy === key; });
    }

    function renderEventsTable() {
      document.getElementById('eventsCap').textContent =
        'One row per Executive X session · source: Executive X ROI Report (Google Sheet)';
      var rows = execXRows();
      if (!rows.length) {
        document.getElementById('eventsBody').innerHTML =
          '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:18px">' +
          'No Executive X sessions in this period.</td></tr>';
        return;
      }
      var rowsHtml = rows.map(function (ev) {
        var ret = ev.cost > 0 ? (ev.revenue / ev.cost).toFixed(1) + '×' : '—';
        return '<tr>' +
          '<td>' + esc(ev.session) + '</td>' +
          '<td>' + esc(aud(ev.cost)) + '</td>' +
          '<td>' + esc(ev.attendees) + '</td>' +
          '<td>' + esc(aud(ev.perPerson)) + '</td>' +
          '<td>' + esc(ev.bookings) + '</td>' +
          '<td>' + esc(aud(ev.revenue)) + '</td>' +
          '<td>' + esc(ret) + '</td>' +
        '</tr>';
      }).join('');
      document.getElementById('eventsBody').innerHTML = rowsHtml;
    }

    function renderAll() {
      renderKpiRow();
      renderEventsTable();
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    initPage('marketing');
    renderMarketingHead(true);
    renderMarketingSidebar('nurture-events');
    renderAll();
    loadLiveCards();
    wireSeg('fySeg', renderAll);
  </script>
</body>
</html>
