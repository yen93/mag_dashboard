<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurture &amp; Events — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    /* ============================================================
       Nurture & Events — bespoke visual layer following
       DESIGN_GUIDE.md and marketing.html. Mock data only.
       ============================================================ */
    :root {
      --mkt-accent: var(--accent);
      --mkt-accent-2: #6a4bf5;
      --mkt-accent-soft: #eef2fe;
      --mkt-shadow:      0 1px 2px rgba(20,30,60,.05), 0 12px 32px -14px rgba(20,30,60,.22);
      --mkt-shadow-lift: 0 1px 2px rgba(20,30,60,.06), 0 20px 44px -18px rgba(20,30,60,.30);
    }
    html[data-theme='dark'] {
      --mkt-accent-2: #9b7dff;
      --mkt-accent-soft: #1b2440;
      --mkt-shadow:      0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.6);
      --mkt-shadow-lift: 0 1px 2px rgba(0,0,0,.5), 0 24px 54px -20px rgba(0,0,0,.72);
    }

    /* Full-width layout matching marketing.html / content_social.html / email_partners.html */
    .content { max-width: none; }
    #marketingNav { max-width: none; }
    .mkt-head { max-width: none; }

    /* Cards */
    .card {
      border-radius: 16px;
      box-shadow: var(--mkt-shadow);
      transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
    }
    .card-head.block-head {
      display: block;
      margin-bottom: 14px;
    }
    .card-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .chart-cap {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Controls bar + segmented toggles (same as marketing.html) */
    .mkt-controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    .ctl-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .segmented { border-radius: 11px; padding: 4px; gap: 2px; flex-wrap: wrap; }
    .segmented button { padding: 7px 14px; border-radius: 8px; transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active {
      background: linear-gradient(135deg, var(--mkt-accent), var(--mkt-accent-2));
      color: #fff;
      box-shadow: 0 5px 14px -4px color-mix(in srgb, var(--mkt-accent) 60%, transparent);
    }

    /* Top 4 KPI cards */
    .ne-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0 12px;
    }
    @media (max-width: 960px) {
      .ne-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      .ne-kpi-grid { grid-template-columns: 1fr; }
    }
    .ne-kpi {
      position: relative;                 /* for the §6 infoTip z-index lift */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--mkt-shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .ne-kpi:hover {
      transform: translateY(-2px);
      box-shadow: var(--mkt-shadow-lift);
    }
    .ne-kpi:hover, .ne-kpi:focus-within { z-index: 2; }  /* keep ⓘ tooltip above neighbours (§6 gotcha) */
    .ne-kpi .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex; align-items: center; gap: 5px;
    }
    .ne-kpi .value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin: 8px 0 6px;
      color: var(--text);
    }
    .ne-kpi .sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .ne-kpi .sub.pos {
      color: var(--pos);
    }

    /* Mid note between KPI cards and Executive X table */
    .ne-midnote {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Executive X table card */
    .ne-events-card {
      padding: 22px 24px;
    }
    .ne-table-wrap {
      overflow-x: auto;
    }
    table.ne-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 720px;
    }
    table.ne-table th,
    table.ne-table td {
      padding: 12px 10px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    table.ne-table th:first-child,
    table.ne-table td:first-child {
      text-align: left;
      padding-left: 4px;
    }
    table.ne-table th:last-child,
    table.ne-table td:last-child {
      padding-right: 4px;
    }
    table.ne-table thead th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding-top: 6px;
      padding-bottom: 10px;
    }
    table.ne-table tbody td {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Clickable KPI cards (first 3) → deal drill-down */
    .ne-kpi.clickable { cursor: pointer; }
    .ne-kpi.clickable:hover {
      border-color: color-mix(in srgb, var(--mkt-accent) 45%, var(--border));
    }
    .ne-kpi .drill-hint {
      font-size: 11px; font-weight: 600; color: var(--mkt-accent);
      margin-top: 8px; opacity: .55; transition: opacity .2s ease;
    }
    .ne-kpi.clickable:hover .drill-hint,
    .ne-kpi.clickable:focus-within .drill-hint { opacity: 1; }

    /* Deal drill-down modal (click a card → list the deals counted) */
    .deals-backdrop { display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(10, 14, 22, .55); align-items: center; justify-content: center; padding: 20px; }
    .deals-modal { width: 100%; max-width: 640px; max-height: 82vh; display: flex; flex-direction: column;
      background: var(--surface, #fff); color: var(--text, #111); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; }
    .deals-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
    .deals-modal-head h3 { margin: 0; font-size: 16px; }
    .deals-close { background: none; border: none; font-size: 24px; line-height: 1; cursor: pointer;
      color: var(--text-muted); padding: 0 2px; }
    .deals-close:hover { color: var(--text); }
    .deals-modal-body { padding: 12px 18px 18px; overflow-y: auto; }
    .deals-count { font-size: 12px; margin-bottom: 8px; }
    table.deals-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.deals-table th, table.deals-table td {
      padding: 8px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.deals-table th:first-child, table.deals-table td:first-child { text-align: left; white-space: normal; }
    table.deals-table thead th {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .05em; }
    table.deals-table tbody td { font-variant-numeric: tabular-nums; color: var(--text); }
    table.deals-table tbody tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="home.html">Home</a>
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab active" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
    <a class="tab" href="builds_monitoring.html">AI &amp; Automation</a>
  </nav>

  <div class="marketing-layout">
    <nav class="subtabs" id="marketingNav"></nav>

    <main class="content">
      <!-- Controls bar (same per-FY top toggle filter as marketing.html) -->
      <div class="card" style="margin-bottom:16px">
        <div class="mkt-controls">
          <span class="ctl-label">Financial year</span>
          <div class="segmented" id="fySeg">
            <button data-fy="all">All years</button>
            <button data-fy="fy22">FY22</button>
            <button data-fy="fy23">FY23</button>
            <button data-fy="fy24">FY24</button>
            <button data-fy="fy25">FY25</button>
            <button data-fy="fy26">FY26</button>
            <button class="active" data-fy="fy27">FY27</button>
          </div>
          <div class="spacer" style="flex:1"></div>
          <!-- <span class="muted" id="fyNote" style="font-size:13px">Data through October 2026 · October provisional until 8 November</span> -->
        </div>
      </div>

      <!-- Top 4 KPI cards -->
      <div class="ne-kpi-grid" id="neKpis"></div>

      <!-- Note between KPIs and Executive X card -->
      <p class="ne-midnote">Reported separately — not added to marketing revenue.</p>

      <!-- Executive X table card -->
      <div class="card ne-events-card">
        <div class="card-head block-head">
          <h3 id="eventsHeading">Executive X <span class="head-info"
            data-info="One row per Executive X session: internal cost, attendees, cost per attendee, bookings, revenue, and return (revenue ÷ cost). Filtered by the session's own date."
            data-src="Executive X ROI Report (Google Sheet) — static, re-seeded when the sheet changes; FY by session date (Spring Sep–Nov, Autumn Mar)."></span></h3>
        </div>
        <div class="ne-table-wrap" tabindex="0" role="region" aria-labelledby="eventsHeading">
          <table class="ne-table">
            <thead>
              <tr>
                <th>Session</th>
                <th>Internal cost</th>
                <th>Attendees</th>
                <th>Cost per attendee</th>
                <th>Bookings</th>
                <th>Revenue</th>
                <th>Return</th>
              </tr>
            </thead>
            <tbody id="eventsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Deal drill-down modal: the deals counted behind a clicked KPI card (cards 1–3) -->
  <div id="dealsBackdrop" class="deals-backdrop" onclick="if(event.target===this)closeDeals()">
    <div class="deals-modal" role="dialog" aria-modal="true" aria-labelledby="dealsTitle">
      <div class="deals-modal-head">
        <div>
          <h3 id="dealsTitle">Deals</h3>
          <div id="dealsSub" class="muted" style="font-size:12px;margin-top:2px"></div>
        </div>
        <button type="button" class="deals-close" aria-label="Close" onclick="closeDeals()">&times;</button>
      </div>
      <div id="dealsBody" class="deals-modal-body"></div>
    </div>
  </div>

  <script src="app.js?v=19"></script>
  <script>
    /* Nurture & Events.
       The TOP 4 KPI CARDS are LIVE + FY-aware (GET /api/marketing/nurture-events):
         1. Past keynote clients in nurture  = WON pipeline-3 deals (activecampaign_deals)
         2. Offsite enquiries from past clients = ALL pipeline-17 deals (post_conference_deals)
         3. Offsites booked by past clients   = WON pipeline-17 deals (post_conference_deals)
         4. Keynote → Offsite conversion      = card 3 ÷ card 1 (computed client-side)
       The Executive X table below is still SAMPLE data (page keeps its "Sample data" badge). */

    // ---- Live KPI state ------------------------------------------------------
    var NE_LIVE = null;        // { byFy:[{fyEnd,fy,keynoteClients,offsiteEnquiries,offsiteBooked}], total }
    var NE_RANGE = null;       // custom date-range roll-up (from GET …/nurture-events?from=&to=)
    var CUSTOM  = false;       // true while a custom date range is active (overrides the FY toggle)
    var NE_ERR  = false;

    function selFyKey() {
      var b = document.querySelector('#fySeg button.active');
      return b ? b.getAttribute('data-fy') : 'fy27';
    }

    // Still waiting on the data the current mode needs.
    function neLoading() { return CUSTOM ? !NE_RANGE : !NE_LIVE; }

    // The card figures for the current view: the custom range when active, else the
    // selected FY ('all' → the roll-up total).
    function neSel() {
      if (CUSTOM) return NE_RANGE || { keynoteClients: 0, offsiteEnquiries: 0, offsiteBooked: 0 };
      if (!NE_LIVE) return null;
      var key = selFyKey();
      if (key === 'all') return NE_LIVE.total;
      var end = 2000 + parseInt(key.slice(2), 10);           // 'fy27' → 2027
      var row = (NE_LIVE.byFy || []).find(function (r) { return r.fyEnd === end; });
      return row || { keynoteClients: 0, offsiteEnquiries: 0, offsiteBooked: 0 };
    }

    function numFmt(n) { return (Number(n) || 0).toLocaleString('en-AU'); }

    // One ⓘ info tool per KPI card (DESIGN_GUIDE §6) — what it is + where it comes from.
    // Indexed to match the four cards below.
    var NE_INFO = [
      { desc: 'Past keynote clients now in the nurture base: won keynote deals (Keynotes / Workshops / Immersive LIV) for the selected period.',
        source: 'GET /api/marketing/nurture-events — WON pipeline-3 deals in activecampaign_deals; FY by deal cdate.' },
      { desc: 'Post-conference offsite enquiries from past clients: all offsite deals (any status) for the selected period.',
        source: 'GET /api/marketing/nurture-events — ALL pipeline-17 (Trojan Horse: Post-Conf) deals in post_conference_deals; FY by deal cdate.' },
      { desc: 'Offsites actually booked by past clients: won post-conference offsite deals for the selected period.',
        source: 'GET /api/marketing/nurture-events — WON pipeline-17 deals in post_conference_deals; FY by deal cdate.' },
      { desc: 'Share of past keynote clients who booked an offsite = offsites booked ÷ keynote clients in nurture.',
        source: 'Computed client-side from the two cards above.' }
    ];

    // Drill-down keys for the four cards (card 4 = derived ratio → not clickable).
    var CARD_KEYS = ['keynote', 'enquiry', 'booked', null];
    var CARD_META = {
      keynote: { title: 'Past keynote clients in nurture',     sub: 'Won keynote deals · Keynotes/Workshops/Immersive (LIV)' },
      enquiry: { title: 'Offsite enquiries from past clients', sub: 'All deals · Trojan Horse: Post-Conf' },
      booked:  { title: 'Offsites booked by past clients',     sub: 'Won deals · Trojan Horse: Post-Conf' }
    };

    function renderKpiRow() {
      var cards;
      if (NE_ERR) {
        var errSub = 'Could not load';
        cards = [
          { label: 'Past keynote clients in nurture',     value: '—', sub: errSub },
          { label: 'Offsite enquiries from past clients', value: '—', sub: errSub },
          { label: 'Offsites booked by past clients',     value: '—', sub: errSub },
          { label: 'Keynote → Offsite conversion',        value: '—', sub: errSub }
        ];
      } else if (neLoading()) {
        cards = [
          { label: 'Past keynote clients in nurture',     value: '—', sub: 'Loading…' },
          { label: 'Offsite enquiries from past clients', value: '—', sub: 'Loading…' },
          { label: 'Offsites booked by past clients',     value: '—', sub: 'Loading…' },
          { label: 'Keynote → Offsite conversion',        value: '—', sub: 'Loading…' }
        ];
      } else {
        var d = neSel();
        var hasKey = d.keynoteClients > 0;
        var ratio = hasKey ? Math.round((d.offsiteBooked / d.keynoteClients) * 100) + '%' : '—';
        cards = [
          { label: 'Past keynote clients in nurture',     value: numFmt(d.keynoteClients),   sub: 'Won keynote deals · Keynotes/Workshops/Immersive (LIV)', pos: true },
          { label: 'Offsite enquiries from past clients', value: numFmt(d.offsiteEnquiries), sub: 'All deals · Trojan Horse: Post-Conf',                     pos: true },
          { label: 'Offsites booked by past clients',     value: numFmt(d.offsiteBooked),    sub: 'Won deals · Trojan Horse: Post-Conf',                     pos: true },
          { label: 'Keynote → Offsite conversion',        value: ratio,
            sub: hasKey ? (numFmt(d.offsiteBooked) + ' of ' + numFmt(d.keynoteClients) + ' keynote clients') : 'No keynote clients in period', pos: hasKey }
        ];
      }
      var clickable = !NE_ERR && !neLoading();   // only drill in once data is loaded
      var html = cards.map(function (k, i) {
        var subCls = k.pos ? 'sub pos' : 'sub';
        var info = NE_INFO[i] || {};
        var ck = CARD_KEYS[i];                    // null for card 4 (the derived ratio)
        var isLink = clickable && ck;
        var cls = isLink ? 'ne-kpi clickable' : 'ne-kpi';
        var attrs = isLink ? ' data-card="' + ck + '" role="button" tabindex="0"' : '';
        var hint = isLink ? '<div class="drill-hint">View deals →</div>' : '';
        return '<div class="' + cls + '"' + attrs + '>' +
          '<div class="label">' + esc(k.label) + infoTip(info.desc, info.source) + '</div>' +
          '<div class="value">' + esc(k.value) + '</div>' +
          '<div class="' + subCls + '">' + esc(k.sub) + '</div>' + hint +
        '</div>';
      }).join('');
      document.getElementById('neKpis').innerHTML = html;
    }

    function loadLiveCards() {
      fetchJSON('/api/marketing/nurture-events').then(function (d) {
        NE_LIVE = d || { byFy: [], total: { keynoteClients: 0, offsiteEnquiries: 0, offsiteBooked: 0 } };
        NE_ERR = false;
        renderKpiRow();
      }).catch(function () {
        NE_ERR = true;
        renderKpiRow();
      });
    }

    // ---- Executive X table — REAL data, one row per session --------------------
    // Source: "Executive X ROI Report" Google Sheet (one tab per session). Each
    // attendee pays a fixed per-head internal cost; a session's revenue is the sum
    // of bookings its attendees' orgs generated. STATIC — re-seed from the sheet
    // when it changes (the dashboard has no live Google Sheets access).
    // FY = the session's own date (AU FY, Jul–Jun, END-year): Spring = Sep–Nov,
    // Autumn = Mar. Bookings themselves may land in later FYs.
    // `date` = the session's nominal date (Spring ≈ Oct of its year, Autumn ≈ Mar) —
    // used only to filter by a custom date range; FY filtering still uses `fy`.
    var EXEC_X = [
      { session: 'Spring 2023', fy: 'fy24', date: '2023-10-01', cost: 29940, attendees: 12, perPerson: 2495, bookings: 3, revenue: 48400 },
      { session: 'Autumn 2024', fy: 'fy24', date: '2024-03-01', cost: 22455, attendees: 9,  perPerson: 2495, bookings: 3, revenue: 93970 },
      { session: 'Spring 2024', fy: 'fy25', date: '2024-10-01', cost: 11000, attendees: 11, perPerson: 1000, bookings: 1, revenue: 4500 },
      { session: 'Autumn 2025', fy: 'fy25', date: '2025-03-01', cost: 14066, attendees: 12, perPerson: 1173, bookings: 4, revenue: 111700 },
      { session: 'Spring 2025', fy: 'fy26', date: '2025-10-01', cost: 14167, attendees: 13, perPerson: 1090, bookings: 4, revenue: 49950 },
      { session: 'Autumn 2026', fy: 'fy26', date: '2026-03-01', cost: 14264, attendees: 10, perPerson: 1426, bookings: 2, revenue: 14500 }
    ];

    function aud(n) { return '$' + (Number(n) || 0).toLocaleString('en-AU'); }

    function execXRows() {
      if (CUSTOM) {
        var r = getDateRange();
        return EXEC_X.filter(function (e) {
          return (!r.from || e.date >= r.from) && (!r.to || e.date <= r.to);
        });
      }
      var key = selFyKey();
      if (key === 'all') return EXEC_X;
      return EXEC_X.filter(function (e) { return e.fy === key; });
    }

    function renderEventsTable() {
      var rows = execXRows();
      if (!rows.length) {
        document.getElementById('eventsBody').innerHTML =
          '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:18px">' +
          'No Executive X sessions in this period.</td></tr>';
        return;
      }
      var rowsHtml = rows.map(function (ev) {
        var ret = ev.cost > 0 ? (ev.revenue / ev.cost).toFixed(1) + '×' : '—';
        return '<tr>' +
          '<td>' + esc(ev.session) + '</td>' +
          '<td>' + esc(aud(ev.cost)) + '</td>' +
          '<td>' + esc(ev.attendees) + '</td>' +
          '<td>' + esc(aud(ev.perPerson)) + '</td>' +
          '<td>' + esc(ev.bookings) + '</td>' +
          '<td>' + esc(aud(ev.revenue)) + '</td>' +
          '<td>' + esc(ret) + '</td>' +
        '</tr>';
      }).join('');
      document.getElementById('eventsBody').innerHTML = rowsHtml;
    }

    // ---- Card drill-down modal: the deals counted behind cards 1–3 --------------
    // Deals come from NE_LIVE.deals (the full, unfiltered lists loaded at init) and
    // are filtered client-side the SAME way the card count is — by the active FY, or
    // by the custom date range when one is set — so the list matches the number.
    function dealsForCard(cardKey) {
      var all = (NE_LIVE && NE_LIVE.deals) || { keynote: [], offsite: [] };
      var rows = (cardKey === 'keynote' ? all.keynote : all.offsite).slice();
      if (cardKey === 'booked') rows = rows.filter(function (d) { return d.won; });
      if (CUSTOM) {
        var r = getDateRange();
        rows = rows.filter(function (d) {
          return (!r.from || d.date >= r.from) && (!r.to || d.date <= r.to);
        });
      } else {
        var key = selFyKey();
        if (key !== 'all') {
          var end = 2000 + parseInt(key.slice(2), 10);
          rows = rows.filter(function (d) { return d.fyEnd === end; });
        }
      }
      return rows;
    }

    function showDeals(cardKey) {
      var meta = CARD_META[cardKey];
      if (!meta) return;
      var scope = CUSTOM ? 'selected range' : (selFyKey() === 'all' ? 'all years' : selFyKey().toUpperCase());
      document.getElementById('dealsTitle').textContent = meta.title;
      document.getElementById('dealsSub').textContent = meta.sub + ' · ' + scope;
      var body = document.getElementById('dealsBody');
      if (neLoading()) {
        body.innerHTML = '<div class="muted" style="padding:8px 0">Loading…</div>';
      } else {
        var rows = dealsForCard(cardKey);
        if (!rows.length) {
          body.innerHTML = '<div class="muted" style="padding:8px 0">No deals in the ' + esc(scope) + '.</div>';
        } else {
          var showStatus = cardKey === 'enquiry';   // only the enquiry card mixes statuses
          var head = '<tr><th>Deal</th>' + (showStatus ? '<th>Status</th>' : '') +
            '<th>Value</th><th>Created</th></tr>';
          var trs = rows.map(function (d) {
            var label = d.title || d.org || ('Deal ' + d.dealId);
            return '<tr>' +
              '<td>' + esc(label) + '</td>' +
              (showStatus ? '<td>' + esc(d.status || '—') + '</td>' : '') +
              '<td>' + esc(d.value ? aud(d.value) : '—') + '</td>' +
              '<td>' + esc(d.date || '—') + '</td>' +
            '</tr>';
          }).join('');
          body.innerHTML =
            '<div class="deals-count muted">' + rows.length + ' deal' + (rows.length === 1 ? '' : 's') + '</div>' +
            '<div class="ne-table-wrap"><table class="deals-table"><thead>' + head +
            '</thead><tbody>' + trs + '</tbody></table></div>';
        }
      }
      document.getElementById('dealsBackdrop').style.display = 'flex';
    }
    function closeDeals() {
      var b = document.getElementById('dealsBackdrop');
      if (b) b.style.display = 'none';
    }

    function renderAll() {
      renderKpiRow();
      renderEventsTable();
    }

    // Custom date range (beside the FY toggle). When a range is set it overrides the FY
    // toggle: refetch the day-level roll-up with ?from=&to= and render it; clearing the
    // range restores FY mode. All of this page's data is day-level, so nothing is greyed.
    function applyRange() {
      CUSTOM = dateRangeActive();
      if (!CUSTOM) { renderAll(); return; }
      NE_RANGE = null; NE_ERR = false; renderAll();   // show "Loading…"
      fetchJSON('/api/marketing/nurture-events' + dateRangeQS()).then(function (d) {
        NE_RANGE = (d && d.range) || { keynoteClients: 0, offsiteEnquiries: 0, offsiteBooked: 0 };
        renderAll();
      }).catch(function () { NE_ERR = true; renderAll(); });
    }

    function wireSeg(id, onChange) {
      var seg = document.getElementById(id);
      if (!seg) return;
      seg.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          if (onChange) onChange();
        });
      });
    }

    initPage('marketing');
    renderMarketingHead(true);
    renderMarketingSidebar('nurture-events');
    renderDateRange();
    fillHeadInfo();        // fill the static table ⓘ info tool (§6); KPI cards get theirs in renderKpiRow
    renderAll();
    loadLiveCards();
    wireSeg('fySeg', renderAll);
    wireDateRange({ onChange: applyRange });

    // Open the deal drill-down when a clickable card (1–3) is activated.
    var neKpisEl = document.getElementById('neKpis');
    neKpisEl.addEventListener('click', function (e) {
      var card = e.target.closest('.ne-kpi.clickable');
      if (card) showDeals(card.getAttribute('data-card'));
    });
    neKpisEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.ne-kpi.clickable');
      if (card) { e.preventDefault(); showDeals(card.getAttribute('data-card')); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDeals();
    });
  </script>
</body>
</html>
