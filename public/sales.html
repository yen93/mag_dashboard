<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conferences — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    /* The LIV deals table is a wide 13-column table — let it use the full screen
       width instead of the default 1200px cap, so the table grows as the window
       grows (it still scrolls horizontally on narrow screens). Matches the
       Buyer Sheet page. */
    .content { max-width: none; }
  </style>
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab" href="sales_overview.html">Sales</a>
    <a class="tab" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
    <a class="tab" href="mag_buyer_sheet.html">Buyer Sheet</a>
    <a class="tab" href="invoice_tracking.html">Invoices</a>
    <a class="tab active" href="sales.html">Conferences</a>
    <a class="tab" href="ga4_agent.html">GA4 Agent</a>
    <a class="tab" href="ac_contact_sources.html">Historical Paid Leads Tracking</a>
    <a class="tab" href="new_paid_leads_tracking.html">New Paid Leads Tracking</a>
    <a class="tab" href="mag_sales_pulse.html">MAG Sales Pulse</a>
  </nav>

  <main class="content">
    <div class="grid" style="margin-bottom:16px">
      <div class="card col-12">
        <div class="card-head">
          <h3>Keynotes // Workshops // Immersive (LIV)</h3>
          <span class="chips" id="livChips"></span>
          <div class="spacer"></div>
          <span class="muted" id="livCount" style="font-size:13px"></span>
        </div>
        <div id="livDeals"></div>
      </div>
    </div>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=2"></script>
  <script>
    function setChips(id, meta) { var el = document.getElementById(id); if (el) el.innerHTML = metaChips(meta); }

    // ---- LIV pipeline deals table (own endpoint) ----
    function livStatusPill(s) {
      var cls = s === 'won' ? 'pos' : s === 'lost' ? 'neg' : '';
      return '<span class="pill ' + cls + '">' + esc(s || '—') + '</span>';
    }
    function livText(v) { return v ? esc(v) : '—'; }
    function livNote(v) {
      if (!v) return '—';
      var t = String(v), short = t.length > 90 ? t.slice(0, 90) + '…' : t;
      return '<span title="' + esc(t) + '">' + esc(short) + '</span>';
    }

    function loadLivDeals() {
      var host = document.getElementById('livDeals');
      host.innerHTML = '<div class="muted" style="padding:14px">Loading deals…</div>';
      fetchJSON('/api/sales/deals').then(function (data) {
        setChips('livChips', data.deals.meta);
        renderSortableTable('livDeals', data.deals.data || [], [
          { key: 'dateCreated', label: 'Created', unit: 'date' },
          { key: 'account', label: 'Account', render: livText },
          { key: 'leadType', label: 'Lead type', render: livText },
          { key: 'contact', label: 'Primary contact', render: livText },
          { key: 'jobTitle', label: 'Job title', render: livText },
          { key: 'lastNote', label: 'Last note', render: livNote },
          { key: 'lastNoteDate', label: 'Note date', unit: 'date' },
          { key: 'owner', label: 'Owner', render: livText },
          { key: 'replied', label: 'Replied', render: livText },
          { key: 'status', label: 'Status', render: livStatusPill },
          { key: 'demoDate', label: 'Demo date', unit: 'date' },
          { key: 'magalogSent', label: 'Magalog', render: livText },
          { key: 'proposalSent', label: 'Proposal', render: livText },
        ], {
          searchPlaceholder: 'Search deals…',
          sortKey: 'dateCreated', sortDir: 'desc',
          emptyText: 'No 2026 deals in this pipeline.',
          onCount: function (shown, total) {
            var el = document.getElementById('livCount');
            if (el) el.textContent = shown === total ? (total + ' deals') : (shown + ' of ' + total + ' deals');
          },
        });
      }).catch(function (err) {
        console.error(err);
        host.innerHTML = '<div class="needs-setup"><strong>Couldn’t load deals</strong><span>' + esc(err.message) + '</span></div>';
      });
    }

    initPage('sales'); // login / top-bar / theme only — this page renders its own table
    if (currentUser()) loadLivDeals();
  </script>
</body>
</html>
