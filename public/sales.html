<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales — MAG Metrics</title>
  <link rel="stylesheet" href="app.css" />
  <script>try { var t = localStorage.getItem('mag_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> MAG Metrics</div>
    <div class="spacer"></div>
    <span class="user-chip" id="userName"></span>
    <button class="icon-btn" id="themeBtn">☾ Dark</button>
    <button class="icon-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabbar">
    <a class="tab active" href="sales.html">Sales</a>
    <a class="tab" href="marketing.html">Marketing</a>
    <a class="tab" href="operations.html">Operations</a>
  </nav>

  <main class="content">
    <div class="toolbar">
      <strong>Sales overview</strong>
      <div class="spacer"></div>
      <span class="muted" style="font-size:13px">Period</span>
      <div class="segmented" id="rangeToggle">
        <button data-range="3m">3M</button>
        <button data-range="6m">6M</button>
        <button data-range="12m">12M</button>
        <button data-range="ytd">YTD</button>
      </div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="grid" style="margin-bottom:16px">
      <div class="card col-12">
        <div class="card-head">
          <h3>LIV pipeline deals — 2026</h3>
          <span class="chips" id="livChips"></span>
          <div class="spacer"></div>
          <span class="muted" id="livCount" style="font-size:13px"></span>
        </div>
        <div id="livDeals"></div>
      </div>
    </div>

    <div class="grid" style="margin-bottom:16px">
      <div class="card col-12">
        <div class="card-head">
          <h3>Deals over time</h3>
          <span class="chips" id="trendChips"></span>
          <div class="spacer"></div>
          <div class="segmented" data-view-for="deals">
            <button data-view="chart" class="active">Chart</button>
            <button data-view="table">Table</button>
          </div>
        </div>
        <div class="chart-box" id="deals-chart"><canvas id="dealsCanvas"></canvas></div>
        <div id="deals-table" hidden></div>
      </div>
    </div>

    <div class="grid">
      <div class="card col-8">
        <div class="card-head"><h3>Won revenue by month</h3><span class="chips" id="revChips"></span></div>
        <div class="chart-box short"><canvas id="revenueCanvas"></canvas></div>
      </div>
      <div class="card col-4">
        <div class="card-head"><h3>Direct vs indirect</h3><span class="chips" id="diChips"></span></div>
        <div class="chart-box short"><canvas id="diCanvas"></canvas></div>
      </div>

      <div class="card col-7">
        <div class="card-head"><h3>Lead source &amp; conversion</h3><span class="chips" id="srcChips"></span></div>
        <div id="sourceTable"></div>
      </div>
      <div class="card col-5">
        <div class="card-head"><h3>New inquiries per month</h3><span class="chips" id="inqChips"></span></div>
        <div class="chart-box short"><canvas id="inquiriesCanvas"></canvas></div>
      </div>

      <div class="card col-7">
        <div class="card-head"><h3>Outbound outreach per week</h3><span class="chips" id="outChips"></span></div>
        <div class="chart-box short"><canvas id="outboundCanvas"></canvas></div>
      </div>
      <div class="card col-5">
        <div class="card-head"><h3>Demos delivered per month</h3><span class="chips" id="demoChips"></span></div>
        <div class="chart-box short"><canvas id="demosCanvas"></canvas></div>
      </div>

      <div class="card col-6">
        <div class="card-head"><h3>Google Ads inquiries</h3><span class="chips" id="gadsChips"></span></div>
        <div id="gads-body"></div>
      </div>
      <div class="card col-6">
        <div class="card-head"><h3>Replies per week</h3><span class="chips" id="repliesChips"></span></div>
        <div id="replies-body"></div>
      </div>
    </div>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
  <script>
    function setChips(id, meta) { var el = document.getElementById(id); if (el) el.innerHTML = metaChips(meta); }
    var MONTH = { xKey: 'month', xLabel: monthLabel };

    function renderSales(data) {
      renderKpis('kpis', [
        { label: 'Deals created', metric: data.kpis.created },
        { label: 'Deals won', metric: data.kpis.won },
        { label: 'Win rate', metric: data.kpis.winRate },
        { label: 'Won value', metric: data.kpis.wonValue },
        { label: 'Avg deal size', metric: data.kpis.avgDeal },
        { label: 'Open pipeline', metric: data.kpis.openPipeline },
      ]);

      // Deals over time (chart + table)
      setChips('trendChips', data.trend.meta);
      var trend = data.trend.data;
      var series = [
        { key: 'created', label: 'Created', color: '#3b6ef0' },
        { key: 'won', label: 'Won', color: '#17a673' },
        { key: 'lost', label: 'Lost', color: '#e2483d' },
      ];
      lineChart('dealsCanvas', trend, series, MONTH);
      wireViewToggle('deals', function () {
        renderTable('deals-table', trend, [{ key: 'month', label: 'Month', render: monthLabel }]
          .concat(series.map(function (s) { return { key: s.key, label: s.label, unit: 'count' }; }))
          .concat([{ key: 'revenue', label: 'Revenue', unit: 'currency' }]));
      });

      // Revenue by month
      setChips('revChips', data.trend.meta);
      barChart('revenueCanvas', trend.map(function (d) { return monthLabel(d.month); }),
        trend.map(function (d) { return d.revenue; }));

      // Direct vs indirect
      setChips('diChips', data.directIndirect.meta);
      pieChart('diCanvas', data.directIndirect.data);

      // Lead source table
      setChips('srcChips', data.sources.meta);
      renderTable('sourceTable', data.sources.data, [
        { key: 'source', label: 'Source' },
        { key: 'deals', label: 'Deals', unit: 'count' },
        { key: 'won', label: 'Won', unit: 'count' },
        { key: 'winRate', label: 'Win %', unit: 'percent' },
      ]);

      // Inquiries per month
      setChips('inqChips', data.leadsTrend.meta);
      barChart('inquiriesCanvas', data.leadsTrend.data.map(function (d) { return monthLabel(d.month); }),
        data.leadsTrend.data.map(function (d) { return d.leads; }));

      // Outbound per week
      setChips('outChips', data.outbound.meta);
      barChart('outboundCanvas', data.outbound.data.map(function (d) { return weekLabel(d.week); }),
        data.outbound.data.map(function (d) { return d.sends; }), { colors: '#7c5cff' });

      // Demos per month
      setChips('demoChips', data.demos.meta);
      barChart('demosCanvas', data.demos.data.map(function (d) { return monthLabel(d.month); }),
        data.demos.data.map(function (d) { return d.demos; }), { colors: '#17a673' });

      // Pending tiles
      setChips('gadsChips', data.googleAds.meta); renderPendingBody('gads-body', data.googleAds.meta);
      setChips('repliesChips', data.replies.meta); renderPendingBody('replies-body', data.replies.meta);
    }

    // ---- LIV pipeline deals table (own endpoint; independent of the period toggle) ----
    function livStatusPill(s) {
      var cls = s === 'won' ? 'pos' : s === 'lost' ? 'neg' : '';
      return '<span class="pill ' + cls + '">' + esc(s || '—') + '</span>';
    }
    function livText(v) { return v ? esc(v) : '—'; }
    function livNote(v) {
      if (!v) return '—';
      var t = String(v), short = t.length > 90 ? t.slice(0, 90) + '…' : t;
      return '<span title="' + esc(t) + '">' + esc(short) + '</span>';
    }

    function loadLivDeals() {
      var host = document.getElementById('livDeals');
      host.innerHTML = '<div class="muted" style="padding:14px">Loading deals…</div>';
      fetchJSON('/api/sales/deals').then(function (data) {
        setChips('livChips', data.deals.meta);
        renderSortableTable('livDeals', data.deals.data || [], [
          { key: 'dateCreated', label: 'Created', unit: 'date' },
          { key: 'account', label: 'Account', render: livText },
          { key: 'leadType', label: 'Lead type', render: livText },
          { key: 'contact', label: 'Primary contact', render: livText },
          { key: 'jobTitle', label: 'Job title', render: livText },
          { key: 'lastNote', label: 'Last note', render: livNote },
          { key: 'lastNoteDate', label: 'Note date', unit: 'date' },
          { key: 'owner', label: 'Owner', render: livText },
          { key: 'replied', label: 'Replied', render: livText },
          { key: 'status', label: 'Status', render: livStatusPill },
          { key: 'demoDate', label: 'Demo date', unit: 'date' },
          { key: 'magalogSent', label: 'Magalog', render: livText },
          { key: 'proposalSent', label: 'Proposal', render: livText },
        ], {
          searchPlaceholder: 'Search deals…',
          sortKey: 'dateCreated', sortDir: 'desc',
          emptyText: 'No 2026 deals in this pipeline.',
          onCount: function (shown, total) {
            var el = document.getElementById('livCount');
            if (el) el.textContent = shown === total ? (total + ' deals') : (shown + ' of ' + total + ' deals');
          },
        });
      }).catch(function (err) {
        console.error(err);
        host.innerHTML = '<div class="needs-setup"><strong>Couldn’t load deals</strong><span>' + esc(err.message) + '</span></div>';
      });
    }

    initPage('sales', renderSales);
    if (currentUser()) loadLivDeals();
  </script>
</body>
</html>
